/* ---------------------------------------------------------------- MASTER PACK ---
   Up to two units travel in one master carton, so the screen has to accept two
   labels and let the operator check each line before it is sent. Scanning fills the
   row; the operator confirms or corrects it. Nothing is shipped from an unconfirmed
   row - the whole point of showing the table is that a human agrees with it. */
const MASTER_PACK_MAX = 2;

SCANFIELDS["sh-scan"] = {
  label:"device in the master pack",
  onCode(code, wasManual){
    if(!SH) return;
    SH.lines = SH.lines || [];
    if(SH.lines.length >= MASTER_PACK_MAX){
      showWhy("sh-why", "A master pack holds " + MASTER_PACK_MAX + " units. Remove one first.");
      return render();
    }
    let parsed = null, problem = "";
    try{
      parsed = window.DeviceQr.parseDeviceQr(code);
    }catch(e){
      /* A mismatched or unreadable label is refused outright rather than accepted as
         a hand-typed value: a wrong size here is a wrong implant later. */
      problem = e.message || "That label could not be read.";
    }
    if(!parsed){
      showWhy("sh-why", problem);
      return render();
    }
    if(SH.lines.some(l => l.sn === parsed.sn)){
      showWhy("sh-why", "That unit is already in this master pack.");
      return render();
    }
    const known = S.db.devices.find(d => String(d.sn).toUpperCase() === parsed.sn);
    SH.lines.push({
      sn: parsed.sn, ref: parsed.ref,
      size: parsed.size, productType: parsed.productType,
      expiration: parsed.expiryDate, mfgDate: parsed.mfgDate,
      deviceId: known ? known.id : "",
      expired: parsed.expired,
      handEntered: !!wasManual,
      confirmed: false
    });
    clearWhy("sh-why");
    delete MANUAL_OPEN["sh-scan"];
    render();
  }
};

function masterPackCard(){
  SH.lines = SH.lines || [];
  const full = SH.lines.length >= MASTER_PACK_MAX;
  const fromName = SH.originId ? locName(SH.originId) : "—";
  const toName   = SH.destId   ? locName(SH.destId)   : "—";

  let rows = "";
  if(!SH.lines.length){
    rows = '<tr><td colspan="7" class="hint" style="padding:14px">' +
           'Nothing scanned yet. Scan the QR code on each unit going into this carton.</td></tr>';
  }else{
    rows = SH.lines.map((l, i) => {
      const unknown = !l.deviceId;
      return '<tr' + (l.confirmed ? '' : ' class="row-unconfirmed"') + '>' +
        '<td class="mono">' + esc(l.sn) + (l.handEntered ?
            ' <span class="badge p-orange">hand-entered</span>' : '') + '</td>' +
        '<td>' + esc(l.productType + " " + l.size) +
          '<div class="hint">' + esc(l.ref) + '</div></td>' +
        '<td class="mono">' + esc(l.expiration) +
          (l.expired ? ' <span class="badge p-red">expired</span>' : '') + '</td>' +
        '<td>' + esc(fromName) + '</td>' +
        '<td>' + esc(toName) + '</td>' +
        '<td>' + (unknown
            ? '<span class="badge p-orange">not in stock here</span>'
            : '<label class="check' + (l.confirmed ? " on" : "") + '" style="margin:0">' +
              '<input type="checkbox" data-mpc="' + i + '"' + (l.confirmed ? " checked" : "") + '>' +
              '<span>Correct</span></label>') + '</td>' +
        '<td><button class="btn btn-sm" data-mpx="' + i + '">Remove</button></td>' +
        '</tr>';
    }).join("");
  }

  return '<div class="card"><div class="card-hd"><h2>Step 1b · Devices in this master pack</h2>' +
    '<span class="hint">' + SH.lines.length + ' of ' + MASTER_PACK_MAX + '</span></div>' +
    '<div class="card-bd">' +
    '<p class="hint">Two units may be packed in one master carton. Scanning reads the ' +
    'REF and the serial number and checks them against each other — a label whose REF ' +
    'and SN disagree about the size is refused, not guessed at.</p>' +
    (full ? '<div class="info">The carton is full. Remove a line to scan a different unit.</div>'
          : scanField("sh-scan", "Scan the device QR code", "", {})) +
    '<div class="tbl-wrap" style="margin-top:10px"><table><thead><tr>' +
      '<th>Device SN</th><th>Device Size</th><th>Expiration Date</th>' +
      '<th>From</th><th>To</th><th>Confirmed</th><th></th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
    (SH.lines.length && SH.lines.some(l => !l.confirmed)
      ? '<div class="warn" style="margin-top:9px">Every line has to be confirmed before the ' +
        'carton can be sent.</div>' : "") +
    (SH.lines.some(l => l.expired)
      ? '<div class="warn">A unit in this carton is past its expiry date. It cannot be sent.</div>' : "") +
    '</div></div>';
}

function wireMasterPack(){
  $$("[data-mpc]").forEach(cb => cb.onchange = () => {
    SH.lines[+cb.dataset.mpc].confirmed = cb.checked;
    clearWhy("sh-why"); saveDrafts(); render();
  });
  $$("[data-mpx]").forEach(b => b.onclick = () => {
    SH.lines.splice(+b.dataset.mpx, 1);
    clearWhy("sh-why"); saveDrafts(); render();
  });
}

function inTransitTable(){
  const t = S.db.devices.filter(d => d.status === "ON_WAY" || d.status === "DELIVERED");
  if(!t.length) return '<div class="empty">Nothing in transit.</div>';
  return '<div class="tbl-wrap" style="border:0;border-radius:0"><table><thead><tr>' +
    '<th>Ref</th><th>Product</th><th>From</th><th>To</th><th>Shipped by</th><th>Status</th></tr></thead><tbody>' +
    t.map(d => '<tr><td class="mono">' + esc(d.ref) + '</td><td>' + esc(devName(d)) + '</td>' +
      '<td>' + esc(d.shippedFromId ? locName(d.shippedFromId) : "—") + '</td>' +
      '<td>' + esc(locName(d.locationId)) + '</td><td>' + esc(d.shippedBy || "—") + '</td>' +
      '<td>' + pill(DEV_STATUS, d.status) + '</td></tr>').join("") +
    '</tbody></table></div>';
}
function doShip(){
  const pick = SH.originId ? fifoPick(SH.productType, SH.size, SH.originId) : null;
  const d = SH.deviceId ? device(SH.deviceId) : pick;
  if(!SH.originId) return showWhy("sh-why", "Step 1 — choose where the unit is coming from.");
  if(!SH.destId)   return showWhy("sh-why", "Step 1 — choose where it is going.");
  if(!SH.shipper.trim()) return showWhy("sh-why", "Step 2 — record who is sending it.");
  const bypassing = !d || (pick && d.id !== pick.id);
  if(bypassing){
    if(!can("overrideFifo"))
      return showWhy("sh-why", "There is no matching unit here, and only a Clinical PM or " +
        "App Admin can override that. Ask one of them, or ship stock in first.");
    if(!SH.override) return showWhy("sh-why", "Step 2 — this is not the proposed unit, so tick " +
      "the override box and say why.");
    if(!SH.initials.trim() || !SH.reason.trim())
      return showWhy("sh-why", "Step 2 — an override needs both your initials and a reason.");
  }
  if(!d) return showWhy("sh-why", "There is no unit available to send.");
  /* When the carton has been scanned, it is the authority on what is being sent. */
  const lines = (SH.lines || []);
  if(lines.length){
    if(lines.some(l => !l.deviceId))
      return showWhy("sh-why", "A scanned unit is not in stock at this location. Remove it, " +
        "or check it in on the Receive a Delivery screen first.");
    if(lines.some(l => !l.confirmed))
      return showWhy("sh-why", "Step 1b — confirm every line in the master pack.");
    if(lines.some(l => l.expired))
      return showWhy("sh-why", "Step 1b — a unit in this carton is past its expiry date.");
  }
  clearWhy("sh-why");

  const from = SH.originId, to = SH.destId;
  const shipper = SH.shipper.trim();
  const at = nowISO();
  /* If the carton was scanned, every confirmed line ships. Otherwise the single
     FIFO-proposed unit does. One code path either way, so the audit trail, the
     notification and the backup record are identical in both cases. */
  const units = lines.length ? lines.map(l => device(l.deviceId)).filter(Boolean) : [d];
  const packId = units.length > 1 ? "MP-" + Date.now().toString(36).toUpperCase() : "";

  units.forEach(u => {
    const before = u.status;
    u.status = "ON_WAY"; u.locationId = to;
    u.shippedBy = shipper; u.shippedFromId = from; u.shippedAt = at;
    if(packId) u.masterPackId = packId;

    logAction("Shipped " + u.ref + " (" + devName(u) + ") to " + locName(to), {
      locationId: from,
      stateChanges: DEV_STATUS[before].label + " → In Transit",
      comments: (packId ? "master pack " + packId + " (" + units.length + " units) — " : "") +
        (bypassing ? ("FIFO OVERRIDE by " + S.me.email + " (initialled " +
          SH.initials.trim().toUpperCase() + ") — " + SH.reason)
        : lines.length ? "scanned and confirmed" : "FIFO proposal accepted"),
      highPriority: bypassing
    });
    queueBackup(locName(from) + "/Inventory_Logs", "shipment_" + u.sn + "_" + Date.now() + ".json", {
      type:"SHIPMENT_RECORD",
      device:{ id:u.id, ref:u.ref, sn:u.sn, mfgDate:u.mfgDate, product:devName(u), expiration:u.expiration },
      masterPackId: packId || null, unitsInPack: units.length,
      from:locName(from), to:locName(to), shippedBy:shipper, shippedAt:at,
      identifierSource: lines.length
        ? ((lines.find(l => l.deviceId === u.id) || {}).handEntered ? "hand-entered" : "scanned")
        : "fifo-proposed",
      fifoOverride:bypassing, overrideReason: bypassing ? SH.reason : null,
      overrideInitials: bypassing ? SH.initials.trim().toUpperCase() : null, actor:S.me.email
    });
  });

  notify("Shipment inbound: " + units.map(u => devName(u) + " (" + u.ref + ")").join(", ") +
         " from " + locName(from) + ", shipped by " + shipper + ".",
         ["ADMIN","CPM","EMPLOYEE"], [], to);
  commit();
  /* Amber, not red: an override shipment succeeded, it just carries a note. */
  toast(bypassing ? "Sent, with the override recorded."
                  : units.length > 1 ? "Sent — " + units.length + " units in one carton." : "Sent.",
        bypassing ? "warn" : "good");
  resetShip(); renderNav(); render();
}

  b.innerHTML =

    if(!ref || !siteId || !name || !phone) return showWhy("dl-why", "Every field is required.");
    clearWhy("dl-why");
    const site = loc(siteId);

    /* An unrecognised reference used to fall through this whole block, recording
       nothing at all, while the confirmation screen still told the courier the team
       had been notified. A device had physically arrived and the system did not know.
       Both branches now write a notification, an audit line and a backup record. */

        action:"Delivery reported for an unrecognised product ID “" + ref + "”",

        ts:nowISO(), synced:false, syncNote:"Queued" });
      saveDB(S.db);
    }

    if(d){
      d.locationId = siteId;
      /* Deliberately NOT usable stock: this person performs none of the sterile
         barrier, expiry or ID-match checks. */
      d.status = "DELIVERED";
      const shipper = S.db.users.find(u => u.name === d.shippedBy);
      const cpm = site.cpmUserId ? user(site.cpmUserId) : null;
      S.db.notifications.unshift({ id:uid("ntf"), ts:nowISO(),

        forRoles:["ADMIN","CPM"], locationId:siteId, read:false,
        forUserIds:[shipper && shipper.id, cpm && cpm.id].filter(Boolean) });
      S.db.logs.unshift({ id:uid("log"), timestamp:nowISO(),
        action:"Delivery reported by a non-employee for " + d.ref, locationId:siteId,
        userName:name + " (no account)", role:"DELIVERY_RECIPIENT",
        stateChanges:"→ Delivered (unverified)", comments:"Phone " + phone, highPriority:false });
      S.db.backupQueue.unshift({ id:uid("bkp"), path:site.name + "/Condition_Reports",
        filename:"delivery_report_" + d.ref + "_" + Date.now() + ".json",

let FL = { locType:"", product:"", status:"", q:"" };

function stockCols(){
  return visibleLocations().filter(l =>
    (!FL.locType || l.type === FL.locType) &&
    (!FL.q || l.name.toLowerCase().includes(FL.q.toLowerCase())));
}
function stockCount(productType, size, locationId){
  return S.db.devices.filter(d =>
    d.productType === productType && d.size === size && d.locationId === locationId &&
    (FL.status ? d.status === FL.status : DEV_STATUS[d.status].stock)).length;
}
VIEWS.stock = {
  title(){ return S.me.role === "WH_ADMIN" ? "My Warehouse Stock" : "Stock by Location"; },
  sub:"How many of each size are where. The header row and first column stay put as you scroll.",
  body(){
    const cols = stockCols();
    const prods = PRODUCTS.filter(p => !FL.product || p.key === FL.product);
    const live = visibleDevices().filter(d => DEV_STATUS[d.status].stock).length;
    const unver = visibleDevices().filter(d => d.status === "DELIVERED").length;
    const transit = visibleDevices().filter(d => d.status === "ON_WAY").length;
    const exp = visibleDevices().filter(d => d.status === "EXPIRED").length;

    let h = '<div class="grid g4">' +
      [["Usable stock",live,"p-green"],["In transit",transit,"p-orange"],
       ["Delivered (unverified)",unver,"p-orange"],["Expired",exp,"p-red"]].map(([l,v,c]) =>
        '<div class="card" style="margin:0"><div class="card-bd">' +
          '<div class="hint" style="margin:0 0 3px">' + esc(l) + '</div>' +
          '<div style="font-size:26px;font-weight:700">' + v + '</div>' +
          '<span class="pill ' + c + '">' + esc(l) + '</span></div></div>').join("") +
      '</div><div style="height:14px"></div>';

    h += '<div class="card"><div class="card-bd"><div class="grid g4" style="margin:0">' +
      '<div class="field" style="margin:0"><label for="f-lt">Location type</label><select id="f-lt">' +
        [["","All"],["WAREHOUSE","Warehouses"],["SITE","Hospital sites"]].map(([v,l]) =>
          '<option value="' + v + '"' + (FL.locType === v ? " selected" : "") + '>' + l + '</option>').join("") +
        '</select></div>' +
      '<div class="field" style="margin:0"><label for="f-p">Product</label><select id="f-p">' +
        '<option value=""' + (FL.product === "" ? " selected" : "") + '>All products</option>' +
        PRODUCTS.map(p => '<option value="' + p.key + '"' + (FL.product === p.key ? " selected" : "") + '>' +
          esc(p.label) + '</option>').join("") + '</select></div>' +
      '<div class="field" style="margin:0"><label for="f-s">Device status</label><select id="f-s">' +
        '<option value=""' + (FL.status === "" ? " selected" : "") + '>Live stock only</option>' +
        Object.keys(DEV_STATUS).map(k => '<option value="' + k + '"' + (FL.status === k ? " selected" : "") +
          '>' + esc(DEV_STATUS[k].label) + '</option>').join("") + '</select></div>' +
      '<div class="field" style="margin:0"><label for="f-q">Search site name</label>' +
        '<input type="text" id="f-q" value="' + esc(FL.q) + '" placeholder="type to filter columns"></div>' +
    '</div></div></div>';

    if(!cols.length) return h + '<div class="empty">No locations match the filters.</div>';

    h += '<div class="tbl-wrap" style="max-height:62vh"><table class="matrix"><thead><tr>' +
      '<th>Product / size</th>' + cols.map(c => '<th class="num">' + esc(c.name) + '</th>').join("") +
      '<th class="num">All locations</th></tr></thead><tbody>';

    const colTot = cols.map(() => 0); let grand = 0;
    for(const p of prods){
      let sub = cols.map(() => 0), subAll = 0;
      for(const size of p.sizes){
        const cells = cols.map(c => stockCount(p.key, size, c.id));
        const rowTot = cells.reduce((a,b) => a+b, 0);
        cells.forEach((v,i) => { sub[i] += v; colTot[i] += v; });
        subAll += rowTot; grand += rowTot;
        h += '<tr><td>' + esc(p.label + " " + size) + '</td>' +
          cells.map(v => '<td class="num' + (v ? "" : " zero") + '">' + v + '</td>').join("") +
          '<td class="num"><b>' + rowTot + '</b></td></tr>';
      }
      h += '<tr class="sub-row"><td>' + esc(p.label) + ' subtotal</td>' +
        sub.map(v => '<td class="num">' + v + '</td>').join("") +
        '<td class="num">' + subAll + '</td></tr>';
    }
    h += '<tr class="tot-row"><td>Grand total</td>' +
      colTot.map(v => '<td class="num">' + v + '</td>').join("") +
      '<td class="num">' + grand + '</td></tr></tbody></table></div>' +
      '<div class="row" style="margin-top:12px"><button class="btn" id="csv">Export exactly what is filtered (CSV)</button></div>';
    return h;
  },
  wire(){
    $("#f-lt").onchange = e => { FL.locType = e.target.value; render(); };
    $("#f-p").onchange  = e => { FL.product = e.target.value; render(); };
    $("#f-s").onchange  = e => { FL.status  = e.target.value; render(); };
    /* Re-rendering on every keystroke and then restoring focus and the caret fought
       IME composition and mobile autocorrect. Debounced, and the caret is left
       alone because the input itself is no longer torn down mid-word. */
    $("#f-q").oninput   = e => {
      FL.q = e.target.value;
      clearTimeout(VIEWS.stock._t);
      VIEWS.stock._t = setTimeout(() => {
        const at = $("#f-q") && $("#f-q").selectionStart;
        render();
        const i = $("#f-q");
        if(i){ i.focus(); if(at != null) try{ i.setSelectionRange(at, at); }catch(err){} }
      }, 220);
    };
    const c = $("#csv"); if(c) c.onclick = exportCSV;
  }
};
function exportCSV(){
  const cols = stockCols();
  const prods = PRODUCTS.filter(p => !FL.product || p.key === FL.product);
  const rows = [["Product / size"].concat(cols.map(c => c.name)).concat(["All locations"])];
  for(const p of prods) for(const size of p.sizes){
    const cells = cols.map(c => stockCount(p.key, size, c.id));
    rows.push([p.label + " " + size].concat(cells).concat([cells.reduce((a,b) => a+b, 0)]));
  }
  const csv = rows.map(r => r.map(v => '"' + String(v).replace(/"/g,'""') + '"').join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type:"text/csv" }));
  a.download = "pivotal_stock_" + new Date().toISOString().slice(0,10) + ".csv";
  a.click(); URL.revokeObjectURL(a.href);
  toast("CSV exported.", "good");
}

/* Working copies, so Cancel really cancels rather than half-applying. */
let PFQ = [], PFR = [];

function patientForm(p){
  const isNew = !p;
  p = p || { id:uid("pat"), patientCode:"", siteId:visibleLocations().filter(l => l.type === "SITE")[0]?.id || "",
             procedureDate:"", unicaSize:"M", dsSize:"Short", status:"ELIGIBLE",
             submitted:false, fileLocked:false, notes:"", piNotes:"",
             customQuestions:[], reminders:[], images:[], caseFile:{} };
  PFQ = (p.customQuestions || []).map(q => ({ q:q.q, a:q.a || "" }));
  PFR = (p.reminders || []).map(r => ({ date:r.date, text:r.text, done:!!r.done }));
  patientFormRender(p, isNew);
}

function questionsBlock(){
  return '<h3 style="margin:4px 0 7px">Medical questions for this patient</h3>' +
    '<div class="hint" style="margin-bottom:8px">Free-form and specific to this patient. ' +
    'They appear in stage 2 of the case file and in the briefing panel.</div>' +
    (PFQ.length
      ? PFQ.map((q,i) => '<div class="row" style="gap:6px;margin-bottom:6px;flex-wrap:nowrap">' +
          '<input type="text" data-q="' + i + '" value="' + esc(q.q) + '" placeholder="question">' +
          '<button type="button" class="btn btn-sm btn-danger" data-qdel="' + i + '" ' +
          'style="flex:none">Remove</button></div>').join("")
      : '<div class="hint">None yet.</div>') +
    '<button type="button" class="btn btn-sm" id="q-add" style="margin-top:6px">Add a question</button>';
}
function remindersBlock(){
  return '<h3 style="margin:16px 0 7px">Reminders</h3>' +
    (PFR.length
      ? PFR.map((r,i) => '<div class="row" style="gap:6px;margin-bottom:6px;flex-wrap:nowrap">' +
          '<input type="date" data-rd="' + i + '" value="' + esc(r.date || "") + '" style="max-width:150px">' +
          '<input type="text" data-rt="' + i + '" value="' + esc(r.text) + '" placeholder="what to remember">' +
          '<button type="button" class="btn btn-sm btn-danger" data-rdel="' + i + '" ' +
          'style="flex:none">Remove</button></div>').join("")
      : '<div class="hint">None yet.</div>') +
    '<button type="button" class="btn btn-sm" id="r-add" style="margin-top:6px">Add a reminder</button>';
}

function patientFormRender(p, isNew){
  modal(isNew ? "Register a patient" : "Edit " + p.patientCode,
    '<div class="field"><label class="req" for="p-code">Patient code</label>' +
      '<input type="text" id="p-code" value="' + esc(p.patientCode) + '"></div>' +
    '<div class="field"><label class="req" for="p-site">Site</label><select id="p-site">' +
      S.db.locations.filter(l => l.type === "SITE").map(l =>
        '<option value="' + l.id + '"' + (l.id === p.siteId ? " selected" : "") + '>' +
        esc(l.name) + '</option>').join("") + '</select></div>' +
    '<div class="grid g2"><div class="field"><label for="p-date">Procedure date</label>' +
      '<input type="date" id="p-date" value="' + esc(p.procedureDate) + '"></div>' +
      '<div class="field"><label class="req" for="p-u">Unica size</label><select id="p-u">' +
        UNICA_SIZES.map(s => '<option' + (s === p.unicaSize ? " selected" : "") + '>' + s + '</option>').join("") +
        '</select></div></div>' +
    '<div class="field"><label for="p-ds">Delivery System size (derived)</label>' +
      '<input type="text" id="p-ds" value="' + esc(p.dsSize) + '" disabled></div>' +
    '<div class="field"><label for="p-st">Treatment status</label><select id="p-st">' +
      Object.keys(PT_STATUS).map(k => '<option value="' + k + '"' + (k === p.status ? " selected" : "") + '>' +
        esc(PT_STATUS[k].label) + '</option>').join("") + '</select>' +
      '<div class="hint">Tracked automatically; correcting it by hand is audit-logged.</div></div>' +
    '<div class="field"><label for="p-notes">Notes</label><textarea id="p-notes">' + esc(p.notes || "") + '</textarea></div>' +
    '<div class="field"><label for="p-pi">To discuss with the PI</label>' +
      '<textarea id="p-pi">' + esc(p.piNotes || "") + '</textarea>' +
      '<div class="hint">Shown prominently in the briefing before the case file opens.</div></div>' +
    questionsBlock() + remindersBlock(),
    '<div class="row"><button class="btn" data-close="1">Cancel</button>' +
    '<button class="btn btn-primary" id="p-save">' + (isNew ? "Register" : "Save") + '</button>' +
    '</div>' + whyBox("p-why"));

  /* Re-rendering the modal would lose focus, so the list edits are handled in place
     and only the changed row's value is read back. */
  const keep = () => {
    $$("[data-q]").forEach(i => { PFQ[+i.dataset.q].q = i.value; });
    $$("[data-rd]").forEach(i => { PFR[+i.dataset.rd].date = i.value; });
    $$("[data-rt]").forEach(i => { PFR[+i.dataset.rt].text = i.value; });
  };
  const redraw = () => {
    const snap = { code:$("#p-code").value, date:$("#p-date").value, u:$("#p-u").value,
                   st:$("#p-st").value, notes:$("#p-notes").value, pi:$("#p-pi").value,
                   site:$("#p-site").value };
    patientFormRender(p, isNew);
    $("#p-code").value = snap.code; $("#p-date").value = snap.date;
    $("#p-u").value = snap.u; $("#p-ds").value = dsForUnica(snap.u);
    $("#p-st").value = snap.st; $("#p-notes").value = snap.notes;
    $("#p-pi").value = snap.pi; $("#p-site").value = snap.site;
  };
  $("#q-add").onclick = () => { keep(); PFQ.push({ q:"", a:"" }); redraw(); };
  $("#r-add").onclick = () => { keep(); PFR.push({ date:"", text:"", done:false }); redraw(); };
  $$("[data-qdel]").forEach(b => b.onclick = () => {
    keep(); PFQ.splice(+b.dataset.qdel, 1); redraw(); });
  $$("[data-rdel]").forEach(b => b.onclick = () => {
    keep(); PFR.splice(+b.dataset.rdel, 1); redraw(); });

  $("#p-u").onchange = e => { $("#p-ds").value = dsForUnica(e.target.value); };
  $("#p-save").onclick = () => {
    keep();
    const code = $("#p-code").value.trim();
    if(!code) return showWhy("p-why", "A patient code is required.");
    const before = p.status;
    p.patientCode = code;
    p.siteId = $("#p-site").value;
    p.procedureDate = $("#p-date").value;
    p.unicaSize = $("#p-u").value;
    p.dsSize = dsForUnica(p.unicaSize);
    p.status = $("#p-st").value;
    if(p.procedureDate && p.status === "ELIGIBLE") p.status = "SCHEDULED";
    p.notes = $("#p-notes").value;
    p.piNotes = $("#p-pi").value;
    p.customQuestions = PFQ.filter(q => String(q.q).trim())
                           .map(q => ({ q:q.q.trim(), a:q.a || "" }));
    p.reminders = PFR.filter(r => String(r.text).trim())
                     .map(r => ({ date:r.date || "", text:r.text.trim(), done:!!r.done }));
    if(!p.images) p.images = [];
    if(isNew){ S.db.patients.push(p); logAction("Registered patient " + code, { locationId:p.siteId,
      stateChanges:"→ " + PT_STATUS[p.status].label,
      comments:p.customQuestions.length + " medical question(s), " +
               p.reminders.length + " reminder(s)" }); }
    else logAction("Edited patient " + code, { locationId:p.siteId,
      stateChanges: before === p.status ? "" : PT_STATUS[before].label + " → " + PT_STATUS[p.status].label });
    commit(); closeModal(); toast("Saved.", "good"); render();
  };
}

        '<th>Location</th><th>Title</th><th></th></tr></thead><tbody>' +
      S.db.users.map(u => '<tr><td><b>' + esc(u.name) + '</b></td>' +
        '<td class="mono">' + esc(u.email) + '</td>' +
        '<td>' + esc(ROLES[u.role].label) + '</td>' +
        '<td>' + esc(u.locationId ? locName(u.locationId) : "All locations") + '</td>' +
        '<td>' + esc(u.title || "—") + '</td>' +
        '<td class="row" style="gap:5px"><button class="btn btn-sm" data-ue="' + u.id + '">Edit</button>' +
        '<button class="btn btn-sm btn-danger" data-ud="' + u.id + '">Remove</button></td></tr>').join("") +
      '</tbody></table></div>';
    }

    if(ADMTAB === "locations"){
      h += '<div class="row" style="margin-bottom:12px">' +
        '<button class="btn btn-primary" id="l-new">Add a location</button></div>' +
        '<div class="tbl-wrap"><table><thead><tr><th>Name</th><th>Type</th><th>Address</th>' +
        '<th>Contact</th><th>Responsible CPM</th><th>Devices</th><th></th></tr></thead><tbody>' +
      S.db.locations.map(l => {
        const n = S.db.devices.filter(d => d.locationId === l.id).length;
        return '<tr><td><b>' + esc(l.name) + '</b></td>' +
          '<td>' + (l.type === "WAREHOUSE" ? '<span class="pill p-blue">Warehouse</span>'
                                           : '<span class="pill p-pink">Hospital site</span>') + '</td>' +
          '<td>' + esc(l.address) + '</td>' +
          '<td>' + esc(l.contact) + '<div class="hint">' + esc(l.phone) + '</div></td>' +
          '<td>' + esc(l.cpmUserId ? (user(l.cpmUserId) || {}).name || "—" : "—") + '</td>' +
          '<td class="num">' + n + '</td>' +
          '<td class="row" style="gap:5px"><button class="btn btn-sm" data-le="' + l.id + '">Edit</button>' +
          '<button class="btn btn-sm btn-danger" data-ld="' + l.id + '">Remove</button></td></tr>';
      }).join("") + '</tbody></table></div>';
    }

    if(ADMTAB === "import"){
      h += '<div class="card"><div class="card-hd"><h2>Bulk import devices</h2></div><div class="card-bd">' +
        '<p>One device per line: ' +
        '<span class="mono">productType,size,ref,sn,locationName,expiryYYYY-MM-DD</span></p>' +
        '<div class="field"><textarea id="imp" style="min-height:150px" placeholder="UNICA,M,UNI-M-2001,(01)07627940000012,Main Warehouse,2027-04-30"></textarea></div>' +
        '<button class="btn btn-primary" id="imp-go">Import</button> ' +
        whyBox("imp-why") + '</div></div>';
    }
    return h;
  },
  wire(){
    $$("[data-tab]").forEach(b => b.onclick = () => { ADMTAB = b.dataset.tab; render(); });

    const un = $("#u-new"); if(un) un.onclick = () => userForm(null);
    $$("[data-ue]").forEach(b => b.onclick = () => userForm(user(b.dataset.ue)));
    $$("[data-ud]").forEach(b => b.onclick = () => removeUser(user(b.dataset.ud)));

    const ln = $("#l-new"); if(ln) ln.onclick = () => locForm(null);
    $$("[data-le]").forEach(b => b.onclick = () => locForm(loc(b.dataset.le)));
    $$("[data-ld]").forEach(b => b.onclick = () => removeLoc(loc(b.dataset.ld)));

    const ig = $("#imp-go");
    if(ig) ig.onclick = () => {
      const lines = $("#imp").value.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
      let ok = 0, bad = 0;
      for(const line of lines){
        const [pt,size,ref,sn,lname,exp] = line.split(",").map(s => (s||"").trim());
        const l = S.db.locations.find(x => x.name === lname);
        const prod = PRODUCTS.find(p => p.key === pt);
        if(!prod || !prod.sizes.includes(size) || !ref || !l || !/^\d{4}-\d{2}-\d{2}$/.test(exp||"")){ bad++; continue; }
        S.db.devices.push({ id:uid("dev"), sn:sn||"", ref, productType:pt, size,
          locationId:l.id, status:l.type === "WAREHOUSE" ? "IN_WH" : "IN_SITE",
          expiration:exp, condition:"OK", shippedBy:null, shippedFromId:null, shippedAt:null });
        ok++;
      }
      logAction("Bulk device import", { stateChanges:ok + " added, " + bad + " rejected" });
      commit();
      showWhy("imp-why", bad ? (bad + " line(s) rejected, " + ok + " imported. Check the format of the rejected lines.") : "");
      toast(ok + " device(s) imported.", bad ? "bad" : "good");
      render();
    };
  }
};

function userForm(u){
  const isNew = !u;
  u = u || { id:uid("usr"), name:"", email:"", role:"EMPLOYEE", locationId:null, title:"", phone:"" };
  modal(isNew ? "Add a user" : "Edit " + u.name,
    '<div class="grid g2"><div class="field"><label class="req" for="u-n">Name</label>' +
      '<input type="text" id="u-n" value="' + esc(u.name) + '"></div>' +
      '<div class="field"><label class="req" for="u-e">Work email</label>' +
      '<input type="email" id="u-e" value="' + esc(u.email) + '"' + (isNew ? "" : " disabled") + '></div></div>' +
    '<div class="grid g2"><div class="field"><label class="req" for="u-r">Role</label><select id="u-r">' +
      Object.keys(ROLES).map(k => '<option value="' + k + '"' + (k === u.role ? " selected" : "") + '>' +
        esc(ROLES[k].label) + '</option>').join("") + '</select></div>' +
      '<div class="field"><label for="u-l">Assigned location</label><select id="u-l">' +
      '<option value="">All locations</option>' +
      S.db.locations.map(l => '<option value="' + l.id + '"' + (l.id === u.locationId ? " selected" : "") +
        '>' + esc(l.name) + '</option>').join("") + '</select>' +
      '<div class="hint">Scoping is expressed here, not by the role.</div></div></div>' +
    '<div class="grid g2"><div class="field"><label for="u-t">Title</label>' +
      '<input type="text" id="u-t" value="' + esc(u.title||"") + '"></div>' +
      '<div class="field"><label for="u-p">Phone</label><input type="tel" id="u-p" value="' + esc(u.phone||"") + '"></div></div>' +
    '<div class="hint">Title and phone pre-fill the receiver fields on the Arrival screen.</div>',
    '<div class="row"><button class="btn" data-close="1">Cancel</button>' +
    '<button class="btn btn-primary" id="u-save">' + (isNew ? "Add" : "Save") + '</button>' +
    '</div>' + whyBox("u-why"));

  $("#u-save").onclick = async () => {
    const email = $("#u-e").value.trim().toLowerCase();
    const name = $("#u-n").value.trim();
    if(!name) return showWhy("u-why", "A name is required.");
    if(!email.includes("@")) return showWhy("u-why", "A valid email address is required.");
    Object.assign(u, { name, email, role:$("#u-r").value,
      locationId:$("#u-l").value || null, title:$("#u-t").value.trim(), phone:$("#u-p").value.trim() });

    if(S.backend){
      try{
        const r = await fetch("/api/admin/users", { method:"PUT", credentials:"same-origin",
          headers:{ "Content-Type":"application/json" },
          body:JSON.stringify({ email:u.email, role:u.role, name:u.name, title:u.title,
                                phone:u.phone, locationId:u.locationId }) });
        if(!r.ok){
          const e = await r.json().catch(() => ({}));
          return showWhy("u-why", (e.error && e.error.message) || "The server refused it.");
        }
      }catch(e){ return showWhy("u-why", "Could not reach the server."); }
    }
    if(isNew) S.db.users.push(u);
    logAction((isNew ? "Provisioned " : "Updated ") + u.email + " as " + u.role,
      { stateChanges:"role = " + u.role, highPriority:isNew });
    commit(); closeModal(); toast("Saved.", "good"); render();
  };
}
function removeUser(u){
  /* Mirrors the server guards: never strand the application without an admin,
     and never let someone remove their own access mid-session. */
  if(u.email === S.me.email)
    return toast("You cannot remove your own access while signed in as that account.", "bad");
  if(u.role === "ADMIN" && S.db.users.filter(x => x.role === "ADMIN").length <= 1)
    return toast("At least one App Admin must remain.", "bad");
  const owns = S.db.locations.filter(l => l.cpmUserId === u.id);
  if(owns.length)
    return toast(u.name + " is the responsible CPM for " + owns.map(l => l.name).join(", ") +
                 ". Reassign first.", "bad");
  modal("Remove access", '<p>Remove <b>' + esc(u.email) + '</b> from the allow-list? ' +
    'It takes effect on their very next action, not when their session expires.</p>',
    '<div class="row"><button class="btn" data-close="1">Cancel</button>' +
    '<button class="btn btn-danger" id="u-del">Remove</button></div>');
  $("#u-del").onclick = async () => {
    if(S.backend){
      try{
        const r = await fetch("/api/admin/users", { method:"DELETE", credentials:"same-origin",
          headers:{ "Content-Type":"application/json" }, body:JSON.stringify({ email:u.email }) });
        if(!r.ok){ const e = await r.json().catch(() => ({}));
          return toast((e.error && e.error.message) || "The server refused it.", "bad"); }
      }catch(e){ return toast("Could not reach the server.", "bad"); }
    }
    S.db.users = S.db.users.filter(x => x.id !== u.id);
    logAction("Removed access for " + u.email, { highPriority:true });
    commit(); closeModal(); render();
  };
}
function locForm(l){
  const isNew = !l;
  l = l || { id:uid("loc"), name:"", type:"SITE", address:"", contact:"", phone:"", email:"", cpmUserId:null };
  modal(isNew ? "Add a location" : "Edit " + l.name,
    '<div class="grid g2"><div class="field"><label class="req" for="l-n">Name</label>' +
      '<input type="text" id="l-n" value="' + esc(l.name) + '"></div>' +
      '<div class="field"><label class="req" for="l-t">Type</label><select id="l-t">' +
        '<option value="WAREHOUSE"' + (l.type === "WAREHOUSE" ? " selected" : "") + '>Warehouse</option>' +
        '<option value="SITE"' + (l.type === "SITE" ? " selected" : "") + '>Hospital site</option>' +
      '</select></div></div>' +
    '<div class="field"><label for="l-a">Address</label><input type="text" id="l-a" value="' + esc(l.address) + '"></div>' +
    '<div class="grid g3"><div class="field"><label for="l-c">Contact person</label>' +
      '<input type="text" id="l-c" value="' + esc(l.contact) + '"></div>' +
      '<div class="field"><label for="l-p">Phone</label><input type="tel" id="l-p" value="' + esc(l.phone) + '"></div>' +
      '<div class="field"><label for="l-e">Email</label><input type="email" id="l-e" value="' + esc(l.email) + '"></div></div>' +
    '<div class="field"><label for="l-cpm">Responsible CPM</label><select id="l-cpm">' +
      '<option value="">— none —</option>' +
      S.db.users.filter(u => u.role === "CPM" || u.role === "ADMIN").map(u =>
        '<option value="' + u.id + '"' + (u.id === l.cpmUserId ? " selected" : "") + '>' +
        esc(u.name) + '</option>').join("") + '</select>' +
      '<div class="hint">Receives the alert when a delivery is reported at this site.</div></div>',
    '<div class="row"><button class="btn" data-close="1">Cancel</button>' +
    '<button class="btn btn-primary" id="l-save">' + (isNew ? "Add" : "Save") + '</button>' +
    '</div>' + whyBox("l-why"));

  $("#l-save").onclick = () => {
    const name = $("#l-n").value.trim();
    if(!name) return showWhy("l-why", "A name is required.");
    Object.assign(l, { name, type:$("#l-t").value, address:$("#l-a").value.trim(),
      contact:$("#l-c").value.trim(), phone:$("#l-p").value.trim(),
      email:$("#l-e").value.trim(), cpmUserId:$("#l-cpm").value || null });
    if(isNew) S.db.locations.push(l);
    logAction((isNew ? "Added " : "Edited ") + "location " + name, { locationId:l.id });
    commit(); closeModal(); toast("Saved.", "good"); render();
  };
}
function removeLoc(l){
  /* Referential guard: a location still holding anything cannot be deleted. */
  const d = S.db.devices.filter(x => x.locationId === l.id).length;
  const p = S.db.patients.filter(x => x.siteId === l.id).length;
  const u = S.db.users.filter(x => x.locationId === l.id).length;
  if(d || p || u)
    return toast("Still assigned: " + d + " device(s), " + p + " patient(s), " + u +
                 " user(s). Reassign them first.", "bad");
  S.db.locations = S.db.locations.filter(x => x.id !== l.id);
  logAction("Removed location " + l.name, { highPriority:true });
  commit(); render();
}

boot();
</script>
</body>
</html>
