}

function patientFormRender(p, isNew){
  modal(isNew ? "Register a patient" : "Edit " + p.patientCode,
    '<div class="field"><label class="req">Patient code</label>' +
      '<input type="text" id="p-code" value="' + esc(p.patientCode) + '"></div>' +
    '<div class="field"><label class="req">Site</label><select id="p-site">' +
      S.db.locations.filter(l => l.type === "SITE").map(l =>
        '<option value="' + l.id + '"' + (l.id === p.siteId ? " selected" : "") + '>' +
        esc(l.name) + '</option>').join("") + '</select></div>' +
    '<div class="grid g2"><div class="field"><label>Procedure date</label>' +
      '<input type="date" id="p-date" value="' + esc(p.procedureDate) + '"></div>' +
      '<div class="field"><label class="req">Unica size</label><select id="p-u">' +
        UNICA_SIZES.map(s => '<option' + (s === p.unicaSize ? " selected" : "") + '>' + s + '</option>').join("") +
        '</select></div></div>' +
    '<div class="field"><label>Delivery System size (derived)</label>' +
      '<input type="text" id="p-ds" value="' + esc(p.dsSize) + '" disabled></div>' +
    '<div class="field"><label>Treatment status</label><select id="p-st">' +
      Object.keys(PT_STATUS).map(k => '<option value="' + k + '"' + (k === p.status ? " selected" : "") + '>' +
        esc(PT_STATUS[k].label) + '</option>').join("") + '</select>' +
      '<div class="hint">Tracked automatically; correcting it by hand is audit-logged.</div></div>' +
    '<div class="field"><label>Notes</label><textarea id="p-notes">' + esc(p.notes || "") + '</textarea></div>' +
    '<div class="field"><label>To discuss with the PI</label>' +
      '<textarea id="p-pi">' + esc(p.piNotes || "") + '</textarea>' +
      '<div class="hint">Shown prominently in the briefing before the case file opens.</div></div>' +
    questionsBlock() + remindersBlock(),
    '<div class="row"><button class="btn" data-close="1">Cancel</button>' +
    '<button class="btn btn-primary" id="p-save">' + (isNew ? "Register" : "Save") + '</button>' +
    '<span class="spacer"></span><span class="hint" id="p-why"></span></div>');

  /* Re-rendering the modal would lose focus, so the list edits are handled in place
     and only the changed row's value is read back. */
  const keep = () => {
    $$("[data-q]").forEach(i => { PFQ[+i.dataset.q].q = i.value; });
    $$("[data-rd]").forEach(i => { PFR[+i.dataset.rd].date = i.value; });
    $$("[data-rt]").forEach(i => { PFR[+i.dataset.rt].text = i.value; });
  };
  const redraw = () => {
    const snap = { code:$("#p-code").value, date:$("#p-date").value, u:$("#p-u").value,
                   st:$("#p-st").value, notes:$("#p-notes").value, pi:$("#p-pi").value,
                   site:$("#p-site").value };
    patientFormRender(p, isNew);
    $("#p-code").value = snap.code; $("#p-date").value = snap.date;
    $("#p-u").value = snap.u; $("#p-ds").value = dsForUnica(snap.u);
    $("#p-st").value = snap.st; $("#p-notes").value = snap.notes;
    $("#p-pi").value = snap.pi; $("#p-site").value = snap.site;
  };
  $("#q-add").onclick = () => { keep(); PFQ.push({ q:"", a:"" }); redraw(); };
  $("#r-add").onclick = () => { keep(); PFR.push({ date:"", text:"", done:false }); redraw(); };
  $$("[data-qdel]").forEach(b => b.onclick = () => {
    keep(); PFQ.splice(+b.dataset.qdel, 1); redraw(); });
  $$("[data-rdel]").forEach(b => b.onclick = () => {
    keep(); PFR.splice(+b.dataset.rdel, 1); redraw(); });

  $("#p-u").onchange = e => { $("#p-ds").value = dsForUnica(e.target.value); };
  $("#p-save").onclick = () => {
    keep();
    const code = $("#p-code").value.trim();
    if(!code) return $("#p-why").textContent = "A patient code is required.";
    const before = p.status;
    p.patientCode = code;
    p.siteId = $("#p-site").value;
    p.procedureDate = $("#p-date").value;
    p.unicaSize = $("#p-u").value;
    p.dsSize = dsForUnica(p.unicaSize);
    p.status = $("#p-st").value;
    if(p.procedureDate && p.status === "ELIGIBLE") p.status = "SCHEDULED";
    p.notes = $("#p-notes").value;
    p.piNotes = $("#p-pi").value;
    p.customQuestions = PFQ.filter(q => String(q.q).trim())
                           .map(q => ({ q:q.q.trim(), a:q.a || "" }));
    p.reminders = PFR.filter(r => String(r.text).trim())
                     .map(r => ({ date:r.date || "", text:r.text.trim(), done:!!r.done }));
    if(!p.images) p.images = [];
    if(isNew){ S.db.patients.push(p); logAction("Registered patient " + code, { locationId:p.siteId,
      stateChanges:"→ " + PT_STATUS[p.status].label,
      comments:p.customQuestions.length + " medical question(s), " +
               p.reminders.length + " reminder(s)" }); }
    else logAction("Edited patient " + code, { locationId:p.siteId,
      stateChanges: before === p.status ? "" : PT_STATUS[before].label + " → " + PT_STATUS[p.status].label });
    commit(); closeModal(); toast("Saved.", "good"); render();
  };
}

}
function removeUser(u){
  /* Mirrors the server guards: never strand the application without an admin,
     and never let someone remove their own access mid-session. */
  if(u.email === S.me.email)
    return toast("You cannot remove your own access while signed in as that account.", "bad");
  if(u.role === "ADMIN" && S.db.users.filter(x => x.role === "ADMIN").length <= 1)
    return toast("At least one App Admin must remain.", "bad");
  const owns = S.db.locations.filter(l => l.cpmUserId === u.id);
  if(owns.length)
    return toast(u.name + " is the responsible CPM for " + owns.map(l => l.name).join(", ") +
                 ". Reassign first.", "bad");
  modal("Remove access", '<p>Remove <b>' + esc(u.email) + '</b> from the allow-list? ' +
    'It takes effect on their very next action, not when their session expires.</p>',
    '<div class="row"><button class="btn" data-close="1">Cancel</button>' +
    '<button class="btn btn-danger" id="u-del">Remove</button></div>');
  $("#u-del").onclick = async () => {
    if(S.backend){
      try{
        const r = await fetch("/api/admin/users", { method:"DELETE", credentials:"same-origin",
          headers:{ "Content-Type":"application/json" }, body:JSON.stringify({ email:u.email }) });
        if(!r.ok){ const e = await r.json().catch(() => ({}));
          return toast((e.error && e.error.message) || "The server refused it.", "bad"); }
      }catch(e){ return toast("Could not reach the server.", "bad"); }
    }
    S.db.users = S.db.users.filter(x => x.id !== u.id);
    logAction("Removed access for " + u.email, { highPriority:true });
    commit(); closeModal(); render();
  };
}
function locForm(l){
  const isNew = !l;
  l = l || { id:uid("loc"), name:"", type:"SITE", address:"", contact:"", phone:"", email:"", cpmUserId:null };
  modal(isNew ? "Add a location" : "Edit " + l.name,
    '<div class="grid g2"><div class="field"><label class="req">Name</label>' +
      '<input type="text" id="l-n" value="' + esc(l.name) + '"></div>' +
      '<div class="field"><label class="req">Type</label><select id="l-t">' +
        '<option value="WAREHOUSE"' + (l.type === "WAREHOUSE" ? " selected" : "") + '>Warehouse</option>' +
        '<option value="SITE"' + (l.type === "SITE" ? " selected" : "") + '>Hospital site</option>' +
      '</select></div></div>' +
    '<div class="field"><label>Address</label><input type="text" id="l-a" value="' + esc(l.address) + '"></div>' +
    '<div class="grid g3"><div class="field"><label>Contact person</label>' +
      '<input type="text" id="l-c" value="' + esc(l.contact) + '"></div>' +
      '<div class="field"><label>Phone</label><input type="tel" id="l-p" value="' + esc(l.phone) + '"></div>' +
      '<div class="field"><label>Email</label><input type="email" id="l-e" value="' + esc(l.email) + '"></div></div>' +
    '<div class="field"><label>Responsible CPM</label><select id="l-cpm">' +
      '<option value="">— none —</option>' +
      S.db.users.filter(u => u.role === "CPM" || u.role === "ADMIN").map(u =>
        '<option value="' + u.id + '"' + (u.id === l.cpmUserId ? " selected" : "") + '>' +
        esc(u.name) + '</option>').join("") + '</select>' +
      '<div class="hint">Receives the alert when a delivery is reported at this site.</div></div>',
    '<div class="row"><button class="btn" data-close="1">Cancel</button>' +
    '<button class="btn btn-primary" id="l-save">' + (isNew ? "Add" : "Save") + '</button>' +
    '<span class="spacer"></span><span class="hint" id="l-why"></span></div>');

  $("#l-save").onclick = () => {
    const name = $("#l-n").value.trim();
    if(!name) return $("#l-why").textContent = "A name is required.";
    Object.assign(l, { name, type:$("#l-t").value, address:$("#l-a").value.trim(),
      contact:$("#l-c").value.trim(), phone:$("#l-p").value.trim(),
      email:$("#l-e").value.trim(), cpmUserId:$("#l-cpm").value || null });
    if(isNew) S.db.locations.push(l);
    logAction((isNew ? "Added " : "Edited ") + "location " + name, { locationId:l.id });
    commit(); closeModal(); toast("Saved.", "good"); render();
  };
}
function removeLoc(l){
  /* Referential guard: a location still holding anything cannot be deleted. */
  const d = S.db.devices.filter(x => x.locationId === l.id).length;
  const p = S.db.patients.filter(x => x.siteId === l.id).length;
  const u = S.db.users.filter(x => x.locationId === l.id).length;
  if(d || p || u)
    return toast("Still assigned: " + d + " device(s), " + p + " patient(s), " + u +
                 " user(s). Reassign them first.", "bad");
  S.db.locations = S.db.locations.filter(x => x.id !== l.id);
  logAction("Removed location " + l.name, { highPriority:true });
  commit(); render();
}

boot();
</script>
