<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pivotal Study Procedures — Demo (sample data)</title>
<meta name="robots" content="noindex, nofollow">

  ===========================================================================
  PUBLIC DEMO BUILD - GENERATED FILE, DO NOT EDIT BY HAND.

  Produced from pivotal-app.html by build-demo.js. Every person, hospital,
  address, phone number and email address below is invented. There is no
  credential and no real identifier anywhere in this file, and the build
  refuses to run if that stops being true.

  To change the demo, change pivotal-app.html and re-run:  node scripts/build-demo.js
  ===========================================================================
-->
<!--
  ============================================================================
  PIVOTAL STUDY PROCEDURES — FRONTEND (single file, zero third-party scripts)

  This page is a pure presentation layer. It holds no client secret, no access
  token and no drive id, and it never constructs a Microsoft Graph URL. All
  cloud work goes through same-origin /api/* with an httpOnly session cookie
  that JavaScript cannot read.

  It runs in two modes and detects which by itself:

    SERVED   — GET /api/me succeeds. Identity and role come from the server's
               role store and are re-checked on every request. This is the
               real mode.
    STANDALONE — the page was opened straight from disk (file://) or no backend
               is listening. There is no server to ask, so a local role picker
               is offered and everything lives in browser storage. A permanent
               banner makes this obvious, because a client-side role is exactly
               the privilege-escalation hole the backend exists to close.

  Roles are NEVER trusted from this file when a backend is present.
  ============================================================================
-->
<style>
:root{
  --brand:#E4187A; --brand-dk:#9E1259; --brand-md:#C2166B; --brand-lt:#EE3D8C;
  --brand-wash:#fdf3f8;
  --ink:#14202b; --ink-2:#33465a; --muted:#5b6b7a; --faint:#8b9aa8;
  --bg:#f4f6f8; --card:#ffffff; --line:#e2e8ee; --line-2:#eef2f6;
  --ok-bg:#d9f2e3; --ok-fg:#14622f; --ok-line:#1a8a4a;
  --warn-bg:#ffe9cc; --warn-fg:#8a4b00; --warn-line:#C79100;
  --bad-bg:#fadcda; --bad-fg:#8c211a; --bad-line:#b3372c;
  --grey-bg:#e8ecf0; --grey-fg:#4a5a68;
  --info-bg:#e2eefb; --info-fg:#14497e;
  --radius:8px; --shadow:0 1px 2px rgba(20,32,43,.06),0 2px 8px rgba(20,32,43,.05);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0; font-weight:650; letter-spacing:-.2px; color:var(--ink);}
h1{font-size:22px;} h2{font-size:17px;} h3{font-size:14.5px;} h4{font-size:13px;}
p{margin:0 0 10px;}
a{color:var(--brand-dk);}
button{font-family:inherit; font-size:inherit;}
[hidden]{display:none !important;}

/* ---------------------------------------------------------------- controls */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  padding:8px 14px; border-radius:6px; border:1px solid var(--line);
  background:#fff; color:var(--ink-2); font-weight:600; cursor:pointer;
  transition:background .12s,border-color .12s,box-shadow .12s; white-space:nowrap;
}
.btn:hover{background:#f7f9fb; border-color:#cfd9e2;}
.btn:active{transform:translateY(.5px);}
.btn:focus-visible{outline:2px solid var(--brand); outline-offset:2px;}
/* --brand on white measures 4.46:1, just under the 4.5:1 AA floor for button text.
   The filled button therefore uses --brand-md (5.9:1). --brand keeps every other
   job: accents, the active nav rail, focus rings, checkbox tint. */
.btn-primary{background:var(--brand-md); border-color:var(--brand-md); color:#fff;}
.btn-primary:hover{background:var(--brand-dk); border-color:var(--brand-dk);}
.btn-dark{background:var(--ink); border-color:var(--ink); color:#fff;}
.btn-dark:hover{background:#22323f;}
.btn-danger{background:#fff; border-color:var(--bad-line); color:var(--bad-fg);}
.btn-danger:hover{background:var(--bad-bg);}
.btn-sm{padding:5px 10px; font-size:12.5px;}
.btn-lg{padding:11px 20px; font-size:15px;}
.btn:disabled{opacity:.45; cursor:not-allowed;}
.btn-block{width:100%;}

label{display:block; font-size:12px; font-weight:600; color:var(--muted);
      margin:0 0 4px; letter-spacing:.2px;}
input[type=text],input[type=date],input[type=time],input[type=number],
input[type=email],input[type=tel],input[type=password],select,textarea{
  width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:6px;
  background:#fff; color:var(--ink); font-family:inherit; font-size:13.5px;
}
input:focus,select:focus,textarea:focus{
  outline:none; border-color:var(--brand); box-shadow:0 0 0 3px rgba(228,24,122,.12);
}
input:disabled,select:disabled,textarea:disabled{background:#f4f6f8; color:var(--muted); cursor:not-allowed;}
textarea{min-height:70px; resize:vertical;}
.field{margin-bottom:12px;}
/* Hints are instructions, not decoration, so they use --muted (5.48:1 on white).
   --faint is now reserved for genuinely non-essential text: placeholders, the
   zero cells in the stock matrix, and separator rules. */
.hint{font-size:12px; color:var(--muted); margin-top:3px;}
.req::after{content:" *"; color:var(--brand-md);}

/* Validation. Refusals used to render into a .hint at 2.88:1, 11.5px, pushed to the
   far right of the card footer — visually indistinguishable from nothing happening.
   They now get their own block, directly above the buttons, announced to
   assistive technology. Never use .hint for a message that blocks the user. */
.why{display:none; align-items:flex-start; gap:8px; margin:0 0 10px;
     padding:9px 12px; border-radius:6px; font-size:13px; font-weight:500;
     background:var(--bad-bg); border-left:3px solid var(--bad-line); color:var(--bad-fg);}
.why.on{display:flex;}
.why::before{content:"!"; flex:none; width:17px; height:17px; border-radius:50%;
     background:var(--bad-line); color:#fff; font-size:11px; font-weight:800;
     display:flex; align-items:center; justify-content:center; margin-top:1px;}

.check{display:flex; align-items:flex-start; gap:9px; padding:8px 10px;
       border:1px solid var(--line); border-radius:6px; margin-bottom:7px;
       cursor:pointer; background:#fff;}
.check:hover{background:#fafbfc;}
.check input{margin:2px 0 0; width:16px; height:16px; accent-color:var(--brand); flex:none; cursor:pointer;}
.check span{font-size:13.5px; color:var(--ink-2); font-weight:500;}
.check.on{border-color:var(--ok-line); background:var(--ok-bg);}
.check.on span{color:var(--ok-fg);}

/* ------------------------------------------------------------------ layout */
.grid{display:grid; gap:12px;}
.g2{grid-template-columns:repeat(2,minmax(0,1fr));}
.g3{grid-template-columns:repeat(3,minmax(0,1fr));}
.g4{grid-template-columns:repeat(4,minmax(0,1fr));}
@media(max-width:900px){.g2,.g3,.g4{grid-template-columns:1fr;}}
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
.spread{display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap;}
.spacer{flex:1;}

.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
      box-shadow:var(--shadow); margin-bottom:14px;}
.card-hd{padding:13px 16px; border-bottom:1px solid var(--line-2);
         display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;}
.card-bd{padding:16px;}
.card-ft{padding:12px 16px; border-top:1px solid var(--line-2); background:#fbfcfd;
         border-radius:0 0 var(--radius) var(--radius);}

.note,.warn,.okbox,.info{padding:10px 13px; border-radius:6px; font-size:13px; margin:0 0 12px;}
.note{background:var(--brand-wash); border-left:3px solid var(--brand); color:#6d1246;}
.warn{background:#fff8e6; border-left:3px solid var(--warn-line); color:var(--warn-fg);}
.okbox{background:#eef8f2; border-left:3px solid var(--ok-line); color:var(--ok-fg);}
.info{background:#eef4fb; border-left:3px solid #3b7cc4; color:var(--info-fg);}

.pill{display:inline-block; padding:2px 9px; border-radius:11px; font-size:11px;
      font-weight:700; letter-spacing:.3px; white-space:nowrap;}
.p-grey{background:var(--grey-bg); color:var(--grey-fg);}
.p-green{background:var(--ok-bg); color:var(--ok-fg);}
.p-orange{background:var(--warn-bg); color:var(--warn-fg);}
.p-red{background:var(--bad-bg); color:var(--bad-fg);}
.p-blue{background:var(--info-bg); color:var(--info-fg);}
.p-pink{background:var(--brand-wash); color:var(--brand-dk);}

table{width:100%; border-collapse:collapse; font-size:13px;}
th,td{padding:8px 10px; text-align:left; border-bottom:1px solid var(--line-2); vertical-align:top;}
th{background:#f7f9fb; font-size:11.5px; text-transform:uppercase; letter-spacing:.5px;
   color:var(--muted); font-weight:700; white-space:nowrap;}
tbody tr:hover{background:#fafbfc;}
.tbl-wrap{overflow:auto; border:1px solid var(--line); border-radius:var(--radius); background:#fff;}
.num{text-align:right; font-variant-numeric:tabular-nums;}
.mono{font-family:Consolas,"SF Mono",Menlo,monospace; font-size:12px;}
.empty{padding:34px 16px; text-align:center; color:var(--muted); font-size:13px;}
.empty b{display:block; color:var(--ink); font-size:14.5px; margin-bottom:4px;}

/* ------------------------------------------------------------------- shell */
#app{display:flex; min-height:100vh;}
#side{
  width:246px; flex:none; background:#fff; border-right:1px solid var(--line);
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
}
.brand{padding:15px 16px; border-bottom:1px solid var(--line-2); display:flex; align-items:center; gap:10px;}
.brand-txt strong{display:block; font-size:13.5px; letter-spacing:1px; line-height:1.2;}
.brand-txt small{display:block; font-size:10px; color:var(--brand);}
nav{flex:1; overflow-y:auto; padding:10px 8px;}
.nav-lbl{font-size:10px; text-transform:uppercase; letter-spacing:.9px; color:var(--muted);
         font-weight:700; padding:12px 10px 5px;}
.nav-i{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left;
  padding:8px 10px; border:0; background:none; border-radius:6px; cursor:pointer;
  color:var(--ink-2); font-size:13.5px; font-weight:500; margin-bottom:1px;
}
.nav-i:hover{background:#f3f6f9;}
.nav-i.on{background:var(--brand-wash); color:var(--brand-dk); font-weight:650;
          box-shadow:inset 2px 0 0 var(--brand);}
/* The old badges numbered two of the eleven items "1" and "2", which implied a
   sequence the app explicitly does not have. Icons anchor the eye without
   asserting an order. */
.nav-i .n{width:18px; height:18px; flex:none; color:var(--faint);
          display:flex; align-items:center; justify-content:center;}
.nav-i .n svg{width:16px; height:16px; display:block;}
.nav-i:hover .n{color:var(--muted);}
.nav-i.on .n{color:var(--brand-md);}
.nav-i .cnt{margin-left:auto; background:var(--bad-line); color:#fff;
            border-radius:9px; padding:1px 6px; font-size:10.5px; font-weight:700;}
.nav-i .cnt.todo{background:var(--warn-line); color:#3d2200;}
.side-ft{border-top:1px solid var(--line-2); padding:11px 13px; font-size:12px;}
.who{display:flex; align-items:center; gap:9px; margin-bottom:9px;}
.avatar{width:31px; height:31px; border-radius:50%; background:var(--brand); color:#fff;
        display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12.5px; flex:none;}
.who div{min-width:0;}
.who b{display:block; font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.who small{display:block; color:var(--muted); font-size:11px;}

#main{flex:1; min-width:0; display:flex; flex-direction:column;}
#top{background:#fff; border-bottom:1px solid var(--line); padding:13px 22px;
     display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;}
#top .sub{font-size:12.5px; color:var(--muted); margin-top:1px;}
#view{padding:18px 22px 60px; max-width:1500px; width:100%;}

.mode-bar{background:#fff8e6; border-bottom:1px solid #f0dfae; color:var(--warn-fg);
          padding:7px 22px; font-size:12.5px; display:flex; gap:9px; align-items:center;}
.mode-bar.served{background:#eef8f2; border-bottom-color:#c6e6d3; color:var(--ok-fg);}

/* ------------------------------------------------------------------- login */
#login,#delivery{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
                 background:linear-gradient(160deg,#fdf3f8 0%,#f4f6f8 55%);}
.login-box{width:100%; max-width:430px; background:#fff; border:1px solid var(--line);
           border-radius:12px; box-shadow:0 8px 30px rgba(20,32,43,.09); padding:28px;}
.login-box .brand{border:0; padding:0 0 18px; justify-content:center;}
.login-h{text-align:center; margin-bottom:20px;}
.login-h h1{font-size:19px;}
.login-h p{color:var(--muted); font-size:13px; margin:5px 0 0;}
.sep{display:flex; align-items:center; gap:10px; margin:18px 0; color:var(--faint); font-size:11.5px;}
.sep::before,.sep::after{content:""; flex:1; height:1px; background:var(--line);}
.role-pick{display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:10px 12px;
           border:1px solid var(--line); border-radius:7px; background:#fff; cursor:pointer; margin-bottom:7px;}
.role-pick:hover{border-color:var(--brand); background:var(--brand-wash);}
.role-pick b{display:block; font-size:13.5px;}
.role-pick small{display:block; color:var(--muted); font-size:11.5px;}

/* ------------------------------------------------------------------ stages */
.stage{border-left:3px solid var(--brand); }
.stage-n{display:inline-flex; align-items:center; justify-content:center; width:23px; height:23px;
         border-radius:50%; background:var(--brand); color:#fff; font-size:12px; font-weight:700; margin-right:8px;}
.locked-ov{background:var(--grey-bg); border:1px dashed #b9c4cd; border-radius:6px;
           padding:11px 13px; font-size:13px; color:var(--grey-fg); margin-bottom:12px;}
.calc{background:#f7f9fb; border:1px solid var(--line); border-radius:6px; padding:9px 12px;}
.calc b{display:block; font-size:19px; font-variant-numeric:tabular-nums; color:var(--brand-dk);}
.calc small{color:var(--muted); font-size:11.5px;}

/* ---- time field + "Now" ---------------------------------------------------
   The button sits beside the input rather than under it, so the pair reads as one
   control and the tap target stays a comfortable size on a tablet in a cath lab. */
.with-now{display:flex; gap:6px; align-items:stretch;}
.with-now input{flex:1; min-width:0;}
.btn-now{flex:0 0 auto; padding:0 11px; font-size:12px; font-weight:600; cursor:pointer;
         border:1px solid var(--brand); border-radius:6px; background:var(--brand); color:#fff;}
.btn-now:hover{filter:brightness(1.08);}
.btn-now:active{transform:translateY(1px);}

/* ---- accordion stage header ----
   The whole header is the hit target, not a small chevron, because this gets used on
   a tablet. The caret is a hint about state, not the control. */
.acc-hd.is-clickable{cursor:pointer; user-select:none;}
.acc-hd.is-clickable:hover{background:var(--grey-bg);}
.acc-hd.is-clickable:focus-visible{outline:2px solid var(--brand); outline-offset:-2px;}
.acc-sum{font-weight:400; font-size:12.5px; color:var(--muted); margin-left:8px;}
.acc-caret{font-size:17px; color:var(--muted); width:18px; text-align:center; flex:none;}

/* An unconfirmed carton line is tinted, so "which row still needs me" is answerable
   at a glance instead of by reading every checkbox. */
tr.row-unconfirmed > td{background:var(--warn-bg);}

/* ---- locked anatomical stage ----
   Dimmed rather than hidden: a field user needs to see that stage 6 exists and what
   it will ask for, otherwise the workflow feels arbitrary. Inputs are disabled, so
   the visual state and the actual state cannot disagree. */
.stage.is-locked{opacity:.62;}
.stage.is-locked .card-hd{background:var(--grey-bg);}
.lbl-sm{font-size:11.5px; color:var(--muted); font-weight:600;}

/* ---- pressure triple ---- */
.pressure .readout{margin-top:5px; padding:5px 9px; border-radius:6px;
                   background:var(--grey-bg); border:1px solid var(--line);
                   font-size:14px; font-variant-numeric:tabular-nums; letter-spacing:.3px;}
.pressure .sub-label{display:block; margin-top:9px; font-size:11.5px; color:var(--muted);}
.pressure input::placeholder{font-size:11px; letter-spacing:.4px; text-transform:uppercase;}

.matrix th:first-child,.matrix td:first-child{position:sticky; left:0; background:#fff; z-index:1;
  border-right:1px solid var(--line); font-weight:600;}
.matrix thead th{position:sticky; top:0; z-index:2;}
.matrix thead th:first-child{z-index:3; background:#f7f9fb;}
.matrix tbody tr:hover td:first-child{background:#fafbfc;}
.matrix .sub-row td{background:var(--brand-wash); font-weight:700; color:var(--brand-dk);}
.matrix .sub-row td:first-child{background:var(--brand-wash);}
.matrix .tot-row td{background:var(--ink); color:#fff; font-weight:700;}
.matrix .tot-row td:first-child{background:var(--ink); color:#fff;}
/* A zero is a stock-out, which is the thing this dashboard exists to surface.
   #c8d2da measured 1.53:1 — invisible. #6f7d89 is 4.22:1 on white and 4.08:1 on
   the row-hover tint, so it passes AA as text while still sitting well behind the
   full-weight --ink of a real count. */
.zero{color:#6f7d89; font-weight:400;}

.tl{position:relative; padding-left:19px;}
.tl::before{content:""; position:absolute; left:5px; top:5px; bottom:5px; width:2px; background:var(--line);}
.tl-i{position:relative; padding:0 0 13px;}
.tl-i::before{content:""; position:absolute; left:-17px; top:5px; width:9px; height:9px;
              border-radius:50%; background:var(--brand); border:2px solid #fff; box-shadow:0 0 0 1.5px var(--brand);}
.tl-i.hi::before{background:var(--bad-line); box-shadow:0 0 0 1.5px var(--bad-line);}
.tl-t{font-size:11px; color:var(--faint);}

.modal-bg{position:fixed; inset:0; background:rgba(20,32,43,.5); display:flex;
          align-items:center; justify-content:center; padding:20px; z-index:100;}
.modal{background:#fff; border-radius:10px; box-shadow:0 16px 44px rgba(0,0,0,.25);
       width:100%; max-width:460px; max-height:88vh; overflow:auto;}
.modal .card-hd{border-bottom:1px solid var(--line);}

.toast-wrap{position:fixed; right:18px; bottom:18px; z-index:200; display:flex;
            flex-direction:column; gap:8px; align-items:flex-end;}
.toast{background:var(--ink); color:#fff; padding:10px 15px; border-radius:7px; font-size:13px;
       box-shadow:0 6px 20px rgba(0,0,0,.25); max-width:340px; animation:pop .18s ease-out;}
.toast.bad{background:var(--bad-line);} .toast.good{background:var(--ok-line);}
/* An override shipment succeeds — it just needs recording. It used to share the red
   of "no unit matches", so the first read was "it failed". Amber means "done, and
   noted". */
.toast.warn{background:#8a4b00;}
@keyframes pop{from{opacity:0;transform:translateY(7px);}to{opacity:1;transform:none;}}

.saved{font-size:11.5px; color:var(--ok-fg); font-weight:600;}
.kv{display:flex; gap:8px; font-size:13px; padding:4px 0;}
.kv b{color:var(--muted); font-weight:600; min-width:128px;}

/* --------------------------------------------------------------- stage rail */
/* The case file is four stages on one scrolling page. That is the efficient
   shape — a wizard would add clicks — but it gave no sense of position or of
   what was still incomplete. The rail sticks to the top and answers both. */
.rail{position:sticky; top:0; z-index:20; background:var(--card);
      border:1px solid var(--line); border-radius:var(--radius);
      box-shadow:var(--shadow); margin-bottom:14px; padding:8px;
      display:flex; gap:6px; overflow-x:auto;}
.rail-i{flex:1; min-width:132px; display:flex; align-items:center; gap:8px;
        padding:7px 10px; border:1px solid transparent; border-radius:6px;
        background:none; cursor:pointer; text-align:left; font:inherit;
        color:var(--ink-2);}
.rail-i:hover{background:#f3f6f9;}
.rail-i:focus-visible{outline:2px solid var(--brand); outline-offset:1px;}
.rail-i.on{background:var(--brand-wash); border-color:#f3cfe1;}
.rail-n{flex:none; width:22px; height:22px; border-radius:50%; font-size:11px;
        font-weight:700; display:flex; align-items:center; justify-content:center;
        background:var(--grey-bg); color:var(--grey-fg);}
.rail-i.done .rail-n{background:var(--ok-line); color:#fff;}
.rail-i.on .rail-n{background:var(--brand-md); color:#fff;}
.rail-t{min-width:0;}
.rail-t b{display:block; font-size:12.5px; font-weight:650; line-height:1.25;}
.rail-t small{display:block; font-size:11px; color:var(--muted);}

/* ------------------------------------------------------------- today screen */
.task{display:flex; align-items:center; gap:12px; padding:11px 14px;
      border-bottom:1px solid var(--line-2);}
.task:last-child{border-bottom:0;}
.task-ic{flex:none; width:30px; height:30px; border-radius:7px;
         display:flex; align-items:center; justify-content:center;}
.task-ic svg{width:16px; height:16px;}
.task-b{flex:1; min-width:0;}
.task-b b{display:block; font-size:13.5px; font-weight:650;}
.task-b small{display:block; font-size:12px; color:var(--muted);}
.t-red{background:var(--bad-bg); color:var(--bad-fg);}
.t-amber{background:var(--warn-bg); color:var(--warn-fg);}
.t-blue{background:var(--info-bg); color:var(--info-fg);}
.t-green{background:var(--ok-bg); color:var(--ok-fg);}
.clear-day{padding:30px 16px; text-align:center;}
.clear-day b{display:block; font-size:15px; margin-bottom:3px;}
.clear-day span{color:var(--muted); font-size:13px;}

/* ------------------------------------------------------------- home dashboard */
.nav-cards{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px;}
.nav-card{display:flex; flex-direction:column; align-items:flex-start; gap:7px; text-align:left;
          padding:15px; border:1px solid var(--line); border-radius:var(--radius); background:var(--card);
          cursor:pointer; font:inherit; color:var(--ink);
          transition:border-color .15s, box-shadow .15s, transform .04s;}
.nav-card:hover{border-color:var(--brand); box-shadow:0 4px 14px rgba(20,32,43,.09);}
.nav-card:active{transform:translateY(1px);}
.nav-card:focus-visible{outline:2px solid var(--brand); outline-offset:2px;}
.nav-card-ic{display:flex; align-items:center; justify-content:center; width:38px; height:38px;
             border-radius:9px; background:var(--brand-wash); color:var(--brand-dk);}
.nav-card-ic svg{width:20px; height:20px;}
.nav-card-t{font-size:15px; font-weight:700;}
.nav-card-d{font-size:12px; color:var(--muted); line-height:1.35;}
.nav-card.is-disabled{cursor:not-allowed; opacity:.6; background:var(--bg);}
.nav-card.is-disabled:hover{border-color:var(--line); box-shadow:none;}
.nav-card-lock{font-size:10px; font-weight:650; color:var(--muted); background:var(--line-2);
               border-radius:20px; padding:1px 8px;}
.dash-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px;}
.dash-grid .card{margin:0;}
.chip-wrap{display:flex; flex-wrap:wrap; gap:8px;}
.stat-chip{display:inline-flex; flex-direction:column; gap:1px; padding:8px 12px; min-width:92px;
           border:1px solid var(--line); border-radius:9px; background:var(--card); cursor:pointer;
           text-align:left; font:inherit; color:var(--ink);}
.stat-chip:hover{border-color:var(--brand);}
.stat-chip.on{border-color:var(--brand); box-shadow:inset 0 0 0 1px var(--brand); background:var(--brand-wash);}
.stat-chip .n{font-size:20px; font-weight:700; line-height:1.1; font-variant-numeric:tabular-nums;}
.stat-chip .l{font-size:11px; color:var(--muted);}
.filters{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:11px;}
.filters .field{margin:0; min-width:128px; flex:1;}
.filters .field label{font-size:11px;}
.row-click{cursor:pointer;}
.row-click:hover td{background:var(--brand-wash);}
@media(max-width:900px){.nav-cards{grid-template-columns:repeat(2,1fr);} .dash-grid{grid-template-columns:1fr;}}
@media(max-width:560px){.nav-cards{grid-template-columns:1fr;}}

/* ------------------------------------------------------------ scan feedback */
.scan-ok{display:flex; align-items:center; gap:9px; padding:10px 13px;
         border-radius:6px; background:var(--ok-bg); color:var(--ok-fg);
         font-size:13px; margin-top:6px;}
.scan-frame{position:relative; background:#000; border-radius:8px;
            overflow:hidden; aspect-ratio:4/3;}
.scan-frame video{width:100%; height:100%; object-fit:cover;}
.scan-ret{position:absolute; inset:18% 14%; border:2px solid rgba(255,255,255,.85);
          border-radius:10px; box-shadow:0 0 0 100vmax rgba(0,0,0,.35);}

/* ------------------------------------------------------- shell: mobile menu */
#menu-btn{display:none; flex:none; width:38px; height:38px; padding:0;}
#scrim{position:fixed; inset:0; background:rgba(20,32,43,.45); z-index:45; display:none;}
#scrim.on{display:block;}

@media(max-width:820px){
  /* The sidebar slides away here. #menu-btn below is what brings it back — without
     it the navigation, and Sign out with it, are unreachable on a phone or on an
     iPad in portrait. */
  #side{position:fixed; z-index:50; transform:translateX(-100%); transition:transform .2s;
        box-shadow:0 0 40px rgba(20,32,43,.18);}
  #side.open{transform:none;}
  #menu-btn{display:inline-flex;}
  #view{padding:14px 14px 60px;}
  #top{padding:11px 14px;}
  h1{font-size:19px;}
  .rail{padding:6px;}
  .rail-i{min-width:112px;}
  /* Touch targets: 8px padding put buttons at 34px, below the 44px minimum. */
  .btn{padding:11px 15px;} .btn-sm{padding:8px 12px;}
  .check{padding:12px 12px;}
  input[type=text],input[type=date],input[type=time],input[type=number],
  input[type=email],input[type=tel],input[type=password],select,textarea{
    padding:11px 12px; font-size:16px;   /* 16px stops iOS zooming on focus */
  }
}
</style>
</head>

<!-- aria-live: toasts are the only confirmation several actions get, and without
     this a screen reader never hears them at all. -->
<div class="toast-wrap" id="toasts" aria-live="polite" aria-atomic="false"></div>

  <div class="login-box">
    <div class="brand">
      <svg viewBox="0 0 120 100" width="52" height="43" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

        <polygon points="90,6 120,36 90,66 60,36" fill="#E4187A"/>
        <polygon points="60,36 60,96 30,66"       fill="#C2166B"/>
        <polygon points="60,36 90,66 60,96"       fill="#EE3D8C"/>
      </svg>
      <div class="brand-txt"><strong>INNOVENTRIC</strong><small>Simplicity at Heart</small></div>
    </div>
    <div class="login-h">
      <h1>Pivotal Study Procedures</h1>
      <p>Medical device tracking &amp; clinical data collection</p>
    </div>
    <div id="login-body"></div>
  </div>
</div>

<!-- =============================================== DELIVERY (no account) == -->
<div id="delivery" hidden>
  <div class="login-box">
    <div class="brand">
      <svg viewBox="0 0 120 100" width="52" height="43" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <polygon points="30,6 60,36 30,66 0,36"   fill="#9E1259"/>
        <polygon points="90,6 120,36 90,66 60,36" fill="#E4187A"/>
        <polygon points="60,36 60,96 30,66"       fill="#C2166B"/>
        <polygon points="60,36 90,66 60,96"       fill="#EE3D8C"/>
      </svg>
      <div class="brand-txt"><strong>INNOVENTRIC</strong><small>Simplicity at Heart</small></div>
    </div>
    <div id="delivery-body"></div>
  </div>
</div>

<!-- ========================================================== APP ======== -->
<div id="app" hidden>
  <aside id="side">
    <div class="brand">
      <svg viewBox="0 0 120 100" width="40" height="33" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <polygon points="30,6 60,36 30,66 0,36"   fill="#9E1259"/>
        <polygon points="90,6 120,36 90,66 60,36" fill="#E4187A"/>
        <polygon points="60,36 60,96 30,66"       fill="#C2166B"/>
        <polygon points="60,36 90,66 60,96"       fill="#EE3D8C"/>
      </svg>
      <div class="brand-txt"><strong>INNOVENTRIC</strong><small>Pivotal Study</small></div>
    </div>
    <nav id="nav"></nav>
    <div class="side-ft" id="side-ft"></div>
  </aside>

  <div id="main">
    <div id="mode-bar" class="mode-bar" hidden></div>
    <header id="top">
      <button class="btn" id="menu-btn" aria-label="Open the menu" aria-expanded="false" aria-controls="side">
        <svg viewBox="0 0 20 20" width="17" height="17" aria-hidden="true" fill="none"
             stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
          <path d="M3 5h14M3 10h14M3 15h14"/>
        </svg>
      </button>
      <div style="flex:1;min-width:0">
        <h1 id="view-title">—</h1>
        <div class="sub" id="view-sub"></div>
      </div>
      <div class="row" id="top-actions"></div>
    </header>
    <main id="view"></main>
  </div>
  <div id="scrim" hidden></div>
</div>

   The QR on an Innoventric device label carries four newline-separated values,
   positionally (no key labels):

       A-1033                 <- REF   (catalogue number)
       IM-SU-080726-0001      <- SN    (unique per unit, THE device identity)
       2026-07-12             <- Mfg. Date  (ISO)
       2028-01-08             <- Ex. Date   (ISO)

   Two independent sources encode the product size - the REF and the SN - so this
   module derives the size from BOTH and refuses to proceed when they disagree.
   A label whose REF says Large while its SN says Small is a labelling defect, and
   guessing which one is right is exactly the wrong behaviour for an implantable
   device. It blocks and says so.

   Size code collision, handled deliberately: DS uses "S"/"L" while Unica uses
   "SU"/"LU". A parser that searched for a code across both tables would confuse
   them. Here the SN PREFIX ("IM" or "DS") selects the product first, and the size
   code is then looked up only in that product's own table.

   Runs unchanged in Node and in the browser (no imports, no DOM).
   ============================================================================= */

/* ---- REF -> product + size. Note the numbering is NOT ordered by size, and DS
   runs 2017=Long / 2021=Short. It is a lookup table, never a rule. ---- */
var REF_MAP = {
  "A-1030": { productType: "UNICA", size: "XL"    },
  "A-1031": { productType: "UNICA", size: "L"     },
  "A-1032": { productType: "UNICA", size: "M"     },
  "A-1033": { productType: "UNICA", size: "S"     },
  "A-2017": { productType: "DS",    size: "Long"  },
  "A-2021": { productType: "DS",    size: "Short" }
};

/* ---- SN prefix -> product, and that product's own size codes ---- */
var SN_PRODUCTS = {
  IM: { productType: "UNICA", sizes: { SU: "S", MU: "M", LU: "L", XU: "XL" } },
  DS: { productType: "DS",    sizes: { S: "Short", L: "Long" } }
};

var SN_PATTERN = /^([A-Z]{2})-([A-Z]{1,2})-(\d{6})-(\d{4})$/;
var ISO_DATE    = /^(\d{4})-(\d{2})-(\d{2})$/;

function QrError(code, message, detail){
  var err = new Error(message);
  err.name = "DeviceQrError";
  err.code = code;
  if(detail !== undefined) err.detail = detail;
  return err;
}

/** Strip a trailing revision suffix such as ".01" and upper-case. */
function normaliseRef(raw){
  return String(raw || "").trim().toUpperCase().replace(/\.\d+$/, "");
}

/** Validate an ISO date and confirm the calendar actually contains it. */
function parseIsoDate(raw, label){
  var s = String(raw || "").trim();
  var m = ISO_DATE.exec(s);
  if(!m) throw QrError("BAD_DATE", label + " is not a valid ISO date (YYYY-MM-DD).", s);
  var y = +m[1], mo = +m[2], d = +m[3];
  var dt = new Date(Date.UTC(y, mo - 1, d));
  if(dt.getUTCFullYear() !== y || dt.getUTCMonth() !== mo - 1 || dt.getUTCDate() !== d){
    throw QrError("BAD_DATE", label + " is not a real calendar date.", s);
  }
  return s;
}

/** DDMMYY from the SN, e.g. "080726" -> "2026-07-08". */
function parseSnDate(ddmmyy){
  var d = +ddmmyy.slice(0, 2), mo = +ddmmyy.slice(2, 4), y = 2000 + +ddmmyy.slice(4, 6);
  var dt = new Date(Date.UTC(y, mo - 1, d));
  if(dt.getUTCFullYear() !== y || dt.getUTCMonth() !== mo - 1 || dt.getUTCDate() !== d){
    throw QrError("BAD_SN_DATE", "The date inside the SN (" + ddmmyy + ") is not a real date.", ddmmyy);
  }
  return dt.toISOString().slice(0, 10);
}

/** Derive product + size from the SN. Prefix selects the table. */
function parseSn(raw){
  var sn = String(raw || "").trim().toUpperCase();
  var m = SN_PATTERN.exec(sn);
  if(!m){
    throw QrError("BAD_SN",
      "Serial number does not match the expected format " +
      "IM-{SU|MU|LU|XU}-DDMMYY-0000 or DS-{S|L}-DDMMYY-0000.", sn);
  }
  var prefix = m[1], sizeCode = m[2], product = SN_PRODUCTS[prefix];
  if(!product){
    throw QrError("UNKNOWN_SN_PREFIX",
      "Unrecognised product prefix \"" + prefix + "\" in the serial number.", prefix);
  }
  var size = product.sizes[sizeCode];
  if(!size){
    throw QrError("UNKNOWN_SN_SIZE",
      "\"" + sizeCode + "\" is not a valid size code for " + product.productType + ".", sizeCode);
  }
  return {
    sn: sn,                                  // the FULL string is the identity
    productType: product.productType,
    size: size,
    productionDate: parseSnDate(m[3]),
    unitNumber: m[4]
  };
}

/**
 * Parse a scanned label.
 * @param {string} raw            the raw decoded QR text
 * @param {object} [opts]         { today: "YYYY-MM-DD" } for deterministic tests
 * @returns {object} parsed device
 * @throws  {DeviceQrError} on any inconsistency - never guesses
 */
function parseDeviceQr(raw, opts){
  opts = opts || {};
  if(typeof raw !== "string" || raw.trim() === ""){
    throw QrError("EMPTY", "Nothing was scanned.");
  }

  var lines = raw.replace(/\r\n?/g, "\n").split("\n")
                 .map(function(l){ return l.trim(); })
                 .filter(function(l){ return l !== ""; });
  if(lines.length !== 4){
    throw QrError("BAD_SHAPE",
      "Expected 4 lines (REF, SN, Mfg. Date, Ex. Date) but found " + lines.length +
      ". This does not look like an Innoventric device label.", lines.length);
  }

  var refRaw = lines[0];
  var ref = normaliseRef(refRaw);
  var refInfo = REF_MAP[ref];
  if(!refInfo){
    throw QrError("UNKNOWN_REF",
      "REF \"" + refRaw + "\" is not a recognised Innoventric catalogue number.", refRaw);
  }

  var snInfo = parseSn(lines[1]);

  // The cross-check. Two encodings of the same fact must agree.
  if(refInfo.productType !== snInfo.productType){
    throw QrError("PRODUCT_MISMATCH",
      "Labelling conflict: REF " + ref + " is a " + refInfo.productType +
      " but the serial number is a " + snInfo.productType +
      ". Do not use this unit - quarantine it and report the label.");
  }
  if(refInfo.size !== snInfo.size){
    throw QrError("SIZE_MISMATCH",
      "Labelling conflict: REF " + ref + " is size " + refInfo.size +
      " but the serial number says " + snInfo.size +
      ". Do not use this unit - quarantine it and report the label.");
  }

  var mfgDate = parseIsoDate(lines[2], "Manufacturing date");
  var expiry  = parseIsoDate(lines[3], "Expiration date");

  if(expiry <= mfgDate){
    throw QrError("DATES_ILLOGICAL",
      "The expiration date (" + expiry + ") is not after the manufacturing date (" +
      mfgDate + ").");
  }

  // Expiry is on the label, so an out-of-date unit is caught at the moment of
  // scanning rather than waiting for the background expiry sweep.
  var today = opts.today || new Date().toISOString().slice(0, 10);
  var expired = expiry < today;

  return {
    ref: ref,
    refAsPrinted: refRaw,
    sn: snInfo.sn,
    productType: snInfo.productType,
    size: snInfo.size,
    mfgDate: mfgDate,
    expiryDate: expiry,
    productionDate: snInfo.productionDate,
    unitNumber: snInfo.unitNumber,
    expired: expired,
    sizeConfirmedBy: "REF+SN"      // both agreed; recorded for the audit trail
  };
}

/** The DS size this Unica size requires. Mirrors UNICA_TO_DS in the app. */
function requiredDsSize(unicaSize){
  return ({ S: "Short", M: "Short", L: "Long", XL: "Long" })[unicaSize] || null;
}

var api = {
  parseDeviceQr: parseDeviceQr,
  parseSn: parseSn,
  normaliseRef: normaliseRef,
  requiredDsSize: requiredDsSize,
  REF_MAP: REF_MAP,
  SN_PRODUCTS: SN_PRODUCTS
};

if(typeof module !== "undefined" && module.exports) module.exports = api;
if(typeof window !== "undefined") window.DeviceQr = api;

</script>

function stageRequired(s){
  if(s.kind === "eval")  return [["suitability","Anatomical suitability"],

   Gating asks this rather than the raw status, so data that arrived from an import or
   an older build cannot slip an empty stage past the sequence. */
function stageComplete(p, s){
  const st = p.anat[s.k].status;
  if(st === "Not required") return true;
  return st === "Completed" && stageMissing(p, s).length === 0;

/* A stage may not remain "Completed" once its required fields are gone - a field cleared
   after completion, or data from an older build. It drops back to "In progress" so the
   Status dropdown can never say "Completed" while the badge says "Incomplete". Returns
   true if it changed anything. */
function reconcileStageStatus(p, s){
  const a = p.anat[s.k];
  if(a.status === "Completed" && stageMissing(p, s).length){
    a.status = "In progress";
    a.completedBy = "";        // cleared so a later re-completion stamps the right person
    return true;
  }
  return false;
}

function anatUnlocked(p, key){
  const i = ANAT_STAGES.findIndex(s => s.k === key);
  if(i <= 0) return true;

     and this holds even under an override: ordering product for a procedure with no

  if(key === "order" && !stageComplete(p, ANAT_STAGES.find(s => s.k === "scheduling")))

  return ANAT_STAGES.slice(0, i).every(s => stageComplete(p, s));

  const SEED_REF = { UNICA:{ S:"A-1033", M:"A-1032", L:"A-1031", XL:"A-1030" },
                     DS:   { Short:"A-2021", Long:"A-2017" } };
  const SEED_SN  = { UNICA:{ S:"SU", M:"MU", L:"LU", XL:"XU" },
                     DS:   { Short:"S",  Long:"L" } };
  const mk = (productType,size,locationId,status,days,extra) => {

    const unit = String(1000 + n).slice(-4);
    return Object.assign({
      id:"dev-"+(++n),
      ref: SEED_REF[productType][size],
      sn:  (productType === "UNICA" ? "IM-" : "DS-") +
           SEED_SN[productType][size] + "-" + ddmmyy + "-" + unit,
      mfgDate: mfg,

  const D = [

    mk("UNICA","L", "loc-wh-1","IN_WH", 95),  mk("UNICA","XL","loc-wh-2","IN_WH", 500),
    mk("UNICA","M", "loc-site-a",  "IN_SITE",150), mk("UNICA","L","loc-site-a", "IN_SITE",260),
    mk("UNICA","S", "loc-site-b","IN_SITE",180),
    mk("UNICA","M", "loc-site-c",  "DELIVERED",240,{ shippedBy:"Jordan Meyer", shippedFromId:"loc-wh-2", shippedAt:nowISO() }),
    mk("UNICA","L", "loc-site-b","ON_WAY", 320,{ shippedBy:"Jordan Meyer", shippedFromId:"loc-wh-1", shippedAt:nowISO() }),
    /* Seeded as live stock with a date in the past on purpose: applyExpiry()
       must be what moves it to Expired, so the automatic transition and its
       alert are actually exercised rather than faked in the seed. */
    mk("UNICA","S", "loc-wh-1","IN_WH", -12),
    mk("UNICA","S", "loc-wh-1","IN_WH", 340),
    mk("DS","Short","loc-wh-1","IN_WH", 300), mk("DS","Short","loc-site-a","IN_SITE",150),
    mk("DS","Long", "loc-wh-1","IN_WH", 280), mk("DS","Long", "loc-wh-2","IN_WH",460),
    mk("DS","Short","loc-site-b","IN_SITE",200), mk("DS","Long","loc-site-c","DELIVERED",240,{ shippedBy:"Jordan Meyer", shippedFromId:"loc-wh-2", shippedAt:nowISO() }),
    mk("UNICA","M", "loc-site-a",  "USED", 90), mk("DS","Short","loc-site-a","USED", 90)
  ];
  const mkPatient = o => Object.assign({
    reminders:[], piNotes:"", customQuestions:[], caseFile:{}, images:[],
    submitted:false, fileLocked:false, notes:"",
    screening:blankScreening(), anat:blankAnat(), anatOverride:null,
    cancelled:{ is:false, reason:"", by:"", at:"", stage:"" }
  }, o);
  const P = [
    mkPatient({ id:"pat-1", patientCode:"NGM-014", siteId:"loc-site-a", procedureDate:daysFromNow(6),
      unicaSize:"M", dsSize:"Short", status:"SCHEDULED", notes:"Severe TR, EuroSCORE II 6.1%",
      customQuestions:[{ q:"Prior pacemaker lead present?", a:"" },
                       { q:"Anticoagulation held for how long?", a:"" }],
      reminders:[{ date:daysFromNow(4), text:"Confirm proctor availability", done:false }],
      piNotes:"PI wants the CT reviewed again with the core lab before scheduling." }),
    mkPatient({ id:"pat-2", patientCode:"NGM-015", siteId:"loc-site-a", procedureDate:"",
      unicaSize:"L", dsSize:"Long", status:"ELIGIBLE", notes:"Awaiting CT review",
      piNotes:"Discuss access vessel calibre with the PI before booking." }),
    mkPatient({ id:"pat-3", patientCode:"RVS-007", siteId:"loc-site-b", procedureDate:daysFromNow(-14),
      unicaSize:"S", dsSize:"Short", status:"TREATED", submitted:true, fileLocked:true,
      notes:"Uneventful",
      caseFile:{ procDate:daysFromNow(-14), proctor:"Dr. R. Hayes", tech1:"Sam Patel" } }),
    mkPatient({ id:"pat-4", patientCode:"CHI-003", siteId:"loc-site-c", procedureDate:daysFromNow(-3),
      unicaSize:"XL", dsSize:"Long", status:"CANCELLED", submitted:true,
      notes:"Access vessel unsuitable" })
  ];
  const G = [
    { id:uid("log"), timestamp:nowISO(), action:"Store seeded with demonstration data", locationId:null, userName:"system", role:"SYSTEM", stateChanges:"schema v"+SCHEMA_VERSION, comments:"", highPriority:false }
  ];
  const N = [
    { id:uid("ntf"), ts:nowISO(), text:"Unica M at Continental Heart Institute is Delivered (unverified) — formal Arrival & Condition Verification still required.", forRoles:["ADMIN","CPM","EMPLOYEE"], forUserIds:["usr-wh"], locationId:"loc-site-c", read:false },
    { id:uid("ntf"), ts:nowISO(), text:"Unica S in Innoventric WH — Israel has passed its expiry date and was removed from live stock.", forRoles:["ADMIN","WH_ADMIN"], forUserIds:[], locationId:"loc-wh-1", read:false }
  ];

  return { version:SCHEMA_VERSION, users:U, locations:L, devices:D, patients:P,

/* Structural + referential validation. A half-migrated clinical store is worse
   than none, so anything that fails is reseeded rather than patched. */
function validate(db){
  if(!db || db.version !== SCHEMA_VERSION) return false;
  const need = ["users","locations","devices","patients","logs","notifications","backupQueue"];
  if(!need.every(k => Array.isArray(db[k]))) return false;
  const locIds = new Set(db.locations.map(l => l.id));
  if(db.devices.some(d => d.locationId && !locIds.has(d.locationId))) return false;
  if(db.patients.some(p => p.siteId && !locIds.has(p.siteId))) return false;
  if(db.users.some(u => !ROLES[u.role])) return false;
  if(db.users.some(u => u.locationId && !locIds.has(u.locationId))) return false;
  return true;
}

function loadDB(){
  let raw = null;
  try{ raw = localStorage.getItem(STORE_KEY); }catch(e){ raw = null; }
  if(raw){
    try{
      const db = JSON.parse(raw);
      if(validate(db)) return db;
      console.warn("[store] existing data failed validation for schema v" + SCHEMA_VERSION + "; reseeding.");
    }catch(e){ console.warn("[store] unreadable, reseeding.", e); }
  }
  const fresh = seed();
  saveDB(fresh);
  return fresh;
}
function saveDB(db){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(db || S.db)); }
  catch(e){ console.warn("[store] could not persist:", e); }
}
/* Autosave: every mutation goes through this, so a reload, a locked screen or
   a crash restores the exact in-progress state. */
function commit(){ saveDB(S.db); }

/* Drafts are deliberately separate from the record store: they are one person's
   unfinished screen, not data anyone else should ever see or sync. */
function saveDrafts(){
  try{ localStorage.setItem(DRAFT_KEY, JSON.stringify({ ar:AR, sh:SH })); }catch(e){}
}
function loadDrafts(){
  try{ return JSON.parse(localStorage.getItem(DRAFT_KEY) || "{}") || {}; }catch(e){ return {}; }
}

function logAction(action, opts){

  S.db.logs.unshift({
    id:uid("log"), timestamp:nowISO(), action,
    locationId: opts.locationId || (S.me && S.me.locationId) || null,
    userName: (S.me && S.me.name) || "unknown",
    role: (S.me && S.me.role) || "unknown",
    stateChanges: opts.stateChanges || "",
    comments: opts.comments || "",
    highPriority: !!opts.highPriority
  });

}
function notify(text, forRoles, forUserIds, locationId){
  S.db.notifications.unshift({ id:uid("ntf"), ts:nowISO(), text,
    forRoles:forRoles||[], forUserIds:forUserIds||[], locationId:locationId||null, read:false });
  commit();
}
/* A product-order request has just been raised. Notify the admins and warehouse
   managers in-app, record it in the audit log, and - when a backend is present - ask
   the server to email the same people (who requested, what, when, procedure date,
   from where, to where). Called exactly once per patient, guarded by order.requestedBy. */
function announceOrderRequest(p){
  const o = p.anat.order, sc = p.anat.scheduling;
  const rec = currentRecommendation(p);
  const ds  = rec.size && window.DeviceQr ? window.DeviceQr.requiredDsSize(rec.size) : "";
  const text = [
    "Product order requested for " + p.patientCode + " by " + S.me.name,
    "Unica " + (rec.size || "?") + " / DS " + (ds || "?"),
    o.accessories ? "Accessories: " + o.accessories : "",
    "Procedure: " + (fmtDate(p.procedureDate) || "—") + (sc.hospital ? " at " + sc.hospital : ""),
    "From " + locName(p.siteId) + " to " + (o.shippingDest || "—"),
    o.requestedDate ? "Requested delivery: " + fmtDate(o.requestedDate) : ""
  ].filter(Boolean).join(" · ");

  notify(text, ["ADMIN","WH_ADMIN"], [], p.siteId);
  logAction("Product order requested for " + p.patientCode, { locationId:p.siteId, highPriority:true,
    stateChanges:"Product Order Request raised", comments:text });

  if(S.backend){
    fetch("/api/orders/notify", { method:"POST", credentials:"same-origin",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({
        patientCode: p.patientCode, requestedBy: S.me.name,
        implantSize: rec.size || "", dsSize: ds || "", accessories: o.accessories || "",
        procedureDate: fmtDate(p.procedureDate), hospital: sc.hospital || "",
        fromSite: locName(p.siteId), shippingDest: o.shippingDest || "",
        requestedDate: fmtDate(o.requestedDate) })
    }).then(r => r.ok ? r.json() : null)
      .then(res => { if(res && res.sent) toast("Order request emailed to " + res.count + " recipient(s).", "good"); })
      .catch(() => { /* email is best-effort; the in-app notification already stands */ });
  }
}
/* Queue-first: the local record is the durability guarantee, the upload is
   best-effort. Nothing is lost when the network is not there. */
function queueBackup(path, filename, content){
  const rec = { id:uid("bkp"), path, filename, content:JSON.stringify(content), ts:nowISO(),
                synced:false, syncNote:"Queued" };
  S.db.backupQueue.unshift(rec);
  commit();
  trySync(rec);
  return rec;
}
async function trySync(rec){
  if(!S.backend){ rec.syncNote = "Queued — running standalone, no backend"; commit(); return; }
  try{
    const r = await fetch("/api/output/upload", {
      method:"POST", credentials:"same-origin",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ path:rec.path, filename:rec.filename, content:rec.content,
                             contentType: rec.contentType || "application/json",
                             contentEncoding: rec.encoding || undefined })
    });
    if(r.ok){ rec.synced = true; rec.syncNote = "Uploaded to OneDrive"; }
    else {
      const e = await r.json().catch(() => ({}));
      rec.syncNote = "Queued — " + ((e.error && e.error.message) || ("HTTP " + r.status));
    }
  }catch(e){ rec.syncNote = "Queued — network unavailable"; }
  commit();
  if(S.view === "backup") render();
}

/* Statuses that are set by the system, not by a person. */
function applyExpiry(){
  const today = new Date().toISOString().slice(0,10);
  let n = 0;
  for(const d of S.db.devices){
    if(d.expiration && d.expiration < today && ["IN_WH","IN_SITE","DELIVERED","ON_WAY"].includes(d.status)){
      d.status = "EXPIRED"; n++;
      notify(`${prodLabel(d)} ${d.ref} expired on ${d.expiration} and was removed from live stock.`,
             ["ADMIN","WH_ADMIN"], [], d.locationId);
    }
  }
  if(n){ logAction(`${n} device(s) auto-expired`, { stateChanges:"→ Expired", highPriority:true }); }
}

const $  = (s,r) => (r||document).querySelector(s);
const $$ = (s,r) => Array.from((r||document).querySelectorAll(s));
function esc(v){
  return String(v==null ? "" : v).replace(/[&<>"']/g, c =>
    ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
function toast(msg, kind){
  const t = document.createElement("div");
  t.className = "toast" + (kind ? " " + kind : "");
  t.textContent = msg;
  $("#toasts").appendChild(t);
  setTimeout(() => t.remove(), 3600);
}
/* ----------------------------------------------------------------- dialogs */
/* A dialog owes the user four things it was not giving: Escape closes it, focus
   moves into it and comes back out to whatever opened it, assistive technology is
   told it is a dialog, and anything it started (a camera) is stopped on the way
   out. The click handler is bound ONCE below rather than on every open — #modal-root
   is permanent, so re-binding accumulated one dead listener per dialog opened. */
let MODAL_CLEANUP = null;     // set by whoever needs teardown, cleared on close
let MODAL_RETURN  = null;     // element that had focus when the dialog opened

function closeModal(){
  if(MODAL_CLEANUP){ try{ MODAL_CLEANUP(); }catch(e){} MODAL_CLEANUP = null; }
  $("#modal-root").innerHTML = "";
  if(MODAL_RETURN && document.contains(MODAL_RETURN)){
    try{ MODAL_RETURN.focus(); }catch(e){}
  }
  MODAL_RETURN = null;
}
function modalOpen(){ return !!$("#modal-root .modal"); }

function modal(title, bodyHTML, footerHTML){
  MODAL_RETURN = document.activeElement;
  $("#modal-root").innerHTML =
    '<div class="modal-bg" data-close="1">' +
      '<div class="modal" role="dialog" aria-modal="true" aria-label="' + esc(title) + '">' +
        '<div class="card-hd"><h2>' + esc(title) + '</h2>' +
          '<button class="btn btn-sm" data-close="1" aria-label="Close this dialog">Close</button></div>' +
        '<div class="card-bd">' + bodyHTML + '</div>' +
        (footerHTML ? '<div class="card-ft">' + footerHTML + '</div>' : '') +
      '</div>' +
    '</div>';
  const m = $("#modal-root .modal");
  /* Focus the first real control, so a keyboard or screen-reader user starts inside
     the dialog rather than behind it. */
  const first = m.querySelector("input:not([type=hidden]):not([disabled]), select, textarea") ||
                m.querySelector(".card-ft .btn") || m.querySelector("[data-close]");
  if(first) setTimeout(() => { try{ first.focus(); }catch(e){} }, 0);
  return m;
}

/* Bound once, at parse time, for the life of the page. */
$("#modal-root").addEventListener("click", e => {
  if(e.target.dataset && e.target.dataset.close) closeModal();
});
document.addEventListener("keydown", e => {
  if(e.key !== "Escape" || !modalOpen()) return;
  e.preventDefault();
  closeModal();
});
/* Keep Tab inside the dialog. Without this, tabbing walks off into the page
   underneath, which is still fully interactive behind the overlay. */
document.addEventListener("keydown", e => {
  if(e.key !== "Tab" || !modalOpen()) return;
  const f = $$('#modal-root button, #modal-root [href], #modal-root input, ' +
               '#modal-root select, #modal-root textarea')
              .filter(el => !el.disabled && el.offsetParent !== null);
  if(!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
});

/* ------------------------------------------------------------- refusal text */
/* Every "this is why I cannot do that yet" message in the app goes through here.
   Previously each screen wrote into a .hint span parked at the far right of the
   footer — 2.88:1 contrast, 11.5px, nowhere near the button that was pressed, so
   pressing Submit and being refused looked identical to pressing Submit and
   nothing happening. */
function showWhy(id, msg){
  const el = $("#" + id);
  if(!el) return;
  el.textContent = msg || "";
  el.classList.toggle("on", !!msg);
  if(msg && el.scrollIntoView) el.scrollIntoView({ block:"nearest", behavior:"smooth" });
}
function clearWhy(id){ showWhy(id, ""); }
function whyBox(id){ return '<div class="why" id="' + id + '" role="alert"></div>'; }

const loc      = id => S.db.locations.find(l => l.id === id) || null;
const locName  = id => (loc(id) || {}).name || "—";
const user     = id => S.db.users.find(u => u.id === id) || null;
const patient  = id => S.db.patients.find(p => p.id === id) || null;
const device   = id => S.db.devices.find(d => d.id === id) || null;
const prodLabel= d => (PRODUCTS.find(p => p.key === d.productType) || {label:d.productType}).label;
const devName  = d => prodLabel(d) + " " + d.size;
function pill(map, key){
  const m = map[key] || { label:key, cls:"p-grey" };
  return '<span class="pill ' + m.cls + '">' + esc(m.label) + '</span>';
}
function fmtDate(s){
  if(!s) return "—";
  const str = String(s);
  /* A datetime-local value (YYYY-MM-DDTHH:mm) shows its time too; a plain date stays a date. */
  return (str.length > 10 && str.charAt(10) === "T")
    ? str.slice(0,10) + " " + str.slice(11,16)
    : str.slice(0,10);
}
function fmtTs(s){
  if(!s) return "—";
  const d = new Date(s);
  return isNaN(d) ? String(s) : d.toLocaleString(undefined,
    { year:"numeric", month:"short", day:"2-digit", hour:"2-digit", minute:"2-digit" });
}
function initials(n){
  return String(n||"?").trim().split(/\s+/).slice(0,2).map(w => w[0]).join("").toUpperCase();
}
/* Location scoping. A WH Admin sees their warehouse; an employee assigned to a
   site sees that site; anyone with no assigned location sees everything. */
function scopedLocIds(){
  if(!S.me) return null;
  if(S.me.role === "WH_ADMIN" || S.me.role === "EMPLOYEE"){
    if(S.me.locationId) return [S.me.locationId];
  }
  return null;
}
function inScope(locationId){
  const s = scopedLocIds();
  return !s || (locationId && s.includes(locationId));
}
function visibleLocations(){
  const s = scopedLocIds();
  return s ? S.db.locations.filter(l => s.includes(l.id)) : S.db.locations.slice();
}
function visibleDevices(){
  const s = scopedLocIds();
  return s ? S.db.devices.filter(d => s.includes(d.locationId)) : S.db.devices.slice();
}
function myAlerts(){
  const me = S.db.users.find(u => u.email === (S.me && S.me.email));
  return S.db.notifications.filter(n => {
    const byRole = n.forRoles && n.forRoles.includes(S.me.role);
    const byUser = me && n.forUserIds && n.forUserIds.includes(me.id);
    if(!byRole && !byUser) return false;
    return byUser || inScope(n.locationId) || !n.locationId;
  });
}

/* ============================================================= QR SCANNING =
   Every device identifier in this app is read from the unit's QR code. There is no
   "take a photo of the label" path any more: a photograph of a label is not data,
   it is a picture of data that somebody has to read later and type in by hand.

   Two decoders, in preference order, both giving a LIVE camera on every platform:
     native   - BarcodeDetector. Chrome, Edge, Chrome on Android. Hardware-backed.
     vendored - jsQR, decoding canvas frames in JavaScript. This is what makes
                iPhone and iPad work: Safari has no BarcodeDetector at all. It is a
                properly installed npm package served from our own origin, not
                pasted code and not a CDN, so default-src 'self' still holds.

   A hardware wedge scanner needs neither: it types into the focused field, so the
   value simply arrives as if scanned. That path is unchanged.

   Manual entry stays available on every field, always, because a QR code that will
   not read must never stop a procedure. But it is recorded: the value is flagged
   hand-entered in the UI and in the audit log, so data provenance survives.

   Photographs still exist in one place only - the source images behind a typed
   measurement in stage 3, which are evidence of a reading, not an identifier.     */

const SCANFIELDS = {};        // field id -> { onCode(code, wasManual), label }
const MANUAL_OPEN = {};       // field id -> true once the user asks to type it

/* jsQR ships as a UMD bundle, so it lands on window.jsQR. Wrapping it here means
   the rest of the app never names the package, and swapping decoders later is a
   change to this one adapter. */
const PivotalScanner = {
  ready(){ return typeof window !== "undefined" && typeof window.jsQR === "function"; },
  /* ImageData -> string | null */
  decodeImageData(img){
    if(!this.ready()) return null;
    const r = window.jsQR(img.data, img.width, img.height, { inversionAttempts:"attemptBoth" });
    return r && r.data ? r.data : null;
  }
};

function nativeDetectorPossible(){
  return typeof window !== "undefined" && typeof window.BarcodeDetector === "function";
}
function scannerKind(){
  if(nativeDetectorPossible()) return "native";
  if(PivotalScanner.ready())   return "vendored";
  return "none";
}
function cameraPossible(){
  return scannerKind() !== "none" && !!(navigator.mediaDevices &&
         typeof navigator.mediaDevices.getUserMedia === "function");
}

/** Markup for a QR-first identifier field. Register SCANFIELDS[id] first. */
function scanField(id, label, value, opts){
  opts = opts || {};
  const manual  = !!MANUAL_OPEN[id];
  const canScan = cameraPossible();
  const matched = !!(value && !manual);
  return '<div class="field" data-scanwrap="' + id + '">' +
    '<label class="' + (opts.req ? "req" : "") + '" for="' + id + '">' + esc(label) + '</label>' +
    '<div class="row" style="gap:7px;flex-wrap:nowrap">' +
      '<input type="text" id="' + id + '" value="' + esc(value || "") + '"' +
        (manual ? "" : " readonly") + (opts.disabled ? " disabled" : "") +
        ' placeholder="' + (manual ? "type the identifier" : "scan the QR code on the unit") + '"' +
        ' autocomplete="off" inputmode="text">' +
      (opts.disabled || !canScan ? "" :
        '<button type="button" class="btn btn-primary" data-scan="' + id + '" style="flex:none">' +
          '<svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true" fill="none" ' +
            'stroke="currentColor" stroke-width="1.8" stroke-linecap="round">' +
            '<path d="M3 7V4h3M17 7V4h-3M3 13v3h3M17 13v3h-3M3 10h14"/></svg>' +
          'Scan QR</button>') +
    '</div>' +
    (opts.disabled ? "" :
      (manual
        ? '<div class="warn" style="margin:6px 0 0;font-size:12px">' +
          '<b>Hand-entered, not scanned.</b> This is recorded against the entry and in the ' +
          'audit log. <a href="#" data-manualoff="' + id + '">Scan the QR code instead</a></div>'
        : (matched ? "" :
          '<div class="hint">Point the camera at the QR code on the unit. A wedge scanner ' +
          'types straight into the field. ' +
          '<a href="#" data-manual="' + id + '">Enter it by hand</a> if the code will not read.' +
          (canScan ? "" : ' <b>This device has no camera scanner available</b>, so hand entry ' +
            'is the only option here.') + '</div>'))) +
  '</div>';
}

/** Attach handlers for every scan field currently in the DOM. */
function wireScanFields(){
  $$("[data-scan]").forEach(b => b.onclick = () => {
    const id = b.dataset.scan;
    startScan(id, (SCANFIELDS[id] || {}).label || "identifier");
  });
  $$("[data-manual]").forEach(a => a.onclick = e => {
    e.preventDefault(); MANUAL_OPEN[a.dataset.manual] = true; render();
  });
  $$("[data-manualoff]").forEach(a => a.onclick = e => {
    e.preventDefault(); delete MANUAL_OPEN[a.dataset.manualoff]; render();
  });
  Object.keys(SCANFIELDS).forEach(id => {
    const el = $("#" + id);
    if(!el || el.dataset.bound) return;
    el.dataset.bound = "1";
    // Covers both hand typing and a hardware wedge scanner.
    el.addEventListener("change", () => deliverCode(id, el.value.trim(), !!MANUAL_OPEN[id]));
    el.addEventListener("keydown", e => {
      if(e.key === "Enter"){ e.preventDefault(); deliverCode(id, el.value.trim(), !!MANUAL_OPEN[id]); }
    });
  });
}
function deliverCode(id, code, wasManual){
  const h = SCANFIELDS[id];
  if(!h || !code) return;
  h.onCode(code, wasManual);
}

/* One scanning path for every platform. The engine differs underneath; the operator
   sees the same camera, the same framing box and the same words either way. */
function startScan(id, label){
  if(!cameraPossible()){
    MANUAL_OPEN[id] = true;
    toast("No camera scanner on this device — type it in, it will be recorded as hand-entered.", "warn");
    return render();
  }

  modal("Scan the QR code — " + label,
    '<div class="scan-frame">' +
      '<video id="scan-video" playsinline muted></video><div class="scan-ret"></div>' +
    '</div>' +
    '<div class="hint" style="margin-top:9px" id="scan-msg" role="status">Starting the camera…</div>',
    '<div class="row"><button class="btn" data-close="1">Cancel</button>' +
    '<button class="btn" id="scan-type">Enter by hand instead</button>' +
    '<span class="spacer"></span>' +
    '<button class="btn btn-sm" id="scan-torch" hidden>Light</button></div>');

  $("#scan-type").onclick = () => { MANUAL_OPEN[id] = true; closeModal(); render(); };

  const video = $("#scan-video");
  const det = nativeDetectorPossible() ? new window.BarcodeDetector() : null;
  const cv = document.createElement("canvas");
  const cx = cv.getContext("2d", { willReadFrequently:true });
  let stream = null, stopped = false;

  /* Registered with the modal, so Escape, the Close button and a click on the
     backdrop all shut the camera off. Leaving a stream running behind a closed
     dialog keeps the recording indicator lit, which in a hospital is alarming. */
  MODAL_CLEANUP = () => {
    stopped = true;
    if(stream) stream.getTracks().forEach(t => t.stop());
    stream = null;
  };

  /* jsQR needs pixels, so frames go through a small canvas. 480px on the long edge
     decodes a label held at arm's length and keeps the loop inside a frame budget
     on an older iPad. */
  function decodeFrame(){
    const vw = video.videoWidth, vh = video.videoHeight;
    if(!vw || !vh) return null;
    const scale = Math.min(1, 480 / Math.max(vw, vh));
    cv.width = Math.round(vw * scale); cv.height = Math.round(vh * scale);
    cx.drawImage(video, 0, 0, cv.width, cv.height);
    return PivotalScanner.decodeImageData(cx.getImageData(0, 0, cv.width, cv.height));
  }

  navigator.mediaDevices.getUserMedia({
    video:{ facingMode:{ ideal:"environment" }, width:{ ideal:1280 }, height:{ ideal:960 } }
  }).then(async s => {
    if(stopped){ s.getTracks().forEach(t => t.stop()); return; }
    stream = s; video.srcObject = s;
    try{ await video.play(); }catch(e){}
    const msg = $("#scan-msg");
    if(msg) msg.textContent = "Hold the QR code inside the frame.";

    /* Cath labs are dim and the drape is dark. If the camera exposes a torch, offer it. */
    const track = s.getVideoTracks()[0];
    const caps = track && track.getCapabilities ? track.getCapabilities() : {};
    const torchBtn = $("#scan-torch");
    if(torchBtn && caps && caps.torch){
      torchBtn.hidden = false;
      let on = false;
      torchBtn.onclick = async () => {
        on = !on;
        try{ await track.applyConstraints({ advanced:[{ torch:on }] });
             torchBtn.textContent = on ? "Light off" : "Light"; }
        catch(e){ torchBtn.hidden = true; }
      };
    }

    let misses = 0;
    const tick = async () => {
      if(stopped) return;
      let code = null;
      try{
        if(det){
          const found = await det.detect(video);
          if(found && found.length) code = found[0].rawValue;
        }
        if(!code) code = decodeFrame();
      }catch(e){ /* an undecodable frame is the normal case, not an error */ }

      if(code){
        MODAL_CLEANUP(); closeModal();
        return deliverCode(id, String(code).trim(), false);
      }
      /* Roughly ten seconds of nothing means the code is damaged, or the operator is
         pointing at the wrong thing. Say so rather than letting them keep waiting. */
      if(++misses === 300 && msg)
        msg.innerHTML = '<b>Still nothing.</b> Move closer, steady the unit, or ' +
          '<a href="#" id="scan-give-up">enter it by hand</a>.';
      const giveUp = $("#scan-give-up");
      if(giveUp) giveUp.onclick = e => {
        e.preventDefault(); MANUAL_OPEN[id] = true; closeModal(); render();
      };
      requestAnimationFrame(tick);
    };
    tick();
  }).catch(err => {
    const msg = $("#scan-msg");
    const denied = err && (err.name === "NotAllowedError" || err.name === "SecurityError");
    if(msg) msg.innerHTML = denied
      ? '<b>Camera permission was refused.</b> Allow the camera for this site in your ' +
        'browser settings, or enter the identifier by hand below.'
      : '<b>The camera could not be opened.</b> Another app may be using it. ' +
        'Enter the identifier by hand below.';
  });
}

/* ============================================ SOURCE IMAGES (pressure / echo) =
   Capture the machine screen as the evidence behind a typed number, redact it, and
   file it under the patient's study code.

   Redaction is DETERMINISTIC - fixed regions, not detection - so it cannot miss an
   identifier the way OCR can. Per the agreed design there is no confirmation step:
   the image is masked and filed automatically.
   Re-encoding through a canvas also strips every EXIF field, which is where camera
   GPS coordinates and the device serial would otherwise sit.                       */

function pickImage(onFile){
  const inp = document.createElement("input");
  inp.type = "file";
  inp.accept = "image/*";
  inp.setAttribute("capture", "environment");   // opens the camera on iOS / Android
  inp.style.display = "none";
  document.body.appendChild(inp);
  inp.onchange = () => {
    const f = inp.files && inp.files[0];
    inp.remove();
    if(f) onFile(f);
  };
  inp.click();
}

async function redactImage(file){
  const bmp = await createImageBitmap(file);
  const scale = Math.min(1, REDACTION.maxEdge / Math.max(bmp.width, bmp.height));
  const w = Math.max(1, Math.round(bmp.width * scale));
  const h = Math.max(1, Math.round(bmp.height * scale));
  const cv = document.createElement("canvas");
  cv.width = w; cv.height = h;
  const cx = cv.getContext("2d");
  cx.drawImage(bmp, 0, 0, w, h);

  cx.fillStyle = "#000";
  for(const r of REDACTION.regions){
    cx.fillRect(Math.round(r.x * w), Math.round(r.y * h),
                Math.round(r.w * w), Math.round(r.h * h));
  }
  // A visible marker, so nobody mistakes a redacted copy for the original.
  cx.fillStyle = "#fff";
  cx.font = Math.max(11, Math.round(h * 0.022)) + "px sans-serif";
  cx.fillText("IDENTIFIERS REDACTED — " + new Date().toISOString().slice(0,10),
              Math.round(w * 0.01), Math.round(h * 0.085));

  const dataUrl = cv.toDataURL("image/jpeg", REDACTION.quality);
  return { dataUrl, base64: dataUrl.split(",")[1], width:w, height:h };
}

async function captureSourceImage(p, fieldKey, fieldLabel){
  if(p.fileLocked) return toast("This case file is locked.", "bad");
  pickImage(async (file) => {
    try{
      const out = await redactImage(file);
      const bytes = Math.round(out.base64.length * 0.75);
      if(bytes > 4 * 1024 * 1024)
        return toast("That image is still too large after processing.", "bad");

      const stamp = new Date().toISOString().replace(/[:.]/g, "-");
      const filename = p.patientCode + "_" + fieldKey + "_" + stamp + ".jpg";
      /* Filed under the patient's STUDY CODE, never a name. The code is a
         pseudonym, which is the point of using it here. */
      const folder = locName(p.siteId) + "/Clinical_Procedures/" + p.patientCode + "/source_images";

      if(!p.images) p.images = [];
      p.images.push({ id:uid("img"), field:fieldKey, label:fieldLabel, filename, folder,
                      ts:nowISO(), by:S.me.email, w:out.width, h:out.height, bytes,
                      thumb:out.dataUrl });
      commit();

      queueBackupBinary(folder, filename, out.base64, "image/jpeg");
      logAction("Source image captured for " + fieldLabel + " (" + p.patientCode + ")", {
        locationId:p.siteId,
        stateChanges:"redacted, EXIF stripped, " + out.width + "x" + out.height,
        comments:"Filed as " + folder + "/" + filename
      });
      toast("Image redacted and filed under " + p.patientCode + ".", "good");
      render();
    }catch(e){
      console.error(e);
      toast("Could not process that image.", "bad");
    }
  });
}

/* Binary sibling of queueBackup: same queue-first durability, base64 on the wire. */
function queueBackupBinary(path, filename, base64, contentType){
  const rec = { id:uid("bkp"), path, filename, content:base64, encoding:"base64",
                contentType, ts:nowISO(), synced:false, syncNote:"Queued" };
  S.db.backupQueue.unshift(rec);
  commit();
  trySync(rec);
  return rec;
}

/* --------------------------------------------------------- FIFO suggestion */
/* Propose the unit with the earliest expiry matching product and size at that
   location. Returns null when nothing matches — the caller must then either
   stop or take a recorded override. */
function fifoPick(productType, size, locationId){
  const today = new Date().toISOString().slice(0,10);
  return S.db.devices
    .filter(d => d.productType === productType && d.size === size &&
                 d.locationId === locationId &&
                 (d.status === "IN_WH" || d.status === "IN_SITE") &&
                 d.expiration >= today)
    .sort((a,b) => a.expiration.localeCompare(b.expiration))[0] || null;
}

/* ================================================================ bootstrap */
async function boot(){
  S.db = loadDB();
  applyExpiry();

  let me = null;
  if(window.PIVOTAL_DEMO){
    /* Public demo build: there is deliberately no backend to ask, so do not even
       try. Skipping the request also removes any chance of a static host's
       fallback page being mistaken for the real API. */
    S.backend = false;
  }else{
    try{
      const r = await fetch("/api/me", { credentials:"same-origin" });
      const j = await r.json();
      /* Only trust a response that actually looks like our API. A static host that
         answers every path with JSON must not be taken for a live backend. */
      if(!j || typeof j.authenticated !== "boolean") throw new Error("not our API");
      S.backend = true;
      S.cfg = j.config || null;
      S.demoAllowed = !!(j.config && j.config.demoLoginAllowed);
      if(j.authenticated) me = j.user;
    }catch(e){
      // file:// or nothing listening. Standalone mode.
      S.backend = false;
    }
  }

  if(location.hash === "#delivery"){ return showDelivery(); }

  if(me){
    S.me = me;
    return enterApp();
  }
  // No server session. Fall back to a previously chosen local identity.
  if(!S.backend){
    let saved = null;
    try{ saved = JSON.parse(localStorage.getItem(SESSION_KEY) || "null"); }catch(e){}
    if(saved && ROLES[saved.role]){ S.me = saved; return enterApp(); }
  }
  showLogin();
}

function renderNav(){
  const unread = myAlerts().filter(a => !a.read).length;
  const todo = todoItems().length;

  /* A group heading with nothing under it is noise. WH Admins have no Procedures
     and nobody but an App Admin has Setup, so the headings are emitted only once
     something below them survives the role filter. */
  let html = "", pending = null;
  for(const i of NAV){
    if(i.grp){ pending = i.grp; continue; }
    if(!i.roles.includes(S.me.role)) continue;
    if(pending){ html += '<div class="nav-lbl">' + esc(pending) + '</div>'; pending = null; }
    const on = S.view === i.k;
    const count = i.badge ? unread : (i.todo ? todo : 0);
    html += '<button class="nav-i' + (on ? " on" : "") + '" data-k="' + i.k + '"' +
      (on ? ' aria-current="page"' : "") + '>' +
      '<span class="n">' + icon(i.ic) + '</span>' +
      '<span>' + esc(i.label) + '</span>' +
      (count ? '<span class="cnt' + (i.todo ? " todo" : "") + '" title="' + count +
        ' item(s) waiting">' + count + '</span>' : '') +
    '</button>';
  }
  $("#nav").innerHTML = html;
  $$("#nav .nav-i").forEach(b => b.onclick = () => {
    S.view = b.dataset.k; closeSideMenu(); renderNav(); render();
  });
}

  const v = VIEWS[S.view];
  $("#top-actions").innerHTML = "";
  if(!v){ $("#view").innerHTML = '<div class="empty">Nothing here.</div>'; return; }

  /* Re-rendering is how this app updates, so it happens on things as small as
     ticking a checkbox. Scrolling to the top every time meant four mandatory
     arrival checks cost four trips back down the page. Only an actual change of
     view resets the scroll; a re-render of the same view holds position. */
  const changedView = LAST_VIEW !== S.view;
  const keepY = changedView ? 0 : window.scrollY;

  $("#view-title").textContent = typeof v.title === "function" ? v.title() : v.title;
  $("#view-sub").textContent   = typeof v.sub   === "function" ? v.sub()   : (v.sub || "");
  $("#view").innerHTML = v.body();
  if(v.wire) v.wire();
  wireScanFields();

  LAST_VIEW = S.view;
  window.scrollTo(0, keepY);
}
