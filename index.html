<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pivotal Study Procedures — Demo (sample data)</title>
<meta name="robots" content="noindex, nofollow">
<!--
  ===========================================================================
  PUBLIC DEMO BUILD.

  Generated from pivotal-app.html. Every person, hospital, address, phone
  number and email address in the seed data below is INVENTED. There is no
  credential, no configuration value and no real identifier anywhere in this
  file. No backend is contacted and nothing is ever uploaded.

  Do not edit this file by hand - re-generate it from the source instead.
  ===========================================================================
-->
<!--
  ============================================================================
  PIVOTAL STUDY PROCEDURES — FRONTEND (single file, zero third-party scripts)

  This page is a pure presentation layer. It holds no client secret, no access
  token and no drive id, and it never constructs a Microsoft Graph URL. All
  cloud work goes through same-origin /api/* with an httpOnly session cookie
  that JavaScript cannot read.

  It runs in two modes and detects which by itself:

    SERVED   — GET /api/me succeeds. Identity and role come from the server's
               role store and are re-checked on every request. This is the
               real mode.
    STANDALONE — the page was opened straight from disk (file://) or no backend
               is listening. There is no server to ask, so a local role picker
               is offered and everything lives in browser storage. A permanent
               banner makes this obvious, because a client-side role is exactly
               the privilege-escalation hole the backend exists to close.

  Roles are NEVER trusted from this file when a backend is present.
  ============================================================================
-->
<style>
:root{
  --brand:#E4187A; --brand-dk:#9E1259; --brand-md:#C2166B; --brand-lt:#EE3D8C;
  --brand-wash:#fdf3f8;
  --ink:#14202b; --ink-2:#33465a; --muted:#5b6b7a; --faint:#8b9aa8;
  --bg:#f4f6f8; --card:#ffffff; --line:#e2e8ee; --line-2:#eef2f6;
  --ok-bg:#d9f2e3; --ok-fg:#14622f; --ok-line:#1a8a4a;
  --warn-bg:#ffe9cc; --warn-fg:#8a4b00; --warn-line:#C79100;
  --bad-bg:#fadcda; --bad-fg:#8c211a; --bad-line:#b3372c;
  --grey-bg:#e8ecf0; --grey-fg:#4a5a68;
  --info-bg:#e2eefb; --info-fg:#14497e;
  --radius:8px; --shadow:0 1px 2px rgba(20,32,43,.06),0 2px 8px rgba(20,32,43,.05);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0; font-weight:650; letter-spacing:-.2px; color:var(--ink);}
h1{font-size:22px;} h2{font-size:17px;} h3{font-size:14.5px;} h4{font-size:13px;}
p{margin:0 0 10px;}
a{color:var(--brand-dk);}
button{font-family:inherit; font-size:inherit;}
[hidden]{display:none !important;}

/* ---------------------------------------------------------------- controls */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  padding:8px 14px; border-radius:6px; border:1px solid var(--line);
  background:#fff; color:var(--ink-2); font-weight:600; cursor:pointer;
  transition:background .12s,border-color .12s,box-shadow .12s; white-space:nowrap;
}
.btn:hover{background:#f7f9fb; border-color:#cfd9e2;}
.btn:active{transform:translateY(.5px);}
.btn:focus-visible{outline:2px solid var(--brand); outline-offset:2px;}
.btn-primary{background:var(--brand); border-color:var(--brand); color:#fff;}
.btn-primary:hover{background:var(--brand-md); border-color:var(--brand-md);}
.btn-dark{background:var(--ink); border-color:var(--ink); color:#fff;}
.btn-dark:hover{background:#22323f;}
.btn-danger{background:#fff; border-color:var(--bad-line); color:var(--bad-fg);}
.btn-danger:hover{background:var(--bad-bg);}
.btn-sm{padding:5px 10px; font-size:12.5px;}
.btn-lg{padding:11px 20px; font-size:15px;}
.btn:disabled{opacity:.45; cursor:not-allowed;}
.btn-block{width:100%;}

label{display:block; font-size:12px; font-weight:600; color:var(--muted);
      margin:0 0 4px; letter-spacing:.2px;}
input[type=text],input[type=date],input[type=time],input[type=number],
input[type=email],input[type=tel],input[type=password],select,textarea{
  width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:6px;
  background:#fff; color:var(--ink); font-family:inherit; font-size:13.5px;
}
input:focus,select:focus,textarea:focus{
  outline:none; border-color:var(--brand); box-shadow:0 0 0 3px rgba(228,24,122,.12);
}
input:disabled,select:disabled,textarea:disabled{background:#f4f6f8; color:var(--muted); cursor:not-allowed;}
textarea{min-height:70px; resize:vertical;}
.field{margin-bottom:12px;}
.hint{font-size:11.5px; color:var(--faint); margin-top:3px;}
.req::after{content:" *"; color:var(--brand);}

.check{display:flex; align-items:flex-start; gap:9px; padding:8px 10px;
       border:1px solid var(--line); border-radius:6px; margin-bottom:7px;
       cursor:pointer; background:#fff;}
.check:hover{background:#fafbfc;}
.check input{margin:2px 0 0; width:16px; height:16px; accent-color:var(--brand); flex:none; cursor:pointer;}
.check span{font-size:13.5px; color:var(--ink-2); font-weight:500;}
.check.on{border-color:var(--ok-line); background:var(--ok-bg);}
.check.on span{color:var(--ok-fg);}

/* ------------------------------------------------------------------ layout */
.grid{display:grid; gap:12px;}
.g2{grid-template-columns:repeat(2,minmax(0,1fr));}
.g3{grid-template-columns:repeat(3,minmax(0,1fr));}
.g4{grid-template-columns:repeat(4,minmax(0,1fr));}
@media(max-width:900px){.g2,.g3,.g4{grid-template-columns:1fr;}}
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
.spread{display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap;}
.spacer{flex:1;}

.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
      box-shadow:var(--shadow); margin-bottom:14px;}
.card-hd{padding:13px 16px; border-bottom:1px solid var(--line-2);
         display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;}
.card-bd{padding:16px;}
.card-ft{padding:12px 16px; border-top:1px solid var(--line-2); background:#fbfcfd;
         border-radius:0 0 var(--radius) var(--radius);}

.note,.warn,.okbox,.info{padding:10px 13px; border-radius:6px; font-size:13px; margin:0 0 12px;}
.note{background:var(--brand-wash); border-left:3px solid var(--brand); color:#6d1246;}
.warn{background:#fff8e6; border-left:3px solid var(--warn-line); color:var(--warn-fg);}
.okbox{background:#eef8f2; border-left:3px solid var(--ok-line); color:var(--ok-fg);}
.info{background:#eef4fb; border-left:3px solid #3b7cc4; color:var(--info-fg);}

.pill{display:inline-block; padding:2px 9px; border-radius:11px; font-size:11px;
      font-weight:700; letter-spacing:.3px; white-space:nowrap;}
.p-grey{background:var(--grey-bg); color:var(--grey-fg);}
.p-green{background:var(--ok-bg); color:var(--ok-fg);}
.p-orange{background:var(--warn-bg); color:var(--warn-fg);}
.p-red{background:var(--bad-bg); color:var(--bad-fg);}
.p-blue{background:var(--info-bg); color:var(--info-fg);}
.p-pink{background:var(--brand-wash); color:var(--brand-dk);}

table{width:100%; border-collapse:collapse; font-size:13px;}
th,td{padding:8px 10px; text-align:left; border-bottom:1px solid var(--line-2); vertical-align:top;}
th{background:#f7f9fb; font-size:11.5px; text-transform:uppercase; letter-spacing:.5px;
   color:var(--muted); font-weight:700; white-space:nowrap;}
tbody tr:hover{background:#fafbfc;}
.tbl-wrap{overflow:auto; border:1px solid var(--line); border-radius:var(--radius); background:#fff;}
.num{text-align:right; font-variant-numeric:tabular-nums;}
.mono{font-family:Consolas,"SF Mono",Menlo,monospace; font-size:12px;}
.empty{padding:34px 16px; text-align:center; color:var(--faint); font-size:13px;}

/* ------------------------------------------------------------------- shell */
#app{display:flex; min-height:100vh;}
#side{
  width:246px; flex:none; background:#fff; border-right:1px solid var(--line);
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
}
.brand{padding:15px 16px; border-bottom:1px solid var(--line-2); display:flex; align-items:center; gap:10px;}
.brand-txt strong{display:block; font-size:13.5px; letter-spacing:1px; line-height:1.2;}
.brand-txt small{display:block; font-size:10px; color:var(--brand);}
nav{flex:1; overflow-y:auto; padding:10px 8px;}
.nav-lbl{font-size:10px; text-transform:uppercase; letter-spacing:.9px; color:var(--faint);
         font-weight:700; padding:12px 10px 5px;}
.nav-i{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left;
  padding:8px 10px; border:0; background:none; border-radius:6px; cursor:pointer;
  color:var(--ink-2); font-size:13.5px; font-weight:500; margin-bottom:1px;
}
.nav-i:hover{background:#f3f6f9;}
.nav-i.on{background:var(--brand-wash); color:var(--brand-dk); font-weight:650;
          box-shadow:inset 2px 0 0 var(--brand);}
.nav-i .n{width:17px; height:17px; flex:none; border-radius:4px; background:var(--grey-bg);
          color:var(--grey-fg); font-size:10.5px; font-weight:700;
          display:flex; align-items:center; justify-content:center;}
.nav-i.on .n{background:var(--brand); color:#fff;}
.nav-i .cnt{margin-left:auto; background:var(--bad-bg); color:var(--bad-fg);
            border-radius:9px; padding:0 6px; font-size:10.5px; font-weight:700;}
.side-ft{border-top:1px solid var(--line-2); padding:11px 13px; font-size:12px;}
.who{display:flex; align-items:center; gap:9px; margin-bottom:9px;}
.avatar{width:31px; height:31px; border-radius:50%; background:var(--brand); color:#fff;
        display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12.5px; flex:none;}
.who div{min-width:0;}
.who b{display:block; font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.who small{display:block; color:var(--muted); font-size:11px;}

#main{flex:1; min-width:0; display:flex; flex-direction:column;}
#top{background:#fff; border-bottom:1px solid var(--line); padding:13px 22px;
     display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;}
#top .sub{font-size:12.5px; color:var(--muted); margin-top:1px;}
#view{padding:18px 22px 60px; max-width:1500px; width:100%;}

.mode-bar{background:#fff8e6; border-bottom:1px solid #f0dfae; color:var(--warn-fg);
          padding:7px 22px; font-size:12.5px; display:flex; gap:9px; align-items:center;}
.mode-bar.served{background:#eef8f2; border-bottom-color:#c6e6d3; color:var(--ok-fg);}

/* ------------------------------------------------------------------- login */
#login,#delivery{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
                 background:linear-gradient(160deg,#fdf3f8 0%,#f4f6f8 55%);}
.login-box{width:100%; max-width:430px; background:#fff; border:1px solid var(--line);
           border-radius:12px; box-shadow:0 8px 30px rgba(20,32,43,.09); padding:28px;}
.login-box .brand{border:0; padding:0 0 18px; justify-content:center;}
.login-h{text-align:center; margin-bottom:20px;}
.login-h h1{font-size:19px;}
.login-h p{color:var(--muted); font-size:13px; margin:5px 0 0;}
.sep{display:flex; align-items:center; gap:10px; margin:18px 0; color:var(--faint); font-size:11.5px;}
.sep::before,.sep::after{content:""; flex:1; height:1px; background:var(--line);}
.role-pick{display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:10px 12px;
           border:1px solid var(--line); border-radius:7px; background:#fff; cursor:pointer; margin-bottom:7px;}
.role-pick:hover{border-color:var(--brand); background:var(--brand-wash);}
.role-pick b{display:block; font-size:13.5px;}
.role-pick small{display:block; color:var(--muted); font-size:11.5px;}

/* ------------------------------------------------------------------ stages */
.stage{border-left:3px solid var(--brand); }
.stage-n{display:inline-flex; align-items:center; justify-content:center; width:23px; height:23px;
         border-radius:50%; background:var(--brand); color:#fff; font-size:12px; font-weight:700; margin-right:8px;}
.locked-ov{background:var(--grey-bg); border:1px dashed #b9c4cd; border-radius:6px;
           padding:11px 13px; font-size:13px; color:var(--grey-fg); margin-bottom:12px;}
.calc{background:#f7f9fb; border:1px solid var(--line); border-radius:6px; padding:9px 12px;}
.calc b{display:block; font-size:19px; font-variant-numeric:tabular-nums; color:var(--brand-dk);}
.calc small{color:var(--muted); font-size:11.5px;}

.matrix th:first-child,.matrix td:first-child{position:sticky; left:0; background:#fff; z-index:1;
  border-right:1px solid var(--line); font-weight:600;}
.matrix thead th{position:sticky; top:0; z-index:2;}
.matrix thead th:first-child{z-index:3; background:#f7f9fb;}
.matrix tbody tr:hover td:first-child{background:#fafbfc;}
.matrix .sub-row td{background:var(--brand-wash); font-weight:700; color:var(--brand-dk);}
.matrix .sub-row td:first-child{background:var(--brand-wash);}
.matrix .tot-row td{background:var(--ink); color:#fff; font-weight:700;}
.matrix .tot-row td:first-child{background:var(--ink); color:#fff;}
.zero{color:#c8d2da;}

.tl{position:relative; padding-left:19px;}
.tl::before{content:""; position:absolute; left:5px; top:5px; bottom:5px; width:2px; background:var(--line);}
.tl-i{position:relative; padding:0 0 13px;}
.tl-i::before{content:""; position:absolute; left:-17px; top:5px; width:9px; height:9px;
              border-radius:50%; background:var(--brand); border:2px solid #fff; box-shadow:0 0 0 1.5px var(--brand);}
.tl-i.hi::before{background:var(--bad-line); box-shadow:0 0 0 1.5px var(--bad-line);}
.tl-t{font-size:11px; color:var(--faint);}

.modal-bg{position:fixed; inset:0; background:rgba(20,32,43,.5); display:flex;
          align-items:center; justify-content:center; padding:20px; z-index:100;}
.modal{background:#fff; border-radius:10px; box-shadow:0 16px 44px rgba(0,0,0,.25);
       width:100%; max-width:460px; max-height:88vh; overflow:auto;}
.modal .card-hd{border-bottom:1px solid var(--line);}

.toast-wrap{position:fixed; right:18px; bottom:18px; z-index:200; display:flex;
            flex-direction:column; gap:8px; align-items:flex-end;}
.toast{background:var(--ink); color:#fff; padding:10px 15px; border-radius:7px; font-size:13px;
       box-shadow:0 6px 20px rgba(0,0,0,.25); max-width:340px; animation:pop .18s ease-out;}
.toast.bad{background:var(--bad-line);} .toast.good{background:var(--ok-line);}
@keyframes pop{from{opacity:0;transform:translateY(7px);}to{opacity:1;transform:none;}}

.saved{font-size:11.5px; color:var(--ok-fg); font-weight:600;}
.kv{display:flex; gap:8px; font-size:13px; padding:4px 0;}
.kv b{color:var(--muted); font-weight:600; min-width:128px;}
@media(max-width:820px){
  #side{position:fixed; z-index:50; transform:translateX(-100%); transition:transform .2s;}
  #side.open{transform:none;}
  #view{padding:14px;}
}
</style>
</head>
<body>

<div class="toast-wrap" id="toasts"></div>

        <polygon points="90,6 120,36 90,66 60,36" fill="#E4187A"/>

  <div class="login-box">
    <div class="brand">
      <svg viewBox="0 0 120 100" width="52" height="43" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <polygon points="30,6 60,36 30,66 0,36"   fill="#9E1259"/>
        <polygon points="90,6 120,36 90,66 60,36" fill="#E4187A"/>
        <polygon points="60,36 60,96 30,66"       fill="#C2166B"/>
        <polygon points="60,36 90,66 60,96"       fill="#EE3D8C"/>
      </svg>
      <div class="brand-txt"><strong>INNOVENTRIC</strong><small>Simplicity at Heart</small></div>

<!-- ========================================================== APP ======== -->
<div id="app" hidden>
  <aside id="side">
    <div class="brand">
      <svg viewBox="0 0 120 100" width="40" height="33" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <polygon points="30,6 60,36 30,66 0,36"   fill="#9E1259"/>

      <div class="brand-txt"><strong>INNOVENTRIC</strong><small>Pivotal Study</small></div>

      <div>
        <h1 id="view-title">—</h1>

<script>
/* Demo build: never contact a backend, even if one happens to answer. */
window.PIVOTAL_DEMO = true;
</script>
<script>
"use strict";
/* ========================================================================= */
/* PART A — constants, capability table, store                               */
/* ========================================================================= */
/* v6 adds: per-patient reminders, notes for the PI, procedure source images,
   and the scan-provenance flag on device identifiers. */
const SCHEMA_VERSION = 6;
/* The demo keeps its own storage keys. Browsers share storage between pages
   opened from disk, so without this a demo copy would inherit the signed-in
   session and the records of a real local install sitting beside it. */
const DEMO = (typeof window !== "undefined" && window.PIVOTAL_DEMO === true);
const STORE_KEY   = DEMO ? "pivotal.demo.store.v6"   : "pivotal.store.v6";
const SESSION_KEY = DEMO ? "pivotal.demo.session"    : "pivotal.localsession";

/* Roles must match VALID_ROLES in roleStore.js exactly. */
const ROLES = {
  ADMIN:    { label:"App Admin",           blurb:"Everything, plus the Admin screen." },
  CPM:      { label:"Clinical PM",         blurb:"Employee rights plus create/edit patients, overrides, final lock." },
  EMPLOYEE: { label:"Innoventric Employee",blurb:"Main workflow. Cannot create or edit patients." },
  WH_ADMIN: { label:"WH Admin",            blurb:"Warehouse operations, own warehouse only." }
};

/* Mirrors CAPABILITIES in roleStore.js. The server is still the authority —
   this copy only decides what to render, never what is permitted. */
const CAPABILITIES = {
  managePatients:  ["ADMIN","CPM"],
  manageLocations: ["ADMIN"],
  manageUsers:     ["ADMIN"],
  deletePatients:  ["ADMIN"],
  lockCaseFile:    ["ADMIN","CPM"],
  overrideFifo:    ["ADMIN","CPM"]
};
function can(cap){
  const a = CAPABILITIES[cap];
  return !!(a && S.me && a.includes(S.me.role));
}

const DEV_STATUS = {
  IN_WH:     { label:"In WH",                 cls:"p-blue",  stock:true  },
  ON_WAY:    { label:"On its way",            cls:"p-orange",stock:false },
  DELIVERED: { label:"Delivered (unverified)",cls:"p-orange",stock:false },
  IN_SITE:   { label:"In Site Storage",       cls:"p-green", stock:true  },
  EXPIRED:   { label:"Expired",               cls:"p-red",   stock:false },
  USED:      { label:"Used",                  cls:"p-grey",  stock:false },
  REJECTED:  { label:"Rejected",              cls:"p-red",   stock:false }
};
const PT_STATUS = {
  ELIGIBLE:  { label:"Eligible for Treatment", cls:"p-grey"   },
  SCHEDULED: { label:"Scheduled",              cls:"p-orange" },
  TREATED:   { label:"Treated",                cls:"p-green"  },
  CANCELLED: { label:"Cancelled",              cls:"p-red"    }
};

const UNICA_SIZES = ["S","M","L","XL"];
const DS_SIZES = ["Short","Long"];
/* The pairing is derived, never typed. S/M -> Short, L/XL -> Long. */
function dsForUnica(u){ return (u==="S"||u==="M") ? "Short" : (u==="L"||u==="XL") ? "Long" : ""; }

const PRODUCTS = [
  { key:"UNICA", label:"Unica Implant",   sizes:UNICA_SIZES },
  { key:"DS",    label:"Delivery System", sizes:DS_SIZES }
];

const TRAINING_ITEMS = [
  "Patient anatomy reviewed against IFU inclusion criteria",
  "CT measurements verified by two independent reviewers",
  "Implant sizing confirmed with the clinical team",
  "Procedure simulation / rehearsal completed",
  "Proctor briefed and available on site",
  "Cath lab imaging setup verified",
  "Emergency surgical backup confirmed available",
  "Anaesthesia and echo teams briefed",
  "Device handling and preparation steps reviewed"
];
const DEVICE_CONFIRMS = [
  "Device identifiers match the patient assignment",
  "Sterile barrier intact immediately before opening",
  "Expiry date checked at the table",
  "Correct Unica size and matching Delivery System present",
  "Backup device available in the room"
];
/* Deterministic redaction, not detection.
   Echo and cath machines print the patient banner in a fixed place, so the mask is
   a configured region rather than something guessed per image. That is safe by
   construction: it cannot "miss" a name the way OCR can.
   Residual risk, stated plainly: a machine that prints identifiers OUTSIDE these
   regions will have them survive. Verify once per machine model, per site. */
const REDACTION = {

/* Structural + referential validation. A half-migrated clinical store is worse
   than none, so anything that fails is reseeded rather than patched. */
function validate(db){
  if(!db || db.version !== SCHEMA_VERSION) return false;
  const need = ["users","locations","devices","patients","logs","notifications","backupQueue"];
  if(!need.every(k => Array.isArray(db[k]))) return false;
  const locIds = new Set(db.locations.map(l => l.id));
  if(db.devices.some(d => d.locationId && !locIds.has(d.locationId))) return false;
  if(db.patients.some(p => p.siteId && !locIds.has(p.siteId))) return false;
  if(db.users.some(u => !ROLES[u.role])) return false;
  if(db.users.some(u => u.locationId && !locIds.has(u.locationId))) return false;
  return true;
}

function loadDB(){
  let raw = null;
  try{ raw = localStorage.getItem(STORE_KEY); }catch(e){ raw = null; }
  if(raw){
    try{
      const db = JSON.parse(raw);
      if(validate(db)) return db;
      console.warn("[store] existing data failed validation for schema v" + SCHEMA_VERSION + "; reseeding.");
    }catch(e){ console.warn("[store] unreadable, reseeding.", e); }
  }
  const fresh = seed();
  saveDB(fresh);
  return fresh;
}
function saveDB(db){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(db || S.db)); }
  catch(e){ console.warn("[store] could not persist:", e); }
}
/* Autosave: every mutation goes through this, so a reload, a locked screen or
   a crash restores the exact in-progress state. */
function commit(){ saveDB(S.db); }

function logAction(action, opts){
  opts = opts || {};
  S.db.logs.unshift({
    id:uid("log"), timestamp:nowISO(), action,
    locationId: opts.locationId || (S.me && S.me.locationId) || null,
    userName: (S.me && S.me.name) || "unknown",
    role: (S.me && S.me.role) || "unknown",
    stateChanges: opts.stateChanges || "",
    comments: opts.comments || "",
    highPriority: !!opts.highPriority
  });
  commit();
}
function notify(text, forRoles, forUserIds, locationId){
  S.db.notifications.unshift({ id:uid("ntf"), ts:nowISO(), text,
    forRoles:forRoles||[], forUserIds:forUserIds||[], locationId:locationId||null, read:false });
  commit();
}
/* Queue-first: the local record is the durability guarantee, the upload is
   best-effort. Nothing is lost when the network is not there. */
function queueBackup(path, filename, content){
  const rec = { id:uid("bkp"), path, filename, content:JSON.stringify(content), ts:nowISO(),
                synced:false, syncNote:"Queued" };
  S.db.backupQueue.unshift(rec);
  commit();
  trySync(rec);
  return rec;
}
async function trySync(rec){
  if(!S.backend){ rec.syncNote = "Queued — running standalone, no backend"; commit(); return; }
  try{
    const r = await fetch("/api/output/upload", {
      method:"POST", credentials:"same-origin",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ path:rec.path, filename:rec.filename, content:rec.content,
                             contentType: rec.contentType || "application/json",
                             contentEncoding: rec.encoding || undefined })
    });
    if(r.ok){ rec.synced = true; rec.syncNote = "Uploaded to OneDrive"; }
    else {
      const e = await r.json().catch(() => ({}));
      rec.syncNote = "Queued — " + ((e.error && e.error.message) || ("HTTP " + r.status));
    }
  }catch(e){ rec.syncNote = "Queued — network unavailable"; }
  commit();
  if(S.view === "backup") render();
}

/* Statuses that are set by the system, not by a person. */
function applyExpiry(){
  const today = new Date().toISOString().slice(0,10);
  let n = 0;
  for(const d of S.db.devices){
    if(d.expiration && d.expiration < today && ["IN_WH","IN_SITE","DELIVERED","ON_WAY"].includes(d.status)){
      d.status = "EXPIRED"; n++;
      notify(`${prodLabel(d)} ${d.ref} expired on ${d.expiration} and was removed from live stock.`,
             ["ADMIN","WH_ADMIN"], [], d.locationId);
    }
  }
  if(n){ logAction(`${n} device(s) auto-expired`, { stateChanges:"→ Expired", highPriority:true }); }
}

/* ======================================================== BARCODE SCANNING =
   Scan-first everywhere a device identifier is entered.

   Three tiers, because no single mechanism covers the devices in use:
     native   - BarcodeDetector (Chrome / Edge / Chrome on Android). Live camera.
     vendored - window.PivotalScanner.decode(blob) -> Promise<string|null>.
                Required for iPhone and iPad: Safari has no BarcodeDetector at all.
                Install a decoder locally and expose it under that name; a CDN would
                be refused by the page's Content-Security-Policy.
     none     - no decoder present. Manual entry only, clearly labelled.

   A hardware wedge scanner needs none of this: it types into the focused field, so
   the value simply arrives as if scanned.

   Manual entry stays available on every field, but is recorded: the value is marked
   as hand-entered and written to the audit log, so data provenance survives.       */

const SCANFIELDS = {};        // field id -> { onCode(code, wasManual), label }
const MANUAL_OPEN = {};       // field id -> true once the user asks to type it

function scannerKind(){
  if(typeof window !== "undefined" && window.PivotalScanner &&
     typeof window.PivotalScanner.decode === "function") return "vendored";
  if(typeof window !== "undefined" && typeof window.BarcodeDetector === "function") return "native";
  return "none";
}
function liveCameraPossible(){
  return scannerKind() === "native" && !!(navigator.mediaDevices &&
         typeof navigator.mediaDevices.getUserMedia === "function");
}

/** Markup for a scan-first identifier field. Register SCANFIELDS[id] first. */
function scanField(id, label, value, opts){
  opts = opts || {};
  const manual = !!MANUAL_OPEN[id];
  const kind = scannerKind();
  return '<div class="field" data-scanwrap="' + id + '">' +
    '<label class="' + (opts.req ? "req" : "") + '">' + esc(label) + '</label>' +
    '<div class="row" style="gap:7px;flex-wrap:nowrap">' +
      '<input type="text" id="' + id + '" value="' + esc(value || "") + '"' +
        (manual ? "" : " readonly") + (opts.disabled ? " disabled" : "") +
        ' placeholder="' + (manual ? "type the identifier" : "scan the label") + '"' +
        ' autocomplete="off">' +
      (opts.disabled ? "" :
        '<button type="button" class="btn btn-primary" data-scan="' + id + '" style="flex:none">' +
          (kind === "none" ? "Photo" : "Scan") + '</button>') +
    '</div>' +
    (opts.disabled ? "" :
      (manual
        ? '<div class="warn" style="margin:6px 0 0;font-size:12px">Hand-entered, not scanned. ' +
          'This is recorded against the entry. <a href="#" data-manualoff="' + id + '">Scan instead</a></div>'
        : '<div class="hint">A wedge scanner types straight into the field. ' +
          '<a href="#" data-manual="' + id + '">Enter it manually</a> if the label will not read.' +
          (kind === "none" ? ' <b>No barcode decoder is installed on this device</b>, so ' +
            '"Photo" only attaches the label image.' : "") + '</div>')) +
  '</div>';
}

/** Attach handlers for every scan field currently in the DOM. */
function wireScanFields(){
  $$("[data-scan]").forEach(b => b.onclick = () => {
    const id = b.dataset.scan;
    startScan(id, (SCANFIELDS[id] || {}).label || "identifier");
  });
  $$("[data-manual]").forEach(a => a.onclick = e => {
    e.preventDefault(); MANUAL_OPEN[a.dataset.manual] = true; render();
  });
  $$("[data-manualoff]").forEach(a => a.onclick = e => {
    e.preventDefault(); delete MANUAL_OPEN[a.dataset.manualoff]; render();
  });
  Object.keys(SCANFIELDS).forEach(id => {
    const el = $("#" + id);
    if(!el || el.dataset.bound) return;
    el.dataset.bound = "1";
    // Covers both hand typing and a hardware wedge scanner.
    el.addEventListener("change", () => deliverCode(id, el.value.trim(), !!MANUAL_OPEN[id]));
    el.addEventListener("keydown", e => {
      if(e.key === "Enter"){ e.preventDefault(); deliverCode(id, el.value.trim(), !!MANUAL_OPEN[id]); }
    });
  });
}
function deliverCode(id, code, wasManual){
  const h = SCANFIELDS[id];
  if(!h || !code) return;
  h.onCode(code, wasManual);
}

async function startScan(id, label){
  const kind = scannerKind();
  if(liveCameraPossible()) return liveScan(id, label);

  /* No live decoding available. Take a photo instead: on iOS and Android this
     opens the camera directly. If a decoder exists we decode the still; if not,
     we say so rather than pretending to scan. */
  pickImage(async (file) => {
    if(kind === "none"){
      modal("No decoder on this device",
        '<div class="warn">This browser has no barcode decoder, so the label could not be ' +
        'read automatically. Safari on iPhone and iPad needs a decoder installed with the ' +
        'app.</div><p>Enter the identifier by hand for now — it will be recorded as ' +
        'hand-entered.</p>',
        '<button class="btn btn-primary" data-close="1">Understood</button>');
      MANUAL_OPEN[id] = true;
      return render();
    }
    try{
      const code = kind === "vendored"
        ? await window.PivotalScanner.decode(file)
        : await decodeWithNative(file);
      if(code) return deliverCode(id, String(code).trim(), false);
      toast("No barcode found in that photo. Try again, or enter it by hand.", "bad");
    }catch(e){ toast("Could not read that image.", "bad"); }
  });
}
async function decodeWithNative(blobOrBitmap){
  const det = new window.BarcodeDetector();
  const src = blobOrBitmap instanceof Blob ? await createImageBitmap(blobOrBitmap) : blobOrBitmap;
  const found = await det.detect(src);
  return found && found.length ? found[0].rawValue : null;
}

function liveScan(id, label){
  modal("Scan " + label,
    '<div style="background:#000;border-radius:8px;overflow:hidden;aspect-ratio:4/3">' +
      '<video id="scan-video" playsinline muted style="width:100%;height:100%;object-fit:cover"></video>' +
    '</div><div class="hint" style="margin-top:8px" id="scan-msg">Starting the camera…</div>',
    '<div class="row"><button class="btn" data-close="1">Cancel</button>' +
    '<button class="btn" id="scan-type">Enter manually</button></div>');
  $("#scan-type").onclick = () => { MANUAL_OPEN[id] = true; closeModal(); render(); };

  const video = $("#scan-video");
  let stream = null, stop = false;
  const det = new window.BarcodeDetector();

  const cleanup = () => { stop = true; if(stream) stream.getTracks().forEach(t => t.stop()); };
  $("#modal-root").addEventListener("click", e => {
    if(e.target.dataset && e.target.dataset.close) cleanup();
  });

  navigator.mediaDevices.getUserMedia({ video:{ facingMode:"environment" } })
    .then(async s => {
      stream = s; video.srcObject = s; await video.play();
      $("#scan-msg").textContent = "Hold the label steady in the frame.";
      const tick = async () => {
        if(stop) return;
        try{
          const found = await det.detect(video);
          if(found && found.length){
            cleanup(); closeModal();
            return deliverCode(id, String(found[0].rawValue).trim(), false);
          }
        }catch(e){ /* a frame that cannot be decoded is normal */ }
        requestAnimationFrame(tick);
      };
      tick();
    })
    .catch(() => {
      const m = $("#scan-msg");
      if(m) m.innerHTML = '<b>The camera could not be opened.</b> Check the browser ' +
        'permission, or enter the identifier manually.';
    });
}

/* ============================================ SOURCE IMAGES (pressure / echo) =
   Capture the machine screen as the evidence behind a typed number, redact it, and
   file it under the patient's study code.

   Redaction is DETERMINISTIC - fixed regions, not detection - so it cannot miss an
   identifier the way OCR can. Per the agreed design there is no confirmation step:
   the image is masked and filed automatically.
   Re-encoding through a canvas also strips every EXIF field, which is where camera
   GPS coordinates and the device serial would otherwise sit.                       */

function pickImage(onFile){
  const inp = document.createElement("input");
  inp.type = "file";
  inp.accept = "image/*";
  inp.setAttribute("capture", "environment");   // opens the camera on iOS / Android
  inp.style.display = "none";
  document.body.appendChild(inp);
  inp.onchange = () => {
    const f = inp.files && inp.files[0];
    inp.remove();
    if(f) onFile(f);
  };
  inp.click();
}

async function redactImage(file){
  const bmp = await createImageBitmap(file);
  const scale = Math.min(1, REDACTION.maxEdge / Math.max(bmp.width, bmp.height));
  const w = Math.max(1, Math.round(bmp.width * scale));
  const h = Math.max(1, Math.round(bmp.height * scale));
  const cv = document.createElement("canvas");
  cv.width = w; cv.height = h;
  const cx = cv.getContext("2d");
  cx.drawImage(bmp, 0, 0, w, h);

  cx.fillStyle = "#000";
  for(const r of REDACTION.regions){
    cx.fillRect(Math.round(r.x * w), Math.round(r.y * h),
                Math.round(r.w * w), Math.round(r.h * h));
  }
  // A visible marker, so nobody mistakes a redacted copy for the original.
  cx.fillStyle = "#fff";
  cx.font = Math.max(11, Math.round(h * 0.022)) + "px sans-serif";
  cx.fillText("IDENTIFIERS REDACTED — " + new Date().toISOString().slice(0,10),
              Math.round(w * 0.01), Math.round(h * 0.085));

  const dataUrl = cv.toDataURL("image/jpeg", REDACTION.quality);
  return { dataUrl, base64: dataUrl.split(",")[1], width:w, height:h };
}

async function captureSourceImage(p, fieldKey, fieldLabel){
  if(p.fileLocked) return toast("This case file is locked.", "bad");
  pickImage(async (file) => {
    try{
      const out = await redactImage(file);
      const bytes = Math.round(out.base64.length * 0.75);
      if(bytes > 4 * 1024 * 1024)
        return toast("That image is still too large after processing.", "bad");

      const stamp = new Date().toISOString().replace(/[:.]/g, "-");
      const filename = p.patientCode + "_" + fieldKey + "_" + stamp + ".jpg";
      /* Filed under the patient's STUDY CODE, never a name. The code is a
         pseudonym, which is the point of using it here. */
      const folder = locName(p.siteId) + "/Clinical_Procedures/" + p.patientCode + "/source_images";

      if(!p.images) p.images = [];
      p.images.push({ id:uid("img"), field:fieldKey, label:fieldLabel, filename, folder,
                      ts:nowISO(), by:S.me.email, w:out.width, h:out.height, bytes,
                      thumb:out.dataUrl });
      commit();

      queueBackupBinary(folder, filename, out.base64, "image/jpeg");
      logAction("Source image captured for " + fieldLabel + " (" + p.patientCode + ")", {
        locationId:p.siteId,
        stateChanges:"redacted, EXIF stripped, " + out.width + "x" + out.height,
        comments:"Filed as " + folder + "/" + filename
      });
      toast("Image redacted and filed under " + p.patientCode + ".", "good");
      render();
    }catch(e){
      console.error(e);
      toast("Could not process that image.", "bad");
    }
  });
}

/* Binary sibling of queueBackup: same queue-first durability, base64 on the wire. */
function queueBackupBinary(path, filename, base64, contentType){
  const rec = { id:uid("bkp"), path, filename, content:base64, encoding:"base64",
                contentType, ts:nowISO(), synced:false, syncNote:"Queued" };
  S.db.backupQueue.unshift(rec);
  commit();
  trySync(rec);
  return rec;
}

/* --------------------------------------------------------- FIFO suggestion */
/* Propose the unit with the earliest expiry matching product and size at that
   location. Returns null when nothing matches — the caller must then either
   stop or take a recorded override. */
function fifoPick(productType, size, locationId){
  const today = new Date().toISOString().slice(0,10);
  return S.db.devices
    .filter(d => d.productType === productType && d.size === size &&
                 d.locationId === locationId &&
                 (d.status === "IN_WH" || d.status === "IN_SITE") &&
                 d.expiration >= today)
    .sort((a,b) => a.expiration.localeCompare(b.expiration))[0] || null;
}

       try. Skipping the request also removes any chance of a static host's
       fallback page being mistaken for the real API. */
    S.backend = false;
  }else{
    try{
      const r = await fetch("/api/me", { credentials:"same-origin" });
      const j = await r.json();
      /* Only trust a response that actually looks like our API. A static host that
         answers every path with JSON must not be taken for a live backend. */
      if(!j || typeof j.authenticated !== "boolean") throw new Error("not our API");
      S.backend = true;
      S.cfg = j.config || null;
      S.demoAllowed = !!(j.config && j.config.demoLoginAllowed);
      if(j.authenticated) me = j.user;

  if(location.hash === "#delivery"){ return showDelivery(); }

  if(me){
    S.me = me;

  if(!S.backend){
    let saved = null;
    try{ saved = JSON.parse(localStorage.getItem(SESSION_KEY) || "null"); }catch(e){}
    if(saved && ROLES[saved.role]){ S.me = saved; return enterApp(); }
  }

/* Hour-only fields, and a procedure may run past midnight — so a negative
   difference means the clock wrapped, not that the data is wrong. */
function minsBetween(t1, t2){
  if(!t1 || !t2) return null;
  const p = s => { const [h,m] = s.split(":").map(Number); return h*60 + m; };
  let d = p(t2) - p(t1);
  if(d < 0) d += 1440;
  return d;
}
function fmtDur(m){
  if(m == null) return "—";
  return Math.floor(m/60) + "h " + String(m % 60).padStart(2,"0") + "m";
}

let AR = null;
/* Match a scanned code against a unit: the printed reference, or the UDI with all
   punctuation ignored, since scanners and labels disagree about parentheses. */
function findDeviceByCode(code){
  const c = String(code || "").trim().toLowerCase();
  if(!c) return null;
  const digits = c.replace(/\D/g, "");
  return S.db.devices.find(d => String(d.ref).toLowerCase() === c) ||
         S.db.devices.find(d => String(d.id).toLowerCase() === c) ||
         (digits.length >= 6
           ? S.db.devices.find(d => String(d.udi).replace(/\D/g, "").includes(digits))
           : null) || null;
}

function submitArrival(){
  const why = $("#ar-why");
  const d = device(AR.deviceId);
  const missing = ARRIVAL_CHECKS.filter(c => !AR.checks[c.k]);
  if(!d)             return why.textContent = "Scan the label of the unit being received.";
  if(!AR.siteId)     return why.textContent = "Choose the receiving location.";
  if(missing.length) return why.textContent = missing.length + " mandatory check(s) still outstanding.";
  if(AR.compromised && !AR.compromiseNote.trim())
                     return why.textContent = "Describe the problem before submitting.";
  const r = AR.receiver;
  if(!r.name.trim() || !r.title.trim() || !r.phone.trim())
                     return why.textContent = "Receiver name, title and phone are all required.";

  const target = loc(AR.siteId);
  const before = d.status;
  d.locationId = AR.siteId;
  d.condition  = AR.compromised ? "COMPROMISED" : "OK";
  d.status     = AR.compromised ? "REJECTED" : (target.type === "WAREHOUSE" ? "IN_WH" : "IN_SITE");

  logAction("Arrival & condition verification completed for " + d.ref, {
    locationId:AR.siteId,
    stateChanges: DEV_STATUS[before].label + " → " + DEV_STATUS[d.status].label,
    comments: (AR.compromised ? ("COMPROMISED: " + AR.compromiseNote) : "All four checks passed") +
              (AR.idHandEntered ? " | IDENTIFIER HAND-ENTERED, not scanned" : " | identifier scanned"),
    highPriority: AR.compromised || AR.idHandEntered
  });
  if(AR.compromised){
    notify("Compromised unit reported: " + d.ref + " (" + devName(d) + ") at " + target.name +
           " — " + AR.compromiseNote, ["ADMIN","WH_ADMIN"], [], AR.siteId);
  }
  queueBackup(target.name + "/Condition_Reports", "arrival_" + d.ref + "_" + Date.now() + ".json", {
    type:"ARRIVAL_CONDITION_REPORT", device:{ id:d.id, ref:d.ref, udi:d.udi, product:devName(d),
    expiration:d.expiration }, location:target.name, checks:AR.checks,
    compromised:AR.compromised, compromiseNote:AR.compromiseNote, receiver:r,
    identifierSource: AR.idHandEntered ? "HAND_ENTERED" : "SCANNED",
    scannedCode: AR.scannedCode || null,
    verifiedBy:S.me.email, verifiedAt:nowISO()
  });
  commit();
  toast(AR.compromised ? "Recorded as REJECTED and escalated." : "Verified — unit is now usable stock.",
        AR.compromised ? "bad" : "good");
  resetArrival(); renderNav(); render();
}

let PID = null;
function cf(p){ if(!p.caseFile) p.caseFile = {}; return p.caseFile; }
function ro(p){ return p.fileLocked ? " disabled" : ""; }

function tf(p, key, label, type, opts){
  opts = opts || {};
  const v = cf(p)[key] == null ? "" : cf(p)[key];
  return '<div class="field"><label class="' + (opts.req ? "req" : "") + '">' + esc(label) + '</label>' +
    (type === "textarea"
      ? '<textarea data-cf="' + key + '"' + ro(p) + '>' + esc(v) + '</textarea>'
      : '<input type="' + type + '" data-cf="' + key + '" value="' + esc(v) + '"' + ro(p) +
        (opts.step ? ' step="' + opts.step + '"' : "") + '>') +
    (opts.hint ? '<div class="hint">' + esc(opts.hint) + '</div>' : "") + '</div>';
}
function cbox(p, key, label, idx){
  const arr = cf(p)[key] || [];
  const on = !!arr[idx];
  return '<label class="check' + (on ? " on" : "") + '">' +
    '<input type="checkbox" data-cfa="' + key + '" data-i="' + idx + '"' +
    (on ? " checked" : "") + ro(p) + '><span>' + esc(label) + '</span></label>';
}

let SITEID = null;    // chosen first; nothing about a patient is shown until both are set

/** Source-image control for one measurement field, plus what has already been filed. */
function sourceImages(p, key, label){
  const mine = (p.images || []).filter(i => i.field === key);
  return '<div class="field">' +
    '<div class="row" style="gap:8px">' +
      (p.fileLocked ? '' :
        '<button type="button" class="btn btn-sm" data-img="' + key + '" ' +
        'data-imglabel="' + esc(label) + '">Add source image</button>') +
      '<span class="hint" style="margin:0">' +
        (mine.length ? mine.length + ' image(s) filed under ' + esc(p.patientCode)
                     : 'Photograph the machine screen as the source for this value.') +
      '</span>' +
    '</div>' +
    (mine.length ? '<div class="row" style="gap:8px;margin-top:8px">' +
      mine.map(i => '<a href="' + i.thumb + '" target="_blank" rel="noopener" ' +
        'title="' + esc(i.filename) + '" style="display:block">' +
        '<img src="' + i.thumb + '" alt="Redacted source image for ' + esc(label) + '" ' +
        'style="height:64px;border:1px solid var(--line);border-radius:5px"></a>').join("") +
      '</div><div class="hint">Identifiers are blacked out and EXIF stripped before filing.</div>' : "") +
  '</div>';
}

VIEWS.clinical = {
  title:"Clinical Procedure Workflow",
  sub:"Choose the site, then the patient. The case file opens once both are chosen.",
  body(){
    /* Step 1 - site. Step 2 - patient. Only then any patient data at all: showing a
       case file before the operator has said who they are working on is how the wrong
       patient's record gets edited. */
    const sites = visibleLocations().filter(l => l.type === "SITE");
    if(!sites.length) return '<div class="empty">No hospital sites are in your scope.</div>';
    if(SITEID && !sites.some(s => s.id === SITEID)) SITEID = null;
    const atSite = SITEID ? S.db.patients.filter(x => x.siteId === SITEID) : [];
    if(PID && !atSite.some(x => x.id === PID)) PID = null;

    let h = '<div class="card"><div class="card-hd"><h2>Who are you working on?</h2>' +
      (PID ? '<button class="btn btn-sm" id="pt-change">Change</button>' : '') +
      '</div><div class="card-bd"><div class="grid g2">' +
      '<div class="field" style="margin:0"><label class="req">1 · Site</label>' +
        '<select id="site-sel"><option value="">— choose a site —</option>' +
        sites.map(s => '<option value="' + s.id + '"' + (s.id === SITEID ? " selected" : "") + '>' +
          esc(s.name) + '</option>').join("") + '</select></div>' +
      '<div class="field" style="margin:0"><label class="req">2 · Patient</label>' +
        '<select id="pt-sel"' + (SITEID ? "" : " disabled") + '>' +
        '<option value="">' + (SITEID ? "— choose a patient —" : "choose a site first") + '</option>' +
        atSite.map(x => '<option value="' + x.id + '"' + (x.id === PID ? " selected" : "") + '>' +
          esc(x.patientCode) + ' · ' + esc(PT_STATUS[x.status].label) + '</option>').join("") +
        '</select>' + (SITEID && !atSite.length
          ? '<div class="hint">No patients registered at this site yet.</div>' : '') +
      '</div></div></div></div>';

    if(!SITEID) return h + '<div class="empty">Choose a site to continue.</div>';
    if(!PID)    return h + '<div class="empty">Choose a patient to open their case file.</div>';

    const p = patient(PID);
    const fifoU = fifoPick("UNICA", p.unicaSize, p.siteId);
    const fifoD = fifoPick("DS", p.dsSize, p.siteId);
    const c = cf(p);

    /* ---- the briefing: what is known about this patient, before any data entry ---- */
    const stockHere = S.db.devices.filter(d => d.locationId === p.siteId &&
      (d.status === "IN_SITE" || d.status === "IN_WH"));
    const openQs = (p.customQuestions || []).filter(q => !String(q.a || "").trim());
    const dueRem = (p.reminders || []).filter(r => !r.done);

    h += '<div class="card" style="border-left:3px solid var(--brand)">' +
      '<div class="card-hd"><h2>' + esc(p.patientCode) + ' — briefing</h2>' +
        pill(PT_STATUS, p.status) + '</div><div class="card-bd">' +
      '<div class="grid g4">' +
        '<div class="kv"><b>Site</b> ' + esc(locName(p.siteId)) + '</div>' +
        '<div class="kv"><b>Procedure date</b> ' + esc(fmtDate(p.procedureDate)) + '</div>' +
        '<div class="kv"><b>Assigned sizing</b> Unica ' + esc(p.unicaSize) + ' · DS ' + esc(p.dsSize) + '</div>' +
        '<div class="kv"><b>Case file</b> ' + (p.fileLocked ? "Locked" :
            p.submitted ? "Submitted, editable" : "In progress") + '</div>' +
      '</div>' +

      '<h3 style="margin:14px 0 7px">Devices available at this site</h3>' +
      (stockHere.length
        ? '<div class="tbl-wrap"><table><thead><tr><th>Ref</th><th>Product</th><th>Expires</th>' +
          '<th>Status</th><th></th></tr></thead><tbody>' +
          stockHere.map(d => {
            const match = (d.productType === "UNICA" && d.size === p.unicaSize) ||
                          (d.productType === "DS" && d.size === p.dsSize);
            const isFifo = (fifoU && d.id === fifoU.id) || (fifoD && d.id === fifoD.id);
            return '<tr><td class="mono">' + esc(d.ref) + '</td><td>' + esc(devName(d)) + '</td>' +

              '<td>' + (isFifo ? '<span class="pill p-green">FIFO choice</span>' :
                        match ? '<span class="pill p-blue">Correct size</span>' : '') + '</td></tr>';
          }).join("") + '</tbody></table></div>'
        : '<div class="warn">No usable stock at this site. A Clinical PM or App Admin must ' +
          'record an override, or stock must be shipped in first.</div>') +
      (fifoU || fifoD ? "" : '<div class="hint">No FIFO match for this patient’s assigned sizes.</div>') +

      '<h3 style="margin:14px 0 7px">Medical questions</h3>' +
      ((p.customQuestions || []).length
        ? (openQs.length ? '<div class="warn"><b>' + openQs.length + ' question(s) still unanswered.</b> ' +

          '<ul style="margin:0 0 4px;padding-left:18px">' +
          p.customQuestions.map(q => '<li>' + esc(q.q) +
            (String(q.a || "").trim() ? ' — <b>' + esc(q.a) + '</b>'

            '</li>').join("") + '</ul>'
        : '<div class="hint">None defined. A Clinical PM adds these in Add / Edit Patients.</div>') +

      '<h3 style="margin:14px 0 7px">To discuss with the PI</h3>' +
      (p.piNotes ? '<div class="note">' + esc(p.piNotes) + '</div>'
                 : '<div class="hint">Nothing recorded.</div>') +

      (dueRem.length ? '<h3 style="margin:14px 0 7px">Open reminders</h3>' +
        dueRem.map(r => '<div class="warn" style="margin-bottom:6px"><b>' + esc(fmtDate(r.date)) +
          '</b> — ' + esc(r.text) + '</div>').join("") : "") +

      (p.notes ? '<h3 style="margin:14px 0 7px">Notes</h3><div class="hint">' +
        esc(p.notes) + '</div>' : "") +
    '</div></div>';

    if(p.fileLocked) h += '<div class="locked-ov"><b>This case file is permanently locked.</b> ' +
      'Every field is read-only and the complete file has been archived to OneDrive.</div>';
    else if(p.submitted) h += '<div class="info"><b>Submitted, still editable.</b> ' +
      'It stays editable until a Clinical PM or App Admin performs the final permanent lock.</div>';

    h += '<div id="cform">';

    /* ---- Stage 1 ---- */
    h += '<div class="card stage"><div class="card-hd"><h2><span class="stage-n">1</span>' +
      'Eligibility &amp; patient matching</h2><span class="saved" id="sv1"></span></div><div class="card-bd">' +
      '<div class="grid g2">' +
        tf(p,"procDate","Date of procedure","date",{req:true}) +
        tf(p,"teamNames","Procedure team (names)","text") +
      '</div><div class="grid g4">' +
        tf(p,"proctor","Proctor","text") + tf(p,"tech1","Tech 1st","text") +
        tf(p,"tech2","Tech 2nd","text")  + tf(p,"clinical","Clinical","text") +
      '</div>' +
      '<h3 style="margin:14px 0 7px">Assigned sizing (read-only)</h3>' +
      '<div class="grid g2">' +
        '<div class="field"><label>Unica size</label><input type="text" value="' + esc(p.unicaSize) + '" disabled></div>' +
        '<div class="field"><label>Delivery System size</label><input type="text" value="' + esc(p.dsSize) +
          '" disabled><div class="hint">Derived from the Unica size; it cannot be set by hand.</div></div>' +
      '</div>' +
      '<h3 style="margin:14px 0 7px">FIFO device suggestion</h3>' +
      [["Unica " + p.unicaSize, fifoU],["Delivery System " + p.dsSize, fifoD]].map(([lbl,f]) =>
        f ? '<div class="okbox"><b>' + esc(lbl) + '</b> → <span class="mono">' + esc(f.ref) +
              '</span>, earliest expiry ' + esc(f.expiration) + ' at ' + esc(locName(f.locationId)) + '</div>'
          : '<div class="warn"><b>' + esc(lbl) + '</b> — no matching stock at this site. ' +
              'A Clinical PM or App Admin must record an override before proceeding.</div>').join("") +
    '</div></div>';

    /* ---- Stage 2 ---- */
    const tr = c.training || [];
    h += '<div class="card stage"><div class="card-hd"><h2><span class="stage-n">2</span>' +
      'Pre-procedure checklists</h2><span class="saved" id="sv2"></span></div><div class="card-bd">' +
      '<div class="grid g3">' + tf(p,"physician1","Physician 1","text") +
        tf(p,"physician2","Physician 2","text") + tf(p,"echoOperator","Echo operator","text") + '</div>' +
      '<div class="spread" style="margin:14px 0 7px"><h3>Training &amp; review checklist</h3>' +
        '<button class="btn btn-sm" id="mark-all"' + ro(p) + '>' +
        (tr.filter(Boolean).length === TRAINING_ITEMS.length ? "Clear everything" : "Mark everything") +
        '</button></div>' +
      TRAINING_ITEMS.map((t,i) => cbox(p,"training",t,i)).join("") +
      '<h3 style="margin:14px 0 7px">Custom clinical questions</h3>' +
      (p.customQuestions && p.customQuestions.length
        ? p.customQuestions.map((q,i) => '<div class="field"><label>' + esc(q.q) + '</label>' +
            '<input type="text" data-cq="' + i + '" value="' + esc(q.a || "") + '"' + ro(p) + '></div>').join("")
        : '<div class="hint">None defined for this patient.</div>') +
      '<h3 style="margin:14px 0 7px">Device verification (all five mandatory)</h3>' +
      DEVICE_CONFIRMS.map((t,i) => cbox(p,"confirms",t,i)).join("") +
    '</div></div>';

    /* ---- Stage 3 ---- */
    const dep = minsBetween(c.deployStart, c.deployEnd);
    const sts = minsBetween(c.dsIn, c.dsOut);
    h += '<div class="card stage"><div class="card-hd"><h2><span class="stage-n">3</span>' +
      'Real-time clinical event logger</h2><span class="saved" id="sv3"></span></div><div class="card-bd">' +
      '<div class="note">The procedure date is captured once, here. Every other time field is ' +
        'hour-only, so nothing is entered twice. Durations handle a procedure running past midnight.</div>' +
      '<div class="grid g2">' + tf(p,"s3Date","Procedure date (captured once)","date",{req:true}) + '</div>' +
      '<div class="grid g4">' +
        tf(p,"deployStart","Deployment initiation","time") + tf(p,"deployEnd","Deployment end","time") +
        tf(p,"dsIn","DS insertion","time") + tf(p,"dsOut","DS is out","time") +
      '</div>' +
      '<div class="grid g2" style="margin-bottom:12px">' +
        '<div class="calc"><small>Deployment Duration (computed)</small><b id="calc-dep">' + fmtDur(dep) + '</b></div>' +
        '<div class="calc"><small>Skin to Skin time (computed)</small><b id="calc-sts">' + fmtDur(sts) + '</b></div>' +
      '</div>' +
      '<div class="grid g4">' +
        tf(p,"ivcPre","IVC pressure pre (mmHg)","number") + tf(p,"ivcPost","IVC pressure post (mmHg)","number") +
        tf(p,"introducerTime","Introducer time","time") + tf(p,"actTime","ACT time","time") +
      '</div>' +
      '<div class="grid g2">' +
        sourceImages(p, "ivcPre",  "IVC pressure pre") +
        sourceImages(p, "ivcPost", "IVC pressure post") +
      '</div><div class="grid g3">' +
        tf(p,"contrast","Contrast volume (mL)","number") +
        '<div class="field"><label>Closing method</label><select data-cf="closingMethod"' + ro(p) + '>' +
          ["","Suture-mediated","Collagen plug","Manual compression","Surgical cutdown"].map(o =>
            '<option' + (c.closingMethod === o ? " selected" : "") + '>' + esc(o) + '</option>').join("") +
          '</select></div>' +
        tf(p,"closingTime","Closing time","time") +
      '</div>' +
      tf(p,"echoParams","Echo parameter collection","textarea",{hint:"Free text; structured capture is a later change."}) +
      sourceImages(p, "echoParams", "Echo parameters") +
    '</div></div>';

    /* ---- Stage 4 ---- */
    const asExp = c.asExpected || "";
    const branch = c.notExpectedBranch || "";
    const failReq = asExp === "NO" && branch === "ALTERNATIVE";
    h += '<div class="card stage"><div class="card-hd"><h2><span class="stage-n">4</span>' +
      'Post-procedure verification &amp; submission</h2><span class="saved" id="sv4"></span></div><div class="card-bd">' +
      '<div class="field"><label class="req">Confirm using the devices as expected</label>' +
        '<select data-cf="asExpected"' + ro(p) + '>' +
        '<option value=""' + (asExp === "" ? " selected" : "") + '>— choose —</option>' +
        '<option value="YES"' + (asExp === "YES" ? " selected" : "") + '>Yes</option>' +
        '<option value="NO"' + (asExp === "NO" ? " selected" : "") + '>No</option></select></div>' +
      (asExp === "NO" ? '<div class="field"><label class="req">What happened</label>' +
        '<select data-cf="notExpectedBranch"' + ro(p) + '>' +
        '<option value=""' + (branch === "" ? " selected" : "") + '>— choose —</option>' +
        '<option value="CANCELLED"' + (branch === "CANCELLED" ? " selected" : "") + '>Procedure cancelled</option>' +
        '<option value="ALTERNATIVE"' + (branch === "ALTERNATIVE" ? " selected" : "") + '>Alternative devices used</option>' +
        '</select></div>' : "") +
      (failReq ? '<div class="warn"><b>Alternative devices were used, so the Rejected/Failure Device Log ' +
        'is mandatory.</b> Submission is blocked until it is complete.</div>' :
        '<div class="hint" style="margin-bottom:10px">Rejected/Failure Device Log is optional here.</div>') +
      /* Both identifiers are scanned, so the failed unit and the one actually used are
         tied to real inventory instead of being typed as free text. */
      '<div class="grid g2">' +
        scanField("fail-scan", "Rejected / failed device — scan its label", c.failRef,
                  { req:failReq, disabled:p.fileLocked }) +
        scanField("repl-scan", "Replacement actually used — scan its QR code", c.replRef,
                  { req:failReq, disabled:p.fileLocked }) +
      '</div>' +
      (c.failRef || c.replRef ? '<div class="info">' +
        (c.failRef ? '<div>Failed: <span class="mono">' + esc(c.failRef) + '</span>' +
          (c.failManual ? ' <span class="pill p-orange">hand-entered</span>' : '') + '</div>' : '') +
        (c.replRef ? '<div>Used instead: <span class="mono">' + esc(c.replRef) + '</span>' +
          (c.replManual ? ' <span class="pill p-orange">hand-entered</span>' : '') + '</div>' : '') +
        '</div>' : "") +
      '<div class="grid g2">' +
        tf(p,"failReason","Reason","text",{req:failReq}) +
        tf(p,"failDetail","Failure detail","textarea",{req:failReq}) +
      '</div>' +
      tf(p,"postNotes","Post-procedure notes","textarea") +
    '</div><div class="card-ft">' +
      (p.fileLocked ? '<div class="row"><span class="pill p-green">Permanently locked</span></div>' :
      '<div class="row">' +
        /* Saving is ALWAYS possible, whatever is still blank. Submission is a separate
           action and it is the one that enforces the mandatory fields. */
        '<button class="btn" id="pt-save">Save and close</button>' +
        '<button class="btn btn-primary" id="pt-submit">' +
          (p.submitted ? "Re-submit case file" : "Submit case file") + '</button>' +
        (p.submitted && can("lockCaseFile")
          ? '<button class="btn btn-dark" id="pt-lock">Final permanent lock</button>' : "") +
        (p.submitted && !can("lockCaseFile")
          ? '<span class="hint">Only a Clinical PM or App Admin can perform the final lock.</span>' : "") +
        '<span class="spacer"></span><span class="hint" id="pt-why"></span>' +
      '</div>' +
      '<div class="hint" style="margin-top:8px">Fields save as you type. ' +
        '<b>Save and close</b> always works, even with mandatory fields empty — only ' +
        'submission requires them.</div>' +
      outstandingList(p)) +
    '</div></div></div>';
    return h;
  },
  wire(){
    const ss = $("#site-sel");
    if(ss) ss.onchange = e => { SITEID = e.target.value || null; PID = null; render(); };
    const sel = $("#pt-sel");
    if(sel) sel.onchange = e => { PID = e.target.value || null; render(); };
    const ch = $("#pt-change");
    if(ch) ch.onclick = () => { PID = null; render(); };

    const p = PID ? patient(PID) : null;
    if(!p) return;

    /* Source-image capture buttons (stage 3). */
    $$("[data-img]").forEach(b => b.onclick = () =>
      captureSourceImage(p, b.dataset.img, b.dataset.imglabel));

    /* The two scanned device identifiers in stage 4. */
    SCANFIELDS["fail-scan"] = { label:"failed device label", onCode:(code, manual) => {
      const d = findDeviceByCode(code);
      cf(p).failRef = d ? d.ref : code;
      cf(p).failManual = !!manual;
      if(d && !["USED","REJECTED"].includes(d.status)){
        d.status = "REJECTED"; d.condition = "COMPROMISED";
        logAction("Device " + d.ref + " marked rejected after failing during " + p.patientCode, {
          locationId:p.siteId, stateChanges:"→ Rejected", highPriority:true,
          comments: manual ? "identifier HAND-ENTERED" : "identifier scanned" });
      }
      commit(); toast(d ? "Failed device recorded: " + d.ref : "Recorded as typed.", d ? "good" : "bad");
      render();
    }};
    SCANFIELDS["repl-scan"] = { label:"replacement device QR code", onCode:(code, manual) => {
      const d = findDeviceByCode(code);
      cf(p).replRef = d ? d.ref : code;
      cf(p).replManual = !!manual;
      if(d){
        const sizeOk = (d.productType === "UNICA" && d.size === p.unicaSize) ||
                       (d.productType === "DS" && d.size === p.dsSize);
        if(!sizeOk) toast("Careful: " + devName(d) + " does not match this patient's assigned sizing.", "bad");
        d.status = "USED"; d.locationId = p.siteId;
        logAction("Replacement device " + d.ref + " used for " + p.patientCode, {
          locationId:p.siteId, stateChanges:"→ Used", highPriority:true,
          comments:(manual ? "identifier HAND-ENTERED" : "identifier scanned") +
                   (sizeOk ? "" : " | SIZE MISMATCH against assigned " + p.unicaSize) });
      }
      commit(); render();
    }};

    const form = $("#cform");
    if(!form) return;

    function flash(){
      $$(".saved").forEach(s => { s.textContent = "Saved"; });
      clearTimeout(flash._t);
      flash._t = setTimeout(() => $$(".saved").forEach(s => s.textContent = ""), 1200);
    }
    function recalc(){
      const c = cf(p);
      const de = $("#calc-dep"), ss = $("#calc-sts");
      if(de) de.textContent = fmtDur(minsBetween(c.deployStart, c.deployEnd));
      if(ss) ss.textContent = fmtDur(minsBetween(c.dsIn, c.dsOut));
    }
    /* One delegated handler is the whole autosave mechanism. */
    form.addEventListener("input", onEdit);
    form.addEventListener("change", onEdit);
    function onEdit(e){
      const t = e.target;
      if(p.fileLocked) return;
      let structural = false;
      if(t.dataset.cf){
        cf(p)[t.dataset.cf] = t.type === "checkbox" ? t.checked : t.value;
        if(t.dataset.cf === "procDate"){
          p.procedureDate = t.value;
          if(t.value && p.status === "ELIGIBLE"){
            p.status = "SCHEDULED";
            logAction("Patient " + p.patientCode + " scheduled", { locationId:p.siteId,
              stateChanges:"Eligible for Treatment → Scheduled" });
            structural = true;
          }
        }
        if(t.dataset.cf === "asExpected" || t.dataset.cf === "notExpectedBranch") structural = true;
      }else if(t.dataset.cfa){
        const k = t.dataset.cfa, i = +t.dataset.i;
        const a = cf(p)[k] || (cf(p)[k] = []);
        a[i] = t.checked;
        t.closest(".check").classList.toggle("on", t.checked);
      }else if(t.dataset.cq){
        p.customQuestions[+t.dataset.cq].a = t.value;
      }else return;
      commit(); flash(); recalc();
      if(structural) render();
    }
    const ma = $("#mark-all");
    if(ma) ma.onclick = () => {
      const cur = cf(p).training || [];
      const all = cur.filter(Boolean).length === TRAINING_ITEMS.length;
      cf(p).training = TRAINING_ITEMS.map(() => !all);
      commit(); render();
    };
    const sv = $("#pt-save");   if(sv) sv.onclick = () => saveDraft(p);
    const sb = $("#pt-submit"); if(sb) sb.onclick = () => submitCase(p);
    const lk = $("#pt-lock");   if(lk) lk.onclick = () => lockCase(p);
  }
};

/* What submission would still refuse. Shown all the time, so an incomplete file is
   never a surprise at the end - but it never blocks saving. */
function missingForSubmit(p){
  const c = cf(p), out = [];
  if(!c.procDate) out.push("Stage 1 — date of procedure");
  const conf = (c.confirms || []).filter(Boolean).length;
  if(conf < DEVICE_CONFIRMS.length)
    out.push("Stage 2 — device verification (" + conf + " of " + DEVICE_CONFIRMS.length + ")");
  if(!c.asExpected) out.push("Stage 4 — were the devices used as expected");
  else if(c.asExpected === "NO" && !c.notExpectedBranch)
    out.push("Stage 4 — cancelled, or alternative devices used");
  else if(c.asExpected === "NO" && c.notExpectedBranch === "ALTERNATIVE"){
    if(!c.failRef)    out.push("Stage 4 — scan the failed device");
    if(!c.replRef)    out.push("Stage 4 — scan the replacement device");
    if(!c.failReason) out.push("Stage 4 — failure reason");
    if(!c.failDetail) out.push("Stage 4 — failure detail");
  }
  return out;
}
function outstandingList(p){
  const m = missingForSubmit(p);
  if(!m.length) return '<div class="okbox" style="margin:10px 0 0">' +
    'Nothing outstanding — this file can be submitted.</div>';
  return '<div class="warn" style="margin:10px 0 0"><b>' + m.length +
    ' item(s) outstanding for submission.</b> You can still save and come back.' +
    '<ul style="margin:6px 0 0;padding-left:18px">' +

/* An explicit user save. Always succeeds, however much is still blank. */
function saveDraft(p){
  commit();
  const m = missingForSubmit(p);
  logAction("Case file saved as a draft for " + p.patientCode, { locationId:p.siteId,
    stateChanges: m.length ? m.length + " item(s) still outstanding" : "complete, not yet submitted" });
  toast(m.length ? "Saved. " + m.length + " item(s) still outstanding." : "Saved.", "good");
  PID = null;                      // "and close" - back to the site/patient chooser
  render();
}

function submitCase(p){
  const c = cf(p), why = $("#pt-why");
  const m = missingForSubmit(p);
  if(m.length){
    why.textContent = "Cannot submit yet: " + m[0] +
      (m.length > 1 ? " (and " + (m.length - 1) + " more)" : "") + ". Saving still works.";
    return;
  }

  p.submitted = true;
  if(c.asExpected === "NO" && c.notExpectedBranch === "CANCELLED" && p.status !== "CANCELLED"){
    p.status = "CANCELLED";
    logAction("Procedure cancelled for " + p.patientCode, { locationId:p.siteId,
      stateChanges:"→ Cancelled", highPriority:true });
  }
  logAction("Case file submitted for " + p.patientCode, { locationId:p.siteId,
    stateChanges:"submitted = true", comments:"Editable until the final permanent lock" });
  commit(); toast("Case file submitted. Still editable until locked.", "good"); render();
}
function lockCase(p){
  if(!can("lockCaseFile")) return toast("Only a Clinical PM or App Admin can lock a case file.", "bad");
  modal("Final permanent lock",
    '<p>Locking <b>' + esc(p.patientCode) + '</b> makes every field read-only for good and ' +
    'archives the complete case file to OneDrive.</p><p>This cannot be undone.</p>',
    '<div class="row"><button class="btn" data-close="1">Cancel</button>' +
    '<button class="btn btn-dark" id="lk-go">Lock permanently</button></div>');
  $("#lk-go").onclick = () => {
    p.fileLocked = true;
    if(p.status !== "CANCELLED") p.status = "TREATED";
    queueBackup(locName(p.siteId) + "/Clinical_Procedures",
      "case_" + p.patientCode + "_locked.json",
      { type:"CLINICAL_CASE_FILE", patientCode:p.patientCode, site:locName(p.siteId),
        unicaSize:p.unicaSize, dsSize:p.dsSize, status:p.status,
        caseFile:p.caseFile, customQuestions:p.customQuestions,
        lockedBy:S.me.email, lockedAt:nowISO() });
    logAction("Case file permanently locked for " + p.patientCode, { locationId:p.siteId,
      stateChanges:"fileLocked = true; status → " + PT_STATUS[p.status].label,
      comments:"Archived to Clinical_Procedures" });
    commit(); closeModal(); toast("Locked and archived.", "good"); render();
  };
}

function inTransitTable(){
  const t = S.db.devices.filter(d => d.status === "ON_WAY" || d.status === "DELIVERED");
  if(!t.length) return '<div class="empty">Nothing in transit.</div>';
  return '<div class="tbl-wrap" style="border:0;border-radius:0"><table><thead><tr>' +
    '<th>Ref</th><th>Product</th><th>From</th><th>To</th><th>Shipped by</th><th>Status</th></tr></thead><tbody>' +
    t.map(d => '<tr><td class="mono">' + esc(d.ref) + '</td><td>' + esc(devName(d)) + '</td>' +
      '<td>' + esc(d.shippedFromId ? locName(d.shippedFromId) : "—") + '</td>' +
      '<td>' + esc(locName(d.locationId)) + '</td><td>' + esc(d.shippedBy || "—") + '</td>' +
      '<td>' + pill(DEV_STATUS, d.status) + '</td></tr>').join("") +
    '</tbody></table></div>';
}
function doShip(){
  const why = $("#sh-why");
  const pick = SH.originId ? fifoPick(SH.productType, SH.size, SH.originId) : null;
  const d = SH.deviceId ? device(SH.deviceId) : pick;
  if(!SH.originId) return why.textContent = "Choose an origin.";
  if(!SH.destId)   return why.textContent = "Choose a destination.";
  if(!SH.shipper.trim()) return why.textContent = "Record who is shipping it.";
  const bypassing = !d || (pick && d.id !== pick.id);
  if(bypassing){
    if(!can("overrideFifo"))
      return why.textContent = "No FIFO match — only a Clinical PM or App Admin can override.";
    if(!SH.override) return why.textContent = "This bypasses FIFO. Tick the override box.";
    if(!SH.pin.trim() || !SH.reason.trim())
      return why.textContent = "An override needs both a PIN and a reason.";
  }
  if(!d) return why.textContent = "No unit available to ship.";

  const from = SH.originId, to = SH.destId, before = d.status;
  d.status = "ON_WAY"; d.locationId = to;
  d.shippedBy = SH.shipper.trim(); d.shippedFromId = from; d.shippedAt = nowISO();

  logAction("Shipped " + d.ref + " (" + devName(d) + ") to " + locName(to), {
    locationId: from,
    stateChanges: DEV_STATUS[before].label + " → On its way",
    comments: bypassing ? ("FIFO OVERRIDE by " + S.me.email + " — " + SH.reason) : "FIFO proposal accepted",
    highPriority: bypassing
  });
  notify("Shipment inbound: " + devName(d) + " (" + d.ref + ") from " + locName(from) +
         ", shipped by " + d.shippedBy + ".", ["ADMIN","CPM","EMPLOYEE"], [], to);
  queueBackup(locName(from) + "/Inventory_Logs", "shipment_" + d.ref + "_" + Date.now() + ".json", {
    type:"SHIPMENT_RECORD", device:{ id:d.id, ref:d.ref, udi:d.udi, product:devName(d), expiration:d.expiration },
    from:locName(from), to:locName(to), shippedBy:d.shippedBy, shippedAt:d.shippedAt,
    fifoOverride:bypassing, overrideReason: bypassing ? SH.reason : null, actor:S.me.email
  });
  commit();
  toast(bypassing ? "Shipped with a recorded FIFO override." : "Shipped.", bypassing ? "bad" : "good");
  resetShip(); renderNav(); render();
}

    const why = $("#dl-why");

                                     x.udi.replace(/\D/g,"").includes(ref.replace(/\D/g,"")));
    if(d){
      d.locationId = siteId;
      /* Deliberately NOT usable stock: this person performs none of the sterile
         barrier, expiry or ID-match checks. */
      d.status = "DELIVERED";
      const shipper = S.db.users.find(u => u.name === d.shippedBy);
      const cpm = site.cpmUserId ? user(site.cpmUserId) : null;
      S.db.notifications.unshift({ id:uid("ntf"), ts:nowISO(),

             "). Formal Arrival & Condition Verification is still required.",
        forRoles:["ADMIN","CPM"], locationId:siteId, read:false,
        forUserIds:[shipper && shipper.id, cpm && cpm.id].filter(Boolean) });
      S.db.logs.unshift({ id:uid("log"), timestamp:nowISO(),
        action:"Delivery reported by a non-employee for " + d.ref, locationId:siteId,
        userName:name + " (no account)", role:"DELIVERY_RECIPIENT",
        stateChanges:"→ Delivered (unverified)", comments:"Phone " + phone, highPriority:false });
      S.db.backupQueue.unshift({ id:uid("bkp"), path:site.name + "/Condition_Reports",
        filename:"delivery_report_" + d.ref + "_" + Date.now() + ".json",
        content:JSON.stringify({ type:"CASUAL_DELIVERY_REPORT", ref:d.ref, site:site.name,
          reportedBy:name, phone, at:nowISO() }),
        ts:nowISO(), synced:false, syncNote:"Queued" });
      saveDB(S.db);
    }
    /* The recipient sees exactly one instruction and nothing else. */
    b.innerHTML =
      '<div class="login-h"><h1>Thank you</h1></div>' +
      '<div class="note" style="font-size:14px"><b>This is an Innoventric product.</b> ' +
        'Please keep it at room temperature and notify the cath lab team that it has arrived.</div>' +
      '<div class="card" style="margin:0"><div class="card-bd">' +
        '<div class="kv"><b>Site</b> ' + esc(site.name) + '</div>' +
        '<div class="kv"><b>Address</b> ' + esc(site.address) + '</div>' +
        '<div class="kv"><b>Contact</b> ' + esc(site.contact) + '</div>' +
        '<div class="kv"><b>Phone</b> ' + esc(site.phone) + '</div>' +
        '<div class="kv"><b>Email</b> ' + esc(site.email) + '</div>' +
      '</div></div>' +
      (d ? "" : '<div class="hint" style="margin-top:10px">The product ID was not recognised, ' +
        'so the team has been notified to check it manually.</div>');
  };
}

let FL = { locType:"", product:"", status:"", q:"" };

function stockCols(){
  return visibleLocations().filter(l =>
    (!FL.locType || l.type === FL.locType) &&
    (!FL.q || l.name.toLowerCase().includes(FL.q.toLowerCase())));
}
function stockCount(productType, size, locationId){
  return S.db.devices.filter(d =>
    d.productType === productType && d.size === size && d.locationId === locationId &&
    (FL.status ? d.status === FL.status : DEV_STATUS[d.status].stock)).length;
}
VIEWS.stock = {
  title(){ return S.me.role === "WH_ADMIN" ? "My Warehouse Dashboard" : "Global Stock Dashboard"; },
  sub:"Product × location. Header row and first column stay fixed while scrolling.",
  body(){

      '<div class="field" style="margin:0"><label>Location type</label><select id="f-lt">' +
        [["","All"],["WAREHOUSE","Warehouses"],["SITE","Hospital sites"]].map(([v,l]) =>
          '<option value="' + v + '"' + (FL.locType === v ? " selected" : "") + '>' + l + '</option>').join("") +
        '</select></div>' +
      '<div class="field" style="margin:0"><label>Product</label><select id="f-p">' +
        '<option value=""' + (FL.product === "" ? " selected" : "") + '>All products</option>' +
        PRODUCTS.map(p => '<option value="' + p.key + '"' + (FL.product === p.key ? " selected" : "") + '>' +
          esc(p.label) + '</option>').join("") + '</select></div>' +
      '<div class="field" style="margin:0"><label>Device status</label><select id="f-s">' +
        '<option value=""' + (FL.status === "" ? " selected" : "") + '>Live stock only</option>' +

    h += '<div class="tbl-wrap" style="max-height:62vh"><table class="matrix"><thead><tr>' +
      '<th>Product / size</th>' + cols.map(c => '<th class="num">' + esc(c.name) + '</th>').join("") +
      '<th class="num">All locations</th></tr></thead><tbody>';

    const colTot = cols.map(() => 0); let grand = 0;
    for(const p of prods){
      let sub = cols.map(() => 0), subAll = 0;
      for(const size of p.sizes){
        const cells = cols.map(c => stockCount(p.key, size, c.id));
        const rowTot = cells.reduce((a,b) => a+b, 0);
        cells.forEach((v,i) => { sub[i] += v; colTot[i] += v; });

        h += '<tr><td>' + esc(p.label + " " + size) + '</td>' +

          '<td class="num"><b>' + rowTot + '</b></td></tr>';

      h += '<tr class="sub-row"><td>' + esc(p.label) + ' subtotal</td>' +

                                 i.focus(); i.setSelectionRange(i.value.length, i.value.length); };

};
function exportCSV(){
  const cols = stockCols();
  const prods = PRODUCTS.filter(p => !FL.product || p.key === FL.product);
  const rows = [["Product / size"].concat(cols.map(c => c.name)).concat(["All locations"])];
  for(const p of prods) for(const size of p.sizes){
    const cells = cols.map(c => stockCount(p.key, size, c.id));
    rows.push([p.label + " " + size].concat(cells).concat([cells.reduce((a,b) => a+b, 0)]));
  }
  const csv = rows.map(r => r.map(v => '"' + String(v).replace(/"/g,'""') + '"').join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type:"text/csv" }));
  a.download = "pivotal_stock_" + new Date().toISOString().slice(0,10) + ".csv";
  a.click(); URL.revokeObjectURL(a.href);
  toast("CSV exported.", "good");
}

/* Working copies, so Cancel really cancels rather than half-applying. */
let PFQ = [], PFR = [];

function patientForm(p){
  const isNew = !p;
  p = p || { id:uid("pat"), patientCode:"", siteId:visibleLocations().filter(l => l.type === "SITE")[0]?.id || "",
             procedureDate:"", unicaSize:"M", dsSize:"Short", status:"ELIGIBLE",
             submitted:false, fileLocked:false, notes:"", piNotes:"",
             customQuestions:[], reminders:[], images:[], caseFile:{} };
  PFQ = (p.customQuestions || []).map(q => ({ q:q.q, a:q.a || "" }));
  PFR = (p.reminders || []).map(r => ({ date:r.date, text:r.text, done:!!r.done }));
  patientFormRender(p, isNew);
}

function questionsBlock(){
  return '<h3 style="margin:4px 0 7px">Medical questions for this patient</h3>' +
    '<div class="hint" style="margin-bottom:8px">Free-form and specific to this patient. ' +
    'They appear in stage 2 of the case file and in the briefing panel.</div>' +
    (PFQ.length
      ? PFQ.map((q,i) => '<div class="row" style="gap:6px;margin-bottom:6px;flex-wrap:nowrap">' +
          '<input type="text" data-q="' + i + '" value="' + esc(q.q) + '" placeholder="question">' +
          '<button type="button" class="btn btn-sm btn-danger" data-qdel="' + i + '" ' +
          'style="flex:none">Remove</button></div>').join("")
      : '<div class="hint">None yet.</div>') +
    '<button type="button" class="btn btn-sm" id="q-add" style="margin-top:6px">Add a question</button>';
}
function remindersBlock(){
  return '<h3 style="margin:16px 0 7px">Reminders</h3>' +
    (PFR.length
      ? PFR.map((r,i) => '<div class="row" style="gap:6px;margin-bottom:6px;flex-wrap:nowrap">' +
          '<input type="date" data-rd="' + i + '" value="' + esc(r.date || "") + '" style="max-width:150px">' +
          '<input type="text" data-rt="' + i + '" value="' + esc(r.text) + '" placeholder="what to remember">' +

      : '<div class="hint">None yet.</div>') +
