/* PART C — TODAY: the landing screen                                        */
/* ========================================================================= */
/* The app used to open on whichever screen happened to be first in the nav, which
   for most roles was an empty inspection form. A person arriving at work does not
   want a blank form, they want to know what is waiting for them. Everything here
   is derived from data the app already holds — nothing new is stored — and every
   row is a link into the screen that clears it, with the context already set.   */

function daysUntil(d){
  if(!d) return null;
  const t = new Date(); t.setHours(0,0,0,0);
  /* Take only the date part, so a datetime-local value (with a time) still parses. */
  const x = new Date(String(d).slice(0,10) + "T00:00:00");
  return isNaN(x) ? null : Math.round((x - t) / 86400000);
}
function whenWord(n){
  if(n === 0) return "today";
  if(n === 1) return "tomorrow";
  if(n < 0)   return Math.abs(n) + " day(s) ago";
  return "in " + n + " day(s)";
}

/** The single source of truth for both this screen and the nav badge. */
function todoItems(){
  if(!S.me || !S.db) return [];
  const out = [];
  const mine = visibleDevices();
  const myPatients = S.db.patients.filter(p => inScope(p.siteId));
  const clinical = ["ADMIN","CPM","EMPLOYEE"].includes(S.me.role);

  /* 1 — physically arrived, nobody has checked it in. Blocks it becoming stock. */
  const unver = mine.filter(d => d.status === "DELIVERED");
  if(unver.length) out.push({ ic:"receive", tone:"t-red", view:"arrival",
    title: unver.length + " unit(s) waiting to be checked in",
    sub: "Arrived but unverified, so they are not usable stock yet. " +
         unver.slice(0,3).map(d => d.ref).join(", ") + (unver.length > 3 ? "…" : "") });

  /* 2 — procedures inside the next week, soonest first. */
  if(clinical){
    const soon = myPatients
      .filter(p => p.status === "SCHEDULED" && p.procedureDate)
      .map(p => ({ p, d: daysUntil(p.procedureDate) }))
      .filter(x => x.d !== null && x.d >= -1 && x.d <= 7)
      .sort((a,b) => a.d - b.d);
    for(const { p, d } of soon){
      const miss = missingForSubmit(p).length;
      out.push({ ic:"case", tone: d <= 0 ? "t-red" : d <= 2 ? "t-amber" : "t-blue",
        view:"clinical", patientId:p.id,
        title: p.patientCode + " — procedure " + whenWord(d),
        sub: locName(p.siteId) + " · Unica " + p.unicaSize + " / DS " + p.dsSize +
             (miss ? " · " + miss + " item(s) outstanding in the case file"
                   : " · case file complete, ready to submit") });
    }
  }

  /* 3 — no stock of the size a scheduled patient needs, at the site that needs it. */
  if(clinical){
    const gaps = [];
    for(const p of myPatients){
      if(p.status !== "SCHEDULED") continue;
      const d = daysUntil(p.procedureDate);
      if(d === null || d < 0 || d > 14) continue;
      if(!fifoPick("UNICA", p.unicaSize, p.siteId)) gaps.push(p.patientCode + ": Unica " + p.unicaSize);
      if(!fifoPick("DS", p.dsSize, p.siteId))       gaps.push(p.patientCode + ": DS " + p.dsSize);
    }
    if(gaps.length) out.push({ ic:"ship", tone:"t-red", view:"shipment",
      title: "No stock at the site for " + gaps.length + " assigned size(s)",
      sub: gaps.slice(0,3).join(" · ") + (gaps.length > 3 ? " …" : "") +
           ". Ship a unit in, or a Clinical PM records an override." });
  }

  /* 4 — reminders that have come due. */
  if(clinical){
    const due = [];
    for(const p of myPatients)
      for(const r of (p.reminders || []))
        if(!r.done && r.date && daysUntil(r.date) <= 0) due.push({ p, r });
    for(const { p, r } of due.slice(0,4))
      out.push({ ic:"alert", tone:"t-amber", view:"clinical", patientId:p.id,
        title: "Reminder — " + p.patientCode, sub: r.text + " · due " + fmtDate(r.date) });
  }

  /* 5 — submitted files still waiting on the person who is allowed to lock them. */
  if(can("lockCaseFile")){
    const wait = myPatients.filter(p => p.submitted && !p.fileLocked);
    if(wait.length) out.push({ ic:"case", tone:"t-blue", view:"clinical",
      patientId: wait[0].id,
      title: wait.length + " case file(s) submitted, awaiting final lock",
      sub: wait.map(p => p.patientCode).join(", ") + " — locking archives them to OneDrive." });
  }

  /* 6 — expired stock still sitting on a shelf. */
  const exp = mine.filter(d => d.status === "EXPIRED");
  if(exp.length) out.push({ ic:"stock", tone:"t-amber", view:"stock",
    title: exp.length + " expired unit(s) to remove from the shelf",
    sub: "Already out of live stock in the system. " +
         exp.slice(0,3).map(d => d.ref).join(", ") + (exp.length > 3 ? "…" : "") });

  /* 7 — unread alerts. */
  const unread = myAlerts().filter(a => !a.read);
  if(unread.length) out.push({ ic:"alert", tone:"t-blue", view:"alerts",
    title: unread.length + " unread alert(s)", sub: unread[0].text });

  /* 8 — open product-order requests. Warehouse managers and admins see incoming demand
     to fulfil; the clinical side sees what it has raised and is still waiting on. */
  const openOrders = myPatients.filter(x =>
    x.anat && x.anat.order && x.anat.order.requestedBy && x.anat.order.status !== "Completed");
  if(openOrders.length){
    const wh = ["WH_ADMIN","ADMIN"].includes(S.me.role);
    out.push({ ic:"ship", tone:"t-amber",
      view: wh ? "shipment" : "clinical",
      patientId: wh ? undefined : openOrders[0].id,
      title: openOrders.length + " open product order request(s)",
      sub: openOrders.slice(0,3).map(x => x.patientCode + " · Unica " + x.unicaSize +
           (x.anat.order.shippingDest ? " → " + x.anat.order.shippingDest : "")).join(" · ") +
           (openOrders.length > 3 ? " …" : "") });
  }

  /* 9 — anything still queued for upload. */
  const pend = S.db.backupQueue.filter(r => !r.synced);
  if(pend.length) out.push({ ic:"cloud", tone:"t-amber", view:"backup",
    title: pend.length + " record(s) not yet uploaded",
    sub: "Held locally, so nothing is lost. They go up when the server is reachable." });

  return out;
}

/* ============================ HOME DASHBOARD ============================
   The landing page after sign-in: role-aware module cards, three live dashboard
   widgets, and the "needs your attention" list folded in from the old Today screen.

   Every widget reads through the accessors below rather than poking S.db directly,
   so when patient/device data moves to the SharePoint/OneDrive backend only these
   functions change - the widgets do not. Role gating here is presentation only;
   real authorization must be enforced by that backend when it exists. */
const HOME_MODULES = [
  { key:"stock",     ic:"stock",  title:"Warehouse",              desc:"Device inventory across warehouses and sites." },
  { key:"patients",  ic:"people", title:"Patients Registration",  desc:"Register patients and set up the table." },
  { key:"screening", ic:"case",   title:"Patient Screening",      desc:"Screening, evaluation, scheduling and orders." },
  { key:"shipment",  ic:"ship",   title:"Send / Receive Devices", desc:"Ship a unit out, or check a delivery in." }
];
function canAccessView(key){ return NAV.some(i => i.k === key && i.roles.includes(S.me.role)); }

/* ---- data-access seam: swap these for the backend later, not the widgets ---- */
function homePatients(){ return S.db.patients.filter(p => inScope(p.siteId)); }
function homeDevices(){ return visibleDevices(); }
function patImplant(p){ return p.unicaSize || currentRecommendation(p).size || ""; }
function patPhysician(p){ return (p.anat && p.anat.scheduling && p.anat.scheduling.physician) || ""; }
function screenLevel(p){
  const done = SCREENING_STEPS.filter(s => p.screening[s.k].done).length;
  return done === 0 ? "Not started" : done === SCREENING_STEPS.length ? "Complete" : "In progress";
}
function orderRequests(){
  return homePatients()
    .filter(p => p.anat && p.anat.order && p.anat.order.requestedBy)
    .map(p => {
      const o = p.anat.order, rec = currentRecommendation(p);
      const ds = rec.size && window.DeviceQr ? window.DeviceQr.requiredDsSize(rec.size) : "";
      return { id:p.patientCode, patientId:p.id, siteId:p.siteId,
               date:o.requestedAt || "", delivery:o.requestedDate || "",
               devices:"Unica " + (rec.size || "?") + " / DS " + (ds || "?"),
               dest:o.shippingDest || "", status:o.approvedBy ? "Approved" : (o.status || "Requested") };
    });
}

/* Filter state for the three widgets. Kept on one object so a re-render preserves it. */
let HOME = {
  pStatus:null,
  pf:{ site:"", phys:"", size:"", from:"", to:"", screen:"", proc:"" },
  df:{ site:"", size:"" },
  sf:{ site:"", date:"", status:"" }
};

function selField(id, label, value, options){
  return '<div class="field"><label for="' + id + '">' + esc(label) + '</label>' +
    '<select id="' + id + '">' + options.map(o => {
      const v = Array.isArray(o) ? o[0] : o, t = Array.isArray(o) ? o[1] : o;
      return '<option value="' + esc(v) + '"' + (String(value) === String(v) ? " selected" : "") +
        '>' + esc(t) + '</option>';
    }).join("") + '</select></div>';
}
function dateField(id, label, value){
  return '<div class="field"><label for="' + id + '">' + esc(label) + '</label>' +
    '<input type="date" id="' + id + '" value="' + esc(value || "") + '"></div>';
}

function homeNavCards(){
  return '<div class="nav-cards">' + HOME_MODULES.map(m => {
    const ok = canAccessView(m.key), tag = ok ? "button" : "div";
    return '<' + tag + ' class="nav-card' + (ok ? '' : ' is-disabled') + '"' +
      (ok ? ' data-nav="' + m.key + '"'
          : ' aria-disabled="true" title="You do not have permission to access this module."') + '>' +
      '<span class="nav-card-ic">' + icon(m.ic) + '</span>' +
      '<span class="nav-card-t">' + esc(m.title) + '</span>' +
      '<span class="nav-card-d">' + esc(m.desc) + '</span>' +
      (ok ? '' : '<span class="nav-card-lock">No access</span>') +

}

/* Shared cells for a patient table row (Code..Case file), so the Patient Register and
   the Home patient-status table render identical columns from one definition. */
function patientRowCells(p){
  const q = (p.customQuestions || []).length;
  const open = (p.customQuestions || []).filter(x => !String(x.a || "").trim()).length;
  const rem = (p.reminders || []).filter(r => !r.done).length;
  const follow = (!q && !rem) ? '<span class="hint">none</span>'
    : (q ? '<span class="pill ' + (open ? "p-orange" : "p-green") + '">' +
           (open ? open + " open" : q + " answered") + '</span> ' : "") +
      (rem ? '<span class="pill p-blue">' + rem + ' reminder' + (rem > 1 ? "s" : "") + '</span>' : "");
  const casefile = p.fileLocked ? '<span class="pill p-green">Locked</span>'
                 : p.submitted ? '<span class="pill p-orange">Submitted</span>'
                 : '<span class="pill p-grey">In progress</span>';
  return '<td><b>' + esc(p.patientCode) + '</b></td><td>' + esc(locName(p.siteId)) + '</td>' +
    '<td>' + esc(fmtDate(p.procedureDate)) + '</td><td>' + esc(p.unicaSize) + '</td>' +
    '<td>' + esc(p.dsSize) + '</td><td>' + follow + '</td>' +
    '<td>' + pill(PT_STATUS, p.status) + '</td><td>' + casefile + '</td>';
}

function patientStatusWidget(){
  const sites = visibleLocations().filter(l => l.type === "SITE");
  const physicians = [...new Set(homePatients().map(patPhysician).filter(Boolean))].sort();
  const f = HOME.pf;
  const list = homePatients().filter(p => {
    if(f.site && p.siteId !== f.site) return false;
    if(f.phys && patPhysician(p) !== f.phys) return false;
    if(f.size && patImplant(p) !== f.size) return false;
    if(f.screen && screenLevel(p) !== f.screen) return false;
    if(f.proc === "Scheduled" && p.status !== "SCHEDULED") return false;
    if(f.proc === "Completed" && p.status !== "TREATED") return false;
    if(f.proc === "Cancelled" && !(p.cancelled && p.cancelled.is)) return false;
    if(f.from && (!p.procedureDate || String(p.procedureDate).slice(0,10) < f.from)) return false;
    if(f.to && (!p.procedureDate || String(p.procedureDate).slice(0,10) > f.to)) return false;
    return true;
  });
  const statusOf = p => (p.cancelled && p.cancelled.is) ? "CANCELLED" : p.status;
  const order = PT_FLOW.concat(["CANCELLED"]);
  const counts = {}; order.forEach(k => counts[k] = 0);
  list.forEach(p => { const st = statusOf(p); if(counts[st] == null) counts[st] = 0; counts[st]++; });

  const filters = '<div class="filters">' +
    selField("pf-site","Site", f.site, [["","All sites"]].concat(sites.map(l => [l.id, l.name]))) +
    selField("pf-phys","Physician", f.phys, [["","All"]].concat(physicians.map(x => [x, x]))) +
    selField("pf-size","Implant size", f.size, [["","All"]].concat(UNICA_SIZES.map(x => [x, "Unica " + x]))) +
    selField("pf-screen","Screening", f.screen, ["","Not started","In progress","Complete"]) +
    selField("pf-proc","Procedure", f.proc, ["","Scheduled","Completed","Cancelled"]) +
    dateField("pf-from","From", f.from) + dateField("pf-to","To", f.to) + '</div>';

  const chips = '<div class="chip-wrap">' + order.filter(k => counts[k] > 0 || HOME.pStatus === k).map(k =>
    '<button class="stat-chip' + (HOME.pStatus === k ? " on" : "") + '" data-pstatus="' + k + '">' +
      '<span class="n">' + counts[k] + '</span><span class="l">' + esc(PT_STATUS[k].label) + '</span>' +
    '</button>').join("") + '</div>';

  /* Always show the patient table (like the Patient Register), narrowed to the selected
     status chip when one is active. Clicking a row opens that patient. */
  const shown = HOME.pStatus ? list.filter(p => statusOf(p) === HOME.pStatus) : list;
  const table = shown.length
    ? '<div class="tbl-wrap" style="margin-top:11px"><table><thead><tr>' +
      '<th>Code</th><th>Site</th><th>Procedure date</th><th>Unica</th><th>DS</th>' +
      '<th>Follow-ups</th><th>Status</th><th>Case file</th></tr></thead><tbody>' +
      shown.map(p => '<tr class="row-click" data-patient="' + p.id + '">' + patientRowCells(p) + '</tr>').join("") +
      '</tbody></table></div>'
    : '<div class="hint" style="margin-top:11px">No patients match the current filters.</div>';

  return '<div class="card"><div class="card-hd"><h2>Patient status</h2>' +
    '<span class="hint">' + shown.length + ' patient(s)</span></div><div class="card-bd">' +
    filters + chips + table + '</div></div>';
}

function deviceInventoryWidget(){
  const f = HOME.df;
  /* Used units are consumed, not inventory, so they are excluded from this widget. */
  const devs = homeDevices().filter(d => {
    if(d.status === "USED") return false;
    if(f.site && d.locationId !== f.site) return false;
    if(f.size && String(d.size) !== f.size) return false;
    return true;
  });
  const locType = id => { const l = loc(id); return l ? l.type : ""; };
  const statusOf = d => (d.status === "IN_WH" || d.status === "IN_SITE") ? "avail"
                      : (d.status === "ON_WAY" || d.status === "DELIVERED") ? "ship" : "other";

  /* One row per size, split by status - Unica sizes and DS sizes both kept. */
  const sizes = UNICA_SIZES.concat(DS_SIZES);
  const mtx = {}; sizes.forEach(s => mtx[s] = { avail:0, ship:0, other:0, total:0 });
  let wh = 0, site = 0;
  devs.forEach(d => {
    const t = locType(d.locationId); if(t === "WAREHOUSE") wh++; else if(t === "SITE") site++;
    if(mtx[d.size] == null) mtx[d.size] = { avail:0, ship:0, other:0, total:0 };
    mtx[d.size][statusOf(d)]++; mtx[d.size].total++;
  });

  const filters = '<div class="filters">' +
    selField("df-site","Location", f.site, [["","All locations"]].concat(visibleLocations().map(l => [l.id, l.name]))) +
    selField("df-size","Device size", f.size, [["","All sizes"]].concat(sizes.map(s => [s, s]))) + '</div>';

  const rows = sizes.filter(s => mtx[s].total > 0);
  const matrix = rows.length
    ? '<div class="tbl-wrap"><table><thead><tr><th>Size</th><th class="num">Available</th>' +
      '<th class="num">In transit</th><th class="num">Other</th><th class="num">Total</th></tr></thead><tbody>' +
      rows.map(s => '<tr><td><b>' + esc(s) + '</b></td>' +
        '<td class="num">' + mtx[s].avail + '</td><td class="num">' + mtx[s].ship + '</td>' +
        '<td class="num">' + mtx[s].other + '</td><td class="num"><b>' + mtx[s].total + '</b></td></tr>').join("") +
      '</tbody></table></div>'
    : '<div class="hint">No devices match the current filters.</div>';

  const locChips = '<div class="chip-wrap" style="margin-top:11px">' +
    '<div class="stat-chip" style="cursor:default"><span class="n">' + wh + '</span><span class="l">In warehouses</span></div>' +
    '<div class="stat-chip" style="cursor:default"><span class="n">' + site + '</span><span class="l">At hospital sites</span></div>' +
    '</div>';

  return '<div class="card"><div class="card-hd"><h2>Device inventory</h2>' +
    '<span class="hint">' + devs.length + ' unit(s)</span></div><div class="card-bd">' +
    filters + matrix + locChips +
    '<div class="hint" style="margin-top:9px">Used units are excluded — they are consumed, not inventory. ' +
    '“Other” means expired or rejected.</div></div></div>';
}

function shipmentRequestsWidget(){
  const reqs = orderRequests();
  const sites = visibleLocations().filter(l => l.type === "SITE");
  const statuses = [...new Set(reqs.map(r => r.status))];

    dateField("sf-date","Date", f.date) + '</div>';

  const table = rows.length
    ? '<div class="tbl-wrap"><table><thead><tr><th>Request</th><th>Date</th><th>Site</th>' +
      '<th>Devices</th><th>Destination</th><th>Status</th></tr></thead><tbody>' +

VIEWS.today = {
  title(){
    const h = new Date().getHours();
    const part = h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
    return part + ", " + String(S.me.name || "").split(/\s+/)[0];
  },
  sub(){
    const n = todoItems().length;
    return n ? n + " thing(s) need you. Most urgent first."
             : "Nothing is waiting on you right now.";
  },
  body(){
    const items = todoItems();

    let h = homeNavCards() +
      patientStatusWidget() +
      '<div class="dash-grid">' + deviceInventoryWidget() + shipmentRequestsWidget() + '</div>' +
      '<div style="height:14px"></div>';

    h += '<div class="card"><div class="card-hd"><h2>Needs your attention</h2>' +
      (items.length ? '<span class="pill p-pink">' + items.length + '</span>' : '') +
      '</div>';

    h += items.length
      ? items.map((it,i) =>
          '<button class="task" data-todo="' + i + '" style="width:100%;border:0;' +
            'background:none;text-align:left;font:inherit;cursor:pointer">' +
            '<span class="task-ic ' + it.tone + '">' + icon(it.ic) + '</span>' +
            '<span class="task-b"><b>' + esc(it.title) + '</b>' +
            '<small>' + esc(it.sub) + '</small></span>' +
            '<span class="hint" style="flex:none;margin:0">Open →</span>' +
          '</button>').join("")
      : '<div class="clear-day"><b>You are all clear.</b>' +
        '<span>No units waiting to be checked in, no procedures in the next week, ' +
        'nothing queued and no unread alerts.</span></div>';

    h += '</div>';
    return h;
  },
  wire(){
    const items = todoItems();
    $$("[data-todo]").forEach(b => b.onclick = () => {
      const it = items[+b.dataset.todo];
      if(!it) return;
      /* Carry the context across, so the target screen opens on the right thing
         instead of on its own chooser. */
      if(it.patientId){
        const p = patient(it.patientId);
        if(p){ SITEID = p.siteId; PID = p.id; }
      }
      S.view = it.view; renderNav(); render();
    });

    /* Module cards. A disabled card renders as a <div> with no data-nav, so it is inert. */
    $$("[data-nav]").forEach(b => b.onclick = () => { S.view = b.dataset.nav; renderNav(); render(); });

    /* Open a patient in the screening module (or the case file if that is all the role
       can reach), landing on a specific stage when asked. */
    const openPatient = (id, stage) => {
      const p = patient(id);
      if(!p) return;
      SITEID = p.siteId; PID = p.id;
      if(typeof SCR !== "undefined"){ SCR.patientId = p.id; if(stage) SCR.open = stage; }
      S.view = canAccessView("screening") ? "screening" : "clinical";
      renderNav(); render();
    };
    $$("[data-patient]").forEach(r => r.onclick = () => openPatient(r.dataset.patient, ""));
    $$("[data-req]").forEach(r => r.onclick = () => openPatient(r.dataset.req, "order"));

    /* Patient-status chips: toggle the drill-down list for a status. */
    $$("[data-pstatus]").forEach(b => b.onclick = () => {
      HOME.pStatus = (HOME.pStatus === b.dataset.pstatus) ? null : b.dataset.pstatus;
      renderKeepingPlace();
    });

    /* Dashboard filters: update state and re-render in place, so values refresh live. */
    const onSel = (id, set) => { const el = $("#" + id); if(el) el.onchange = () => { set(el.value); renderKeepingPlace(); }; };
    onSel("pf-site", v => HOME.pf.site = v);   onSel("pf-phys", v => HOME.pf.phys = v);
    onSel("pf-size", v => HOME.pf.size = v);   onSel("pf-screen", v => HOME.pf.screen = v);
    onSel("pf-proc", v => HOME.pf.proc = v);   onSel("pf-from", v => HOME.pf.from = v);
    onSel("pf-to", v => HOME.pf.to = v);
    onSel("df-site", v => HOME.df.site = v);   onSel("df-size", v => HOME.df.size = v);
    onSel("sf-site", v => HOME.sf.site = v);   onSel("sf-status", v => HOME.sf.status = v);
    onSel("sf-date", v => HOME.sf.date = v);
  }
};

/* PART D — the device and procedure workflows                               */

/* Hour-only fields, and a procedure may run past midnight — so a negative
   difference means the clock wrapped, not that the data is wrong. */
function minsBetween(t1, t2){
  if(!t1 || !t2) return null;
  const p = s => { const [h,m] = s.split(":").map(Number); return h*60 + m; };
  let d = p(t2) - p(t1);
  if(d < 0) d += 1440;
  return d;
}
function fmtDur(m){
  if(m == null) return "—";
  return Math.floor(m/60) + "h " + String(m % 60).padStart(2,"0") + "m";
}

/* ============================================ 1. ARRIVAL & CONDITION CHECK */
let AR = null;
/* Match a code against a unit. The serial number is the identity, so it is tried
   first and matched exactly - an SN identifies one physical device and a "contains"
   match on a unique id would be a way to hit the wrong unit. REF is deliberately NOT
   used as an identity here: many units share a REF, so it can only ever narrow to a
   product and size, never to a device. */
function findDeviceByCode(code){
  const c = String(code || "").trim().toUpperCase();
  if(!c) return null;
  return S.db.devices.find(d => String(d.sn).toUpperCase() === c) ||
         S.db.devices.find(d => String(d.id).toUpperCase() === c) || null;
}

/* Resolve a full scanned label to the unit it names. Runs the REF/SN cross-check
   first, so a mislabelled unit is refused before it can be matched to anything.
   Returns { device, parsed } or throws the parser's error. */
function findDeviceByScan(rawQr){
  const parsed = window.DeviceQr.parseDeviceQr(rawQr);
  const device = S.db.devices.find(d => String(d.sn).toUpperCase() === parsed.sn);
  return { device: device || null, parsed };
}

function resetArrival(){
  const me = S.db.users.find(u => u.email === S.me.email) || {};
  AR = {
    deviceId:"", scannedCode:"", idHandEntered:false,
    siteId: S.me.locationId || "", checks:{}, compromised:false,
    compromiseNote:"", manual:!(me.title && me.phone), done:null,
    receiver: me.title && me.phone ? { name:S.me.name, title:me.title, phone:me.phone }
                                   : { name:"", title:"", phone:"" }
  };
  saveDrafts();
}
/** Restore an interrupted inspection, discarding anything that no longer exists. */
function restoreArrival(){
  const d = loadDrafts().ar;
  if(!d || typeof d !== "object") return false;
  if(d.deviceId && !device(d.deviceId)) d.deviceId = "";
  if(d.siteId && !loc(d.siteId)) d.siteId = "";
  d.done = null;
  AR = d;
  return true;
}

function submitArrival(){
  const d = device(AR.deviceId);
  const missing = ARRIVAL_CHECKS.filter(c => !AR.checks[c.k]);
  /* Each refusal names the step it belongs to, so the operator knows where to look
     on a form that is now three labelled steps long. */
  if(!d)             return showWhy("ar-why", "Step 1 — scan the QR code on the unit you are receiving.");
  if(!AR.siteId)     return showWhy("ar-why", "Step 1 — choose the receiving location.");
  if(missing.length) return showWhy("ar-why", "Step 2 — " + missing.length + " of the four checks " +
                       "are still outstanding: " + missing.map(c => c.t.split(" — ")[0]).join(", ") + ".");
  if(AR.compromised && !AR.compromiseNote.trim())
                     return showWhy("ar-why", "Step 2 — you marked this unit compromised, so describe " +
                       "what is wrong before checking it in.");
  const r = AR.receiver;
  if(!r.name.trim() || !r.title.trim() || !r.phone.trim())
                     return showWhy("ar-why", "Step 3 — receiver name, title and phone are all required.");
  clearWhy("ar-why");

  const target = loc(AR.siteId);
  const before = d.status;
  d.locationId = AR.siteId;
  d.condition  = AR.compromised ? "COMPROMISED" : "OK";
  d.status     = AR.compromised ? "REJECTED" : (target.type === "WAREHOUSE" ? "IN_WH" : "IN_SITE");

  logAction("Arrival & condition verification completed for " + d.ref, {
    locationId:AR.siteId,
    stateChanges: DEV_STATUS[before].label + " → " + DEV_STATUS[d.status].label,
    comments: (AR.compromised ? ("COMPROMISED: " + AR.compromiseNote) : "All four checks passed") +
              (AR.idHandEntered ? " | IDENTIFIER HAND-ENTERED, not scanned" : " | identifier scanned"),
    highPriority: AR.compromised || AR.idHandEntered
  });
  if(AR.compromised){
    notify("Compromised unit reported: " + d.ref + " (" + devName(d) + ") at " + target.name +
           " — " + AR.compromiseNote, ["ADMIN","WH_ADMIN"], [], AR.siteId);
  }
  queueBackup(target.name + "/Condition_Reports", "arrival_" + d.ref + "_" + Date.now() + ".json", {
    type:"ARRIVAL_CONDITION_REPORT", device:{ id:d.id, ref:d.ref, sn:d.sn, mfgDate:d.mfgDate, product:devName(d),
    expiration:d.expiration }, location:target.name, checks:AR.checks,
    compromised:AR.compromised, compromiseNote:AR.compromiseNote, receiver:r,
    identifierSource: AR.idHandEntered ? "HAND_ENTERED" : "SCANNED",
    scannedCode: AR.scannedCode || null,
    verifiedBy:S.me.email, verifiedAt:nowISO()
  });
  commit();
  toast(AR.compromised ? "Recorded as REJECTED and escalated." : "Checked in — now usable stock.",
        AR.compromised ? "bad" : "good");
  /* The outcome is kept on screen rather than vanishing with the toast. */
  const wasManual = AR.idHandEntered;
  resetArrival();
  AR.done = { ref:d.ref, product:devName(d), location:target.name, status:d.status,
              rejected:!!AR.compromised || d.status === "REJECTED", handEntered:wasManual };
  AR.done.rejected = d.status === "REJECTED";
  saveDrafts(); renderNav(); render();
}

/* =========================================== 2. CLINICAL PROCEDURE WORKFLOW */
let PID = null;
function cf(p){ if(!p.caseFile) p.caseFile = {}; return p.caseFile; }
function ro(p){ return p.fileLocked ? " disabled" : ""; }

function tf(p, key, label, type, opts){
  opts = opts || {};
  const v = cf(p)[key] == null ? "" : cf(p)[key];
  /* The id is derived from the key so the label can point at it. Without that, a
     screen reader announced every one of these as an unnamed edit box, and tapping
     the label text did nothing. */
  const fid = "cf-" + key;
  /* Every time field gets a "Now" button. In a cath lab the operator is gloved and
     the event has just happened, so typing HH:MM is both slow and a chance to record
     the wrong minute. The button is suppressed on a locked file (ro) - there is no
     point offering an action that cannot be taken. */
  const nowBtn = (type === "time" && !ro(p))
    ? '<button type="button" class="btn-now" data-now="' + key + '" ' +
      'title="Set to the current time">Now</button>'
    : "";
  return '<div class="field"><label class="' + (opts.req ? "req" : "") + '" for="' + fid + '">' +
    esc(label) + '</label>' +
    (type === "textarea"
      ? '<textarea id="' + fid + '" data-cf="' + key + '"' + ro(p) + '>' + esc(v) + '</textarea>'
      : (nowBtn ? '<div class="with-now">' : "") +
        '<input type="' + type + '" id="' + fid + '" data-cf="' + key + '" value="' + esc(v) + '"' + ro(p) +
        (opts.step ? ' step="' + opts.step + '"' : "") + '>' + nowBtn +
        (nowBtn ? '</div>' : "")) +
    (opts.hint ? '<div class="hint">' + esc(opts.hint) + '</div>' : "") + '</div>';
}

/* A pressure is three numbers and the moment they were read, not one number.
   Recorded as Sys / Dias / Mean plus a measurement time with its own Now button,
   and displayed in the clinical shorthand Sys\Dias(Mean). */
function pressureField(p, key, label){
  const c = cf(p);
  const g = s => c[key + s] == null ? "" : c[key + s];
  const n = v => (v === "" || v == null) ? "–" : v;
  const fid = k => "cf-" + key + k;
  return '<div class="field pressure"><label for="' + fid("Sys") + '">' + esc(label) + '</label>' +
    '<div class="grid g3" style="gap:6px">' +
      ['Sys','Dias','Mean'].map(part =>
        '<input type="number" id="' + fid(part) + '" data-cf="' + key + part + '" ' +
        'placeholder="' + part + '" aria-label="' + esc(label + " " + part) + '" ' +
        'value="' + esc(g(part)) + '"' + ro(p) + '>').join("") +
    '</div>' +
    '<div class="readout mono" id="ro-' + key + '">' +
      n(g('Sys')) + '\\' + n(g('Dias')) + '(' + n(g('Mean')) + ')</div>' +
    '<label for="' + fid("At") + '" class="sub-label">Measurement time</label>' +
    (ro(p)
      ? '<input type="time" id="' + fid("At") + '" data-cf="' + key + 'At" value="' + esc(g('At')) + '"' + ro(p) + '>'
      : '<div class="with-now"><input type="time" id="' + fid("At") + '" data-cf="' + key + 'At" ' +
        'value="' + esc(g('At')) + '">' +
        '<button type="button" class="btn-now" data-now="' + key + 'At">Now</button></div>') +
    '</div>';
}
function cbox(p, key, label, idx){
  const arr = cf(p)[key] || [];
  const on = !!arr[idx];
  return '<label class="check' + (on ? " on" : "") + '">' +
    '<input type="checkbox" data-cfa="' + key + '" data-i="' + idx + '"' +
    (on ? " checked" : "") + ro(p) + '><span>' + esc(label) + '</span></label>';
}

let SITEID = null;    // chosen first; nothing about a patient is shown until both are set

/** Source-image control for one measurement field, plus what has already been filed. */
function sourceImages(p, key, label){
  const mine = (p.images || []).filter(i => i.field === key);
  return '<div class="field">' +
    '<div class="row" style="gap:8px">' +
      (p.fileLocked ? '' :
        '<button type="button" class="btn btn-sm" data-img="' + key + '" ' +
        'data-imglabel="' + esc(label) + '">Add source image</button>') +
      '<span class="hint" style="margin:0">' +
        (mine.length ? mine.length + ' image(s) filed under ' + esc(p.patientCode)
                     : 'Photograph the machine screen as the source for this value.') +
      '</span>' +
    '</div>' +
    (mine.length ? '<div class="row" style="gap:8px;margin-top:8px">' +
      mine.map(i => '<a href="' + i.thumb + '" target="_blank" rel="noopener" ' +
        'title="' + esc(i.filename) + '" style="display:block">' +
        '<img src="' + i.thumb + '" alt="Redacted source image for ' + esc(label) + '" ' +
        'style="height:64px;border:1px solid var(--line);border-radius:5px"></a>').join("") +
      '</div><div class="hint">Identifiers are blacked out and EXIF stripped before filing.</div>' : "") +
  '</div>';
}

/* ================================ PATIENT SCREENING & ANATOMICAL EVALUATION ===
   Everything from taking a patient on to requesting the product. Ten stages, each
   locked until the previous one is finished, with a recorded override as the only
   way past. The output of this module - an eligible patient with a procedure date -
   is what starts the clinical workflow. */
let SCR = { patientId:"", stage:"", open:"" };

/* Re-render without throwing the user back to the top. A status change can unlock a
   later stage, so the whole view has to be rebuilt - but on a long form, losing your
   scroll position and your focus on every edit is worse than the stale markup. */
function renderKeepingPlace(){
  const y = window.scrollY;
  const id = document.activeElement && document.activeElement.id;
  render();
  window.scrollTo(0, y);
  if(id){ const el = document.getElementById(id); if(el && el.focus) el.focus({ preventScroll:true }); }
}

VIEWS.screening = {
  title:"Patient Screening & Evaluation",
  sub:"Clinical screening, anatomical evaluation, scheduling and the product order request.",
  body(){
    const list = S.db.patients.filter(p => !scopedLocIds() || scopedLocIds().includes(p.siteId));
    if(!list.length) return '<div class="empty">No patients yet. A CPM or App Admin can add one in the Patient Register.</div>';
    if(!SCR.patientId || !list.some(p => p.id === SCR.patientId)) SCR.patientId = list[0].id;
    const p = S.db.patients.find(x => x.id === SCR.patientId);
    if(!p.screening) { p.screening = blankScreening(); p.anat = blankAnat(); }

    const rec = currentRecommendation(p);
    const missing = anatIncomplete(p);
    /* Open the first stage that is unlocked and not yet settled - the one place the
       user can do something. Nothing to do anywhere means everything stays collapsed. */
    if(!SCR.open || !p.anat[SCR.open] || !anatUnlocked(p, SCR.open)){
      const next = ANAT_STAGES.find(st => anatUnlocked(p, st.k) && !stageComplete(p, st));
      SCR.open = next ? next.k : "";
    }

    let h = '<div class="card"><div class="card-bd"><div class="grid g2">' +
      '<div class="field"><label for="scr-pt">Patient</label><select id="scr-pt">' +
        list.map(x => '<option value="' + x.id + '"' + (x.id === SCR.patientId ? " selected" : "") + '>' +
          esc(x.patientCode) + ' · ' + esc(locName(x.siteId)) + '</option>').join("") +
      '</select></div>' +
      '<div><label class="lbl-sm">Workflow status</label><div style="margin-top:5px">' +
        pill(PT_STATUS, p.status) +
        (p.cancelled && p.cancelled.is
          ? ' <span class="hint">stopped during ' + esc(p.cancelled.stage || "screening") + '</span>' : "") +
      '</div></div></div>';

    /* The live recommendation, so nobody has to scroll ten stages to find the size
       that is actually operative right now. */
    h += '<div class="grid g3" style="margin-top:4px">' +
      '<div class="calc"><small>Recommended implant size</small><b>' + esc(rec.size || "–") + '</b></div>' +
      '<div class="calc"><small>Implantation angle</small><b>' + esc(rec.angle || "–") + '</b></div>' +
      '<div class="calc"><small>Derived from</small><b style="font-size:13px">' +
        esc(rec.from || "no completed evaluation yet") + '</b></div>' +
      '</div>';
    if(rec.altSize) h += '<div class="hint">Alternative size on record: ' + esc(rec.altSize) + '</div>';
    h += '</div></div>';

    if(p.cancelled && p.cancelled.is){
      h += '<div class="warn"><b>This patient was cancelled.</b> ' + esc(p.cancelled.reason) +
        ' — ' + esc(p.cancelled.by) + ', ' + esc(fmtDate(p.cancelled.at)) +
        '. The stage they had reached is preserved, so the workflow can resume from there.' +
        (can("managePatients") ? ' <button class="btn" id="scr-uncancel">Resume this patient</button>' : "") +
        '</div>';
    }

    /* ---- Clinical screening ---- */
    const scrDone = SCREENING_STEPS.filter(s => p.screening[s.k].done).length;
    h += '<div class="card"><div class="card-hd"><h2>Clinical Screening</h2>' +
      '<span class="hint">' + scrDone + '/' + SCREENING_STEPS.length + ' received</span></div><div class="card-bd">' +
      '<p class="hint">Only a CPM updates whether the clinical material has arrived. ' +
      'Marking the CT available opens the anatomical evaluation below.</p>' +
      SCREENING_STEPS.map(s => {
        const st = p.screening[s.k];
        return '<label class="check' + (st.done ? " on" : "") + '">' +
          '<input type="checkbox" data-scr="' + s.k + '"' + (st.done ? " checked" : "") +
          (can("managePatients") ? "" : " disabled") + '><span>' + esc(s.label) +
          (st.done && st.by ? ' <span class="hint">— ' + esc(st.by) + ', ' + esc(fmtDate(st.at)) + '</span>' : "") +
          (s.gate ? ' <span class="hint">' + esc(s.gate) + '</span>' : "") +
          '</span></label>';
      }).join("") +
      '</div></div>';

    const ctReady = p.screening.ct.done;

    /* ---- Anatomical evaluation ---- */
    h += '<div class="card"><div class="card-hd"><h2>Anatomical Evaluation Workflow</h2>' +
      '<span class="saved" id="sv-scr"></span>' +
      '<span class="hint">' + (ANAT_STAGES.length - missing.length) + '/' + ANAT_STAGES.length +
      ' stages settled</span></div><div class="card-bd">';

    if(!ctReady){
      h += '<div class="info">The CT scan is not marked as available yet, so stage 1 is not open. ' +
           'Tick <b>CT Scan</b> above to begin.</div>';
    }

    if(missing.length && can("managePatients")){
      h += '<div class="' + (p.anatOverride ? "warn" : "info") + '">' +
        (p.anatOverride
          ? '<b>Override recorded.</b> ' + esc(p.anatOverride.reason) + ' — ' +
            esc(p.anatOverride.by) + ', ' + esc(fmtDate(p.anatOverride.at)) +
            '. Incomplete at the time: ' + esc(p.anatOverride.incomplete.join("; ")) + '.'
          : '<b>' + missing.length + ' mandatory stage(s) still open.</b> A procedure cannot ' +
            'be scheduled until they are finished, unless an App Admin records an override.' +
            (S.me.role === "ADMIN" ? ' <button class="btn" id="scr-override">Record an override</button>' : "")) +
        '</div>';
    }

    h += whyBox("scr-why");
    /* Self-heal any stage persisted as "Completed" without its required fields (e.g. a
       field cleared after completion, or data from an older build): it drops to "In
       progress" so the dropdown never contradicts the badge, even on a plain reload. */
    if(can("managePatients")){
      let healed = false;
      ANAT_STAGES.forEach(s => { if(reconcileStageStatus(p, s)) healed = true; });
      if(healed) commit();
    }
    h += ANAT_STAGES.map(s => anatStageHtml(p, s, ctReady)).join("");
    h += '</div></div>';
    return h;
  },

  wire(){
    const p = S.db.patients.find(x => x.id === SCR.patientId);
    if(!p) return;
    const sel = $("#scr-pt");
    if(sel) sel.onchange = e => { SCR.patientId = e.target.value; SCR.open = ""; render(); };

    /* Same "Saved" affordance as the case file next door, so the two screens behave
       the same way. Without it every edit here was silent. */
    function flashSaved(){
      const el = $("#sv-scr");
      if(!el) return;
      el.textContent = "Saved";
      clearTimeout(flashSaved._t);
      flashSaved._t = setTimeout(() => { const e2 = $("#sv-scr"); if(e2) e2.textContent = ""; }, 1200);
    }

    /* Accordion: one stage open at a time. */
    const toggle = key => { SCR.open = (SCR.open === key) ? "" : key; renderKeepingPlace(); };
    $$("[data-acc]").forEach(hd => {
      hd.onclick = () => toggle(hd.dataset.acc);
      hd.onkeydown = e => {
        if(e.key === "Enter" || e.key === " "){ e.preventDefault(); toggle(hd.dataset.acc); }
      };
    });

    /* Screening material received / not received. */
    $$("[data-scr]").forEach(cb => cb.onchange = () => {
      if(!can("managePatients")) return;
      const st = p.screening[cb.dataset.scr];
      st.done = cb.checked;
      st.by = cb.checked ? S.me.name : "";
      st.at = cb.checked ? nowLocalStamp() : "";   // date + time of ticking, automatically
      const before = p.status;
      p.status = recomputeWorkflow(p);
      logAction("Screening material updated", { locationId:p.siteId,
        stateChanges: cb.dataset.scr + " = " + (cb.checked ? "received" : "not received") +
          (before === p.status ? "" : "; status → " + PT_STATUS[p.status].label),
        comments:"Patient " + p.patientCode });
      commit(); renderKeepingPlace(); flashSaved();
    });

    /* Every stage field writes straight through, then the status is re-derived. */
    $$("[data-anat]").forEach(el => {
      const h = () => {
        const [key, field] = el.dataset.anat.split("|");
        if(!anatUnlocked(p, key)) return;
        const a = p.anat[key];
        const before = { st:a.status, status:p.status };
        const stage = ANAT_STAGES.find(x => x.k === key);

        /* Refuse "Completed" while required content is missing. Reverting the select
           rather than accepting it keeps the badge, the gate and the dropdown telling
           the same story - a stage can never look done and not be. */
        if(field === "status" && el.value === "Completed"){
          const probe = Object.assign({}, a, { status:"Completed" });
          const saved = p.anat[key];
          p.anat[key] = probe;
          const gaps = stageMissing(p, stage);
          p.anat[key] = saved;
          if(gaps.length){
            el.value = a.status;
            showWhy("scr-why", "Stage " + stage.n + " needs " + gaps.join(", ") +
              " before it can be marked completed.");
            return;
          }
        }
        clearWhy("scr-why");
        a[field] = el.type === "checkbox" ? el.checked : el.value;

        /* Keep the dropdown and the badge telling one story as fields are edited:
           a "Not started" stage that gets any input becomes "In progress", and a
           "Completed" stage whose required fields are no longer all present drops back
           to "In progress" - so a stage can never show "Completed" beside "Incomplete". */
        if(field !== "status"){
          if(a.status === "Not started") a.status = "In progress";
          else reconcileStageStatus(p, stage);
        }

        /* Completing a stage stamps who and when, once. */
        if(field === "status" && a.status === "Completed" && !a.completedBy){
          a.completedBy = S.me.name;
          if(!a.completionDate) a.completionDate = nowISO().slice(0,16);  // date + time (YYYY-MM-DDTHH:mm)
        }
        /* No pacemaker means PM insertion is not something anyone has to do. */
        if(key === "model3d" && field === "pmPresent"){
          p.anat.pmins.status = (el.value === "No") ? "Not required" : "Not started";
        }
        /* Scheduling is the one place a procedure date is set; the clinical workflow
           reads it from here rather than asking again. */
        if(key === "scheduling" && field === "completionDate") p.procedureDate = el.value;

        /* The first time the Product Order stage leaves "Not started", the request has
           gone out: stamp who raised it and notify admins + warehouse managers (in-app
           now, email via the server). Guarded on requestedBy so it fires exactly once. */
        if(key === "order" && a.status !== "Not started" && a.status !== "Not required" && !a.requestedBy){
          a.requestedBy = S.me.name;
          a.requestedAt = nowISO();
          announceOrderRequest(p);
        }

        p.status = recomputeWorkflow(p);
        logAction("Anatomical evaluation updated", { locationId:p.siteId,
          stateChanges: key + "." + field + " = " + String(a[field]).slice(0,60) +
            (before.status === p.status ? "" : "; status → " + PT_STATUS[p.status].label),
          comments:"Patient " + p.patientCode });
        commit();
        flashSaved();
        /* These three can unlock a later stage or change a summary line, so the view
           is rebuilt - but in place. */
        if(a.status !== before.st ||
           ["status","pmPresent","completionDate","suitability","size","actualDate",
            "hospital","physician","shippingDest","requestedDate"].includes(field)){
          renderKeepingPlace();
        }
      };
      el.addEventListener("change", h);
    });

    const ov = $("#scr-override");
    if(ov) ov.onclick = () => {
      const incomplete = anatIncomplete(p);
      modal("Record an override",
        '<p>Scheduling normally requires every mandatory stage to be finished. ' +
        'These are still open:</p><ul class="hint">' +
        incomplete.map(x => '<li>' + esc(x) + '</li>').join("") + '</ul>' +
        '<div class="field"><label class="req" for="ov-why">Reason for override</label>' +
        '<textarea id="ov-why" placeholder="Why is it clinically acceptable to proceed without these?"></textarea>' +
        '<div class="hint">Recorded against your account with the date, the reason, and ' +
        'exactly which stages were incomplete.</div></div>',
        '<div class="row"><button class="btn" data-close="1">Cancel</button>' +
        '<span class="spacer"></span>' +
        '<button class="btn btn-pri" id="ov-go">Record override</button></div>');
      $("#ov-go").onclick = () => {
          const why = ($("#ov-why").value || "").trim();
          if(why.length < 10){ $("#ov-why").focus(); return; }
          p.anatOverride = { by:S.me.name, at:nowISO().slice(0,10), reason:why, incomplete };
          p.status = recomputeWorkflow(p);
          logAction("Anatomical evaluation OVERRIDE", { locationId:p.siteId, highPriority:true,
            stateChanges:"override granted; " + incomplete.length + " stage(s) incomplete",
            comments:"Patient " + p.patientCode + " — " + why + " | incomplete: " + incomplete.join("; ") });
          notify("Anatomical evaluation override for " + p.patientCode + " by " + S.me.name +
                 " — " + why, ["ADMIN","CPM"], [], p.siteId);
          commit(); closeModal(); renderKeepingPlace();
      };
    };

    const un = $("#scr-uncancel");
    if(un) un.onclick = () => {
      p.cancelled = { is:false, reason:"", by:"", at:"", stage:"" };
      p.status = recomputeWorkflow(p);
      logAction("Patient resumed after cancellation", { locationId:p.siteId,
        stateChanges:"→ " + PT_STATUS[p.status].label, comments:"Patient " + p.patientCode });
      commit(); renderKeepingPlace();
    };
  }
};

/* One stage, rendered from its declaration.
   Collapsed by default: ten stages fully expanded is roughly seventy controls, and
   nine of them are usually locked and irrelevant. The header alone tells you where
   the stage stands; the body opens when you are actually working on it. */
function anatStageHtml(p, s, ctReady){
  const a = p.anat[s.k];
  const open = ctReady && anatUnlocked(p, s.k);
  const settled = stageComplete(p, s);
  const missing = stageMissing(p, s);
  const isOpen = SCR.open === s.k && open;

  /* Header summary, so a collapsed stage still answers "what was decided here". */
  let summary = "";
  if(a.status === "Not required") summary = s.needsPm ? "N/A · Deemed (No PM)" : "Not required";
  else if(settled){
    summary = [s.kind === "eval" ? [a.size, a.angle ? a.angle + "\u00B0" : ""].filter(Boolean).join(", ") : "",
               s.kind === "ops"  ? (a.actualDate ? fmtDate(a.actualDate) : "") : "",
               s.kind === "sched" ? [a.completionDate ? fmtDate(a.completionDate) : "", a.hospital].filter(Boolean).join(" \u00B7 ") : "",
               s.kind === "order" ? a.shippingDest : "",
               a.completedBy].filter(Boolean).join(" \u00B7 ");
  }else if(a.status === "Completed" && missing.length){
    summary = missing.length + " required field(s) still empty";
  }

  const badgeCls = settled ? "p-green"
                 : a.status === "Completed" ? "p-red"
                 : a.status === "In progress" ? "p-orange" : "p-grey";
  let badgeTxt = (a.status === "Completed" && !settled) ? "Incomplete" : a.status;
  /* PM Insertion with no pacemaker reads as N/A rather than the internal "Not required". */
  if(a.status === "Not required" && s.needsPm) badgeTxt = "N/A";

  const head = '<div class="card-hd acc-hd' + (open ? " is-clickable" : "") + '"' +
    (open ? ' data-acc="' + s.k + '" role="button" tabindex="0" aria-expanded="' + isOpen + '"' : "") + '>' +
    '<h2><span class="stage-n">' + s.n + '</span>' + esc(s.label) +
      (summary ? ' <span class="acc-sum">' + esc(summary) + '</span>' : "") + '</h2>' +
    '<span class="badge ' + badgeCls + '">' + esc(badgeTxt) + '</span>' +
    (open ? '<span class="acc-caret">' + (isOpen ? "\u2212" : "+") + '</span>' : "") +
    '</div>';

  if(!open){
    return '<div class="card stage is-locked">' + head +
      '<div class="card-bd"><div class="locked-ov">Locked until stage ' + s.n +
      ' can be started \u2014 finish the stage before it, or record an override.</div></div></div>';
  }
  if(!isOpen) return '<div class="card stage">' + head + '</div>';

  const dis = can("managePatients") ? "" : " disabled";
  const f = (field, label, type, opts) => {
    opts = opts || {};
    const id = "an-" + s.k + "-" + field;
    const v = a[field] == null ? "" : a[field];
    let ctl;
    if(type === "select"){
      ctl = '<select id="' + id + '" data-anat="' + s.k + '|' + field + '"' + dis + '>' +
        opts.options.map(x => '<option' + (String(v) === String(x) ? " selected" : "") + '>' +
          esc(x) + '</option>').join("") + '</select>';
    }else if(type === "textarea"){
      ctl = '<textarea id="' + id + '" data-anat="' + s.k + '|' + field + '"' + dis + '>' + esc(v) + '</textarea>';
    }else{
      ctl = '<input type="' + type + '" id="' + id + '" data-anat="' + s.k + '|' + field +
            '" value="' + esc(v) + '"' + dis + '>';
    }
    const req = stageRequired(s).some(([k]) => k === field);
    return '<div class="field"><label class="' + (req ? "req" : "") + '" for="' + id + '">' +
      esc(label) + '</label>' + ctl + '</div>';
  };
  /* Clinical judgement is a CPM call, so evaluation stages only offer those names.
     Operational stages can be assigned to anyone. */
  const users = [""].concat(S.db.users
    .filter(u => s.kind !== "eval" || ["CPM","ADMIN"].includes(u.role))
    .map(u => u.name));

  /* "Not required" is only meaningful for PM Insertion (no pacemaker) and for the
     Product Order (a patient may need no product order). Every other stage must be
     worked through, so it is not offered there. */
  const statusOptions = (s.k === "pmins" || s.k === "order")
    ? ANAT_STATUS : ANAT_STATUS.filter(x => x !== "Not required");

  let inner = '<div class="grid g3">' +
    f("status","Status","select",{ options:statusOptions }) +
    f("assignedTo","Assigned to","select",{ options:users });

  if(s.kind === "eval"){
    inner += f("suitability","Anatomical suitability","select",{ options:SUITABILITY }) +
      '</div><div class="grid g3">' +
      f("size", s.final ? "Final recommended implant size" : "Recommended implant size",
        "select",{ options:[""].concat(UNICA_SIZES) }) +
      (s.final ? "" : f("altSize","Alternative size (optional)","select",{ options:[""].concat(UNICA_SIZES) })) +
      f("angle", s.final ? "Final recommended implantation angle" : "Recommended implantation angle","text");
    if(s.sim) inner += f("simAngle","Implantation angle used in simulator","text");
    inner += '</div>';
    if(s.pm){
      inner += '<div class="grid g3">' +
        f("pmPresent","PM present","select",{ options:["","Yes","No"] }) +
        f("pmLeads","Number of PM leads","number") +
        f("pmCrossingAngle","PM crossing angle","text") + '</div>';
    }
    if(s.strategy) inner += f("strategy","Final implant strategy","textarea");
    inner += '<div class="grid g2">' + f("completionDate","Completion date","datetime-local") +
      '<div class="field"><label>Completed by</label><input value="' + esc(a.completedBy || "") +
      '" disabled></div></div>';
  }
  else if(s.kind === "ops"){
    inner += '</div><div class="grid g2">' +
      f("estDate","Estimated completion date","datetime-local") +
      f("actualDate","Actual completion date","datetime-local") + '</div>';
    if(s.needsPm && a.status === "Not required"){
      inner += '<div class="info">No pacemaker recorded in the 3D model evaluation, so this ' +
               'stage is deemed <b>N/A (No PM)</b> automatically.</div>';
    }
  }
  else if(s.kind === "sched"){
    inner += '</div><div class="grid g3">' +
      f("completionDate","Procedure date","datetime-local") +
      f("hospital","Hospital","text") +
      f("physician","Physician","text") + '</div>' +
      f("schedNotes","Notes","textarea") +
      '<div class="hint">Setting the procedure date here is what moves the patient to ' +
      '<b>Procedure Scheduled</b> and feeds the clinical workflow. It is not asked again there.</div>';
    if(anatIncomplete(p).length && !p.anatOverride){
      inner += '<div class="warn">Mandatory stages are still open, so scheduling is blocked. ' +
               'An App Admin can record an override above.</div>';
    }
  }
  else if(s.kind === "order"){
    const rec = currentRecommendation(p);
    inner += '</div><div class="grid g3">' +
      '<div class="field"><label>Implant size</label><input value="' + esc(rec.size || "") + '" disabled></div>' +
      '<div class="field"><label>Delivery system size</label><input value="' +
        esc(rec.size && window.DeviceQr ? window.DeviceQr.requiredDsSize(rec.size) : "") + '" disabled></div>' +
      f("requestedDate","Requested delivery date","date") + '</div>' +
      '<div class="hint">Both sizes are read-only: the implant size comes from the completed ' +
      'evaluation, and the delivery system follows from it (S/M need Short, L/XL need Long).</div>' +
      '<div class="grid g3">' + f("accessories","Required accessories","text") +
      f("shippingDest","Shipping destination","text") +
      '<div class="field"><label>Requested by</label><input value="' + esc(a.requestedBy || "") +
      '" disabled></div></div>' +
      f("approvedBy","Approved by","select",{ options:users });
  }
  else inner += '</div>';

  /* Says what is stopping this stage from counting, before the user tries. */
  if(missing.length && a.status !== "Not required"){
    inner += '<div class="' + (a.status === "Completed" ? "warn" : "hint") + '" style="margin-top:4px">' +
      (a.status === "Completed"
        ? '<b>This stage cannot count as completed yet.</b> Still empty: '
        : 'To complete this stage you will need: ') + esc(missing.join(", ")) + '.</div>';
  }

  return '<div class="card stage">' + head + '<div class="card-bd">' + inner + '</div></div>';
}

VIEWS.clinical = {
  title:"Procedure Case File",
  sub:"Pick the site, then the patient. Everything saves as you type.",
  body(){
    /* Step 1 - site. Step 2 - patient. Only then any patient data at all: showing a
       case file before the operator has said who they are working on is how the wrong
       patient's record gets edited. */
    const sites = visibleLocations().filter(l => l.type === "SITE");
    if(!sites.length) return '<div class="empty">No hospital sites are in your scope.</div>';
    if(SITEID && !sites.some(s => s.id === SITEID)) SITEID = null;
    const atSite = SITEID ? S.db.patients.filter(x => x.siteId === SITEID) : [];
    if(PID && !atSite.some(x => x.id === PID)) PID = null;

    let h = '<div class="card"><div class="card-hd"><h2>Who are you working on?</h2>' +
      (PID ? '<button class="btn btn-sm" id="pt-change">Change patient</button>' : '') +
      '</div><div class="card-bd"><div class="grid g2">' +
      '<div class="field" style="margin:0"><label class="req" for="site-sel">1 · Site</label>' +
        '<select id="site-sel"><option value="">— choose a site —</option>' +
        sites.map(s => '<option value="' + s.id + '"' + (s.id === SITEID ? " selected" : "") + '>' +
          esc(s.name) + '</option>').join("") + '</select></div>' +
      '<div class="field" style="margin:0"><label class="req" for="pt-sel">2 · Patient</label>' +
        '<select id="pt-sel"' + (SITEID ? "" : " disabled") + '>' +
        '<option value="">' + (SITEID ? "— choose a patient —" : "choose a site first") + '</option>' +
        atSite.map(x => '<option value="' + x.id + '"' + (x.id === PID ? " selected" : "") + '>' +
          esc(x.patientCode) + ' · ' + esc(PT_STATUS[x.status].label) + '</option>').join("") +
        '</select>' + (SITEID && !atSite.length
          ? '<div class="hint">No patients registered at this site yet.</div>' : '') +
      '</div></div></div></div>';

    if(!SITEID) return h + '<div class="empty"><b>Start by choosing a site</b>' +
      'Nothing about a patient is shown until you have said which hospital you are at.</div>';
    if(!PID)    return h + '<div class="empty"><b>Now choose a patient</b>' +
      'Their case file opens here, with a briefing on sizing, stock and open questions.</div>';

    const p = patient(PID);
    const fifoU = fifoPick("UNICA", p.unicaSize, p.siteId);
    const fifoD = fifoPick("DS", p.dsSize, p.siteId);
    const c = cf(p);

    /* ---- the briefing: what is known about this patient, before any data entry ---- */
    const stockHere = S.db.devices.filter(d => d.locationId === p.siteId &&
      (d.status === "IN_SITE" || d.status === "IN_WH"));
    const openQs = (p.customQuestions || []).filter(q => !String(q.a || "").trim());
    const dueRem = (p.reminders || []).filter(r => !r.done);

    h += '<div class="card" style="border-left:3px solid var(--brand)">' +
      '<div class="card-hd"><h2>' + esc(p.patientCode) + ' — briefing</h2>' +
        pill(PT_STATUS, p.status) + '</div><div class="card-bd">' +
      '<div class="grid g4">' +
        '<div class="kv"><b>Site</b> ' + esc(locName(p.siteId)) + '</div>' +
        '<div class="kv"><b>Procedure date</b> ' + esc(fmtDate(p.procedureDate)) + '</div>' +
        '<div class="kv"><b>Assigned sizing</b> Unica ' + esc(p.unicaSize) + ' · DS ' + esc(p.dsSize) + '</div>' +
        '<div class="kv"><b>Case file</b> ' + (p.fileLocked ? "Locked" :
            p.submitted ? "Submitted, editable" : "In progress") + '</div>' +
      '</div>' +

      '<h3 style="margin:14px 0 7px">Devices available at this site</h3>' +
      (stockHere.length
        ? '<div class="tbl-wrap"><table><thead><tr><th>Ref</th><th>Product</th><th>Expires</th>' +
          '<th>Status</th><th></th></tr></thead><tbody>' +
          stockHere.map(d => {
            const match = (d.productType === "UNICA" && d.size === p.unicaSize) ||
                          (d.productType === "DS" && d.size === p.dsSize);
            const isFifo = (fifoU && d.id === fifoU.id) || (fifoD && d.id === fifoD.id);
            return '<tr><td class="mono">' + esc(d.ref) + '</td><td>' + esc(devName(d)) + '</td>' +
              '<td>' + esc(d.expiration) + '</td><td>' + pill(DEV_STATUS, d.status) + '</td>' +
              '<td>' + (isFifo ? '<span class="pill p-green">FIFO choice</span>' :
                        match ? '<span class="pill p-blue">Correct size</span>' : '') + '</td></tr>';
          }).join("") + '</tbody></table></div>'
        : '<div class="warn">No usable stock at this site. A Clinical PM or App Admin must ' +
          'record an override, or stock must be shipped in first.</div>') +
      (fifoU || fifoD ? "" : '<div class="hint">No FIFO match for this patient’s assigned sizes.</div>') +

      '<h3 style="margin:14px 0 7px">Medical questions</h3>' +
      ((p.customQuestions || []).length
        ? (openQs.length ? '<div class="warn"><b>' + openQs.length + ' question(s) still unanswered.</b> ' +
              'Answer them in stage 2 below.</div>' : '<div class="okbox">All answered.</div>') +

    h += '<div class="card stage" id="stage-2"><div class="card-hd"><h2><span class="stage-n">3</span>' +

      '</div>' +

      '<div class="grid g2">' +

      '<div class="grid g2">' +

      '</div>' +
      '<div class="grid g2">' +
        sourceImages(p, "ivcPre",  "IVC pressure pre") +

      '</div><div class="grid g4">' +
        tf(p,"contrast","Total contrast volume (mL)","number") +
        '<div class="field"><label for="cf-contrastForm">Contrast form</label>' +

      '<div class="field"><label class="req" for="cf-asExpected">Were the devices used as expected?</label>' +

        '<select id="cf-notExpectedBranch" data-cf="notExpectedBranch"' + ro(p) + '>' +
        '<option value=""' + (branch === "" ? " selected" : "") + '>— choose —</option>' +
        '<option value="CANCELLED"' + (branch === "CANCELLED" ? " selected" : "") + '>Procedure cancelled</option>' +
        '<option value="ALTERNATIVE"' + (branch === "ALTERNATIVE" ? " selected" : "") + '>Alternative devices used</option>' +
        '</select></div>' : "") +

        '<div class="hint" style="margin-bottom:10px">Rejected/Failure Device Log is optional here.</div>') +
      /* Both identifiers are scanned, so the failed unit and the one actually used are

      '<div class="grid g2">' +
        scanField("fail-scan", "Rejected / failed device — scan its label", c.failRef,
                  { req:failReq, disabled:p.fileLocked }) +
        scanField("repl-scan", "Replacement actually used — scan its QR code", c.replRef,
                  { req:failReq, disabled:p.fileLocked }) +
      '</div>' +
      (c.failRef || c.replRef ? '<div class="info">' +
        (c.failRef ? '<div>Failed: <span class="mono">' + esc(c.failRef) + '</span>' +
          (c.failManual ? ' <span class="pill p-orange">hand-entered</span>' : '') + '</div>' : '') +
        (c.replRef ? '<div>Used instead: <span class="mono">' + esc(c.replRef) + '</span>' +
          (c.replManual ? ' <span class="pill p-orange">hand-entered</span>' : '') + '</div>' : '') +
        '</div>' : "") +
      '<div class="grid g2">' +
        tf(p,"failReason","Reason","text",{req:failReq}) +
        tf(p,"failDetail","Failure detail","textarea",{req:failReq}) +
      '</div>' +
      tf(p,"postNotes","Post-procedure notes","textarea") +
    '</div><div class="card-ft">' +
      (p.fileLocked ? '<div class="row"><span class="pill p-green">Permanently locked</span></div>' :
      whyBox("pt-why") +
      '<div class="row">' +
        /* Saving is ALWAYS possible, whatever is still blank. Submission is a separate
           action and it is the one that enforces the mandatory fields. */
        '<button class="btn" id="pt-save">Save and close</button>' +
        '<button class="btn btn-primary" id="pt-submit">' +
          (p.submitted ? "Re-submit case file" : "Submit case file") + '</button>' +
        (p.submitted && can("lockCaseFile")
          ? '<button class="btn btn-dark" id="pt-lock">Final permanent lock</button>' : "") +
        (p.submitted && !can("lockCaseFile")
          ? '<span class="hint">Only a Clinical PM or App Admin can perform the final lock.</span>' : "") +
      '</div>' +
      '<div class="hint" style="margin-top:8px">Fields save as you type. ' +
        '<b>Save and close</b> always works, even with mandatory fields empty — only ' +
        'submission requires them.</div>' +
      outstandingList(p)) +
    '</div></div></div>';
    return h;
  },
  wire(){
    const ss = $("#site-sel");
    if(ss) ss.onchange = e => { SITEID = e.target.value || null; PID = null; render(); };
    const sel = $("#pt-sel");
    if(sel) sel.onchange = e => { PID = e.target.value || null; render(); };
    const ch = $("#pt-change");
    if(ch) ch.onclick = () => { PID = null; render(); };

    /* The rail scrolls rather than hides: the operator can still see the whole file
       in one pass, which is what makes this efficient during a live procedure. */
    $$("[data-stage]").forEach(b => b.onclick = () => {
      const el = $("#stage-" + b.dataset.stage);
      if(!el) return;
      el.scrollIntoView({ behavior:"smooth", block:"start" });
      $$(".rail-i").forEach(x => x.classList.remove("on"));
      b.classList.add("on");
      const focusable = el.querySelector("input:not([disabled]), select:not([disabled]), textarea:not([disabled])");
      if(focusable) setTimeout(() => { try{ focusable.focus({ preventScroll:true }); }catch(e){} }, 320);
    });

    const p = PID ? patient(PID) : null;
    if(!p) return;

    /* Source-image capture buttons (stage 3). */
    $$("[data-img]").forEach(b => b.onclick = () =>
      captureSourceImage(p, b.dataset.img, b.dataset.imglabel));

    /* The two scanned device identifiers in stage 4. */
    SCANFIELDS["fail-scan"] = { label:"failed device label", onCode:(code, manual) => {
      const d = findDeviceByCode(code);
      cf(p).failRef = d ? d.ref : code;
      cf(p).failManual = !!manual;
      if(d && !["USED","REJECTED"].includes(d.status)){
        d.status = "REJECTED"; d.condition = "COMPROMISED";
        logAction("Device " + d.ref + " marked rejected after failing during " + p.patientCode, {
          locationId:p.siteId, stateChanges:"→ Rejected", highPriority:true,
          comments: manual ? "identifier HAND-ENTERED" : "identifier scanned" });
      }
      commit(); toast(d ? "Failed device recorded: " + d.ref : "Recorded as typed.", d ? "good" : "bad");
      render();
    }};
    SCANFIELDS["repl-scan"] = { label:"replacement device QR code", onCode:(code, manual) => {
      const d = findDeviceByCode(code);
      cf(p).replRef = d ? d.ref : code;
      cf(p).replManual = !!manual;
      if(d){
        const sizeOk = (d.productType === "UNICA" && d.size === p.unicaSize) ||
                       (d.productType === "DS" && d.size === p.dsSize);
        if(!sizeOk) toast("Careful: " + devName(d) + " does not match this patient's assigned sizing.", "bad");
        d.status = "USED"; d.locationId = p.siteId;
        logAction("Replacement device " + d.ref + " used for " + p.patientCode, {
          locationId:p.siteId, stateChanges:"→ Used", highPriority:true,
          comments:(manual ? "identifier HAND-ENTERED" : "identifier scanned") +
                   (sizeOk ? "" : " | SIZE MISMATCH against assigned " + p.unicaSize) });
      }
      commit(); render();
    }};

    const form = $("#cform");
    if(!form) return;

    function flash(){
      $$(".saved").forEach(s => { s.textContent = "Saved"; });
      clearTimeout(flash._t);
      flash._t = setTimeout(() => $$(".saved").forEach(s => s.textContent = ""), 1200);
    }
    function recalc(){
      const c = cf(p);
      const de = $("#calc-dep"), ss = $("#calc-sts");
      if(de) de.textContent = fmtDur(minsBetween(c.deployStart, c.deployEnd));
      if(ss) ss.textContent = fmtDur(minsBetween(c.dsIn, c.dsOut));
      /* Sys\Dias(Mean) readouts follow the three inputs as they are typed, so the
         operator sees the value in the form it will be reported in. */
      ["ivcPre","ivcPost"].forEach(k => {
        const el = $("#ro-" + k);
        if(!el) return;
        const n = v => (v === "" || v == null) ? "–" : v;
        el.textContent = n(c[k+"Sys"]) + "\\" + n(c[k+"Dias"]) + "(" + n(c[k+"Mean"]) + ")";
      });
    }

    /* "Now" writes the current wall-clock time into the field it belongs to, then
       runs the same save path as a keystroke so nothing is special-cased. */
    form.addEventListener("click", e => {
      const btn = e.target.closest("[data-now]");
      if(!btn || p.fileLocked) return;
      e.preventDefault();
      const key = btn.dataset.now;
      const input = form.querySelector('[data-cf="' + key + '"]');
      if(!input) return;
      const d = new Date();
      input.value = String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
      input.dispatchEvent(new Event("change", { bubbles:true }));
      input.focus();
    });
    /* One delegated handler is the whole autosave mechanism. */
    form.addEventListener("input", onEdit);
    form.addEventListener("change", onEdit);
    function onEdit(e){
      const t = e.target;
      if(p.fileLocked) return;
      let structural = false;
      if(t.dataset.cf){
        cf(p)[t.dataset.cf] = t.type === "checkbox" ? t.checked : t.value;
        /* The case file keeps its own procedure date (c.procDate) but must NOT set the
           workflow status or p.procedureDate. The anatomical Scheduling stage is the single
           source of both (see recomputeWorkflow and the "one place" note on its handler).
           Setting them here as well let a date typed with no hospital or physician force
           SCHEDULED, which the next recomputeWorkflow reverted to ELIGIBLE - so the status
           oscillated depending on which screen was touched last. */
        if(t.dataset.cf === "asExpected" || t.dataset.cf === "notExpectedBranch") structural = true;
      }else if(t.dataset.cfa){
        const k = t.dataset.cfa, i = +t.dataset.i;
        const a = cf(p)[k] || (cf(p)[k] = []);
        a[i] = t.checked;
        t.closest(".check").classList.toggle("on", t.checked);
      }else if(t.dataset.cq){
        p.customQuestions[+t.dataset.cq].a = t.value;
      }else return;
      commit(); flash(); recalc();
      if(structural) render();
    }
    const ma = $("#mark-all");
    if(ma) ma.onclick = () => {
      const cur = cf(p).training || [];
      const all = cur.filter(Boolean).length === TRAINING_ITEMS.length;
      cf(p).training = TRAINING_ITEMS.map(() => !all);
      commit(); render();
    };
    const sv = $("#pt-save");   if(sv) sv.onclick = () => saveDraft(p);
    const sb = $("#pt-submit"); if(sb) sb.onclick = () => submitCase(p);
    const lk = $("#pt-lock");   if(lk) lk.onclick = () => lockCase(p);
  }
};

/* The rail's labels, and what "done" means for each stage. Deliberately the same
   conditions submission enforces, so the ticks and the outstanding list can never
   disagree with each other. */
const STAGES = [
  { label:"Eligibility",   hint:"date and team" },
  { label:"Pre-procedure", hint:"checklists" },
  { label:"Event log",     hint:"times and readings" },
  { label:"Verify & submit", hint:"outcome" }
];
function stageDone(p){
  const c = cf(p);
  const conf = (c.confirms || []).filter(Boolean).length;
  return [
    !!c.procDate,
    conf === DEVICE_CONFIRMS.length,
    !!(c.deployStart && c.deployEnd && c.dsIn && c.dsOut),
    !!c.asExpected && !(c.asExpected === "NO" && !c.notExpectedBranch) &&
      !(c.asExpected === "NO" && c.notExpectedBranch === "ALTERNATIVE" &&
        (!c.failRef || !c.replRef || !c.failReason || !c.failDetail))
  ];
}

/* What submission would still refuse. Shown all the time, so an incomplete file is
   never a surprise at the end - but it never blocks saving. */
function missingForSubmit(p){
  const c = cf(p), out = [];
  if(!c.procDate) out.push("Stage 1 — date of procedure");
  const conf = (c.confirms || []).filter(Boolean).length;
  if(conf < DEVICE_CONFIRMS.length)
    out.push("Stage 2 — device verification (" + conf + " of " + DEVICE_CONFIRMS.length + ")");
  if(!c.asExpected) out.push("Stage 4 — were the devices used as expected");
  else if(c.asExpected === "NO" && !c.notExpectedBranch)
    out.push("Stage 4 — cancelled, or alternative devices used");
  else if(c.asExpected === "NO" && c.notExpectedBranch === "ALTERNATIVE"){
    if(!c.failRef)    out.push("Stage 4 — scan the failed device");
    if(!c.replRef)    out.push("Stage 4 — scan the replacement device");
    if(!c.failReason) out.push("Stage 4 — failure reason");
    if(!c.failDetail) out.push("Stage 4 — failure detail");
  }
  return out;
}
function outstandingList(p){
  const m = missingForSubmit(p);
  if(!m.length) return '<div class="okbox" style="margin:10px 0 0">' +
    'Nothing outstanding — this file can be submitted.</div>';
  return '<div class="warn" style="margin:10px 0 0"><b>' + m.length +
    ' item(s) outstanding for submission.</b> You can still save and come back.' +
    '<ul style="margin:6px 0 0;padding-left:18px">' +
    m.map(x => '<li>' + esc(x) + '</li>').join("") + '</ul></div>';
}

/* An explicit user save. Always succeeds, however much is still blank. */
function saveDraft(p){
  commit();
  const m = missingForSubmit(p);
  logAction("Case file saved as a draft for " + p.patientCode, { locationId:p.siteId,
    stateChanges: m.length ? m.length + " item(s) still outstanding" : "complete, not yet submitted" });
  toast(m.length ? "Saved. " + m.length + " item(s) still outstanding." : "Saved.", "good");
  PID = null;                      // "and close" - back to the site/patient chooser
  render();
}

function submitCase(p){
  const c = cf(p);
  const m = missingForSubmit(p);
  if(m.length){
    showWhy("pt-why", "Not ready to submit — " + m[0] +
      (m.length > 1 ? ", and " + (m.length - 1) + " other item(s) listed below" : "") +
      ". Save and close still works.");
    return;
  }
  clearWhy("pt-why");

  p.submitted = true;
  if(c.asExpected === "NO" && c.notExpectedBranch === "CANCELLED" && p.status !== "CANCELLED"){
    p.status = "CANCELLED";
    logAction("Procedure cancelled for " + p.patientCode, { locationId:p.siteId,
      stateChanges:"→ Cancelled", highPriority:true });
  }
  logAction("Case file submitted for " + p.patientCode, { locationId:p.siteId,
    stateChanges:"submitted = true", comments:"Editable until the final permanent lock" });
  commit(); toast("Case file submitted. Still editable until locked.", "good"); render();
}
function lockCase(p){
  if(!can("lockCaseFile")) return toast("Only a Clinical PM or App Admin can lock a case file.", "bad");
  /* The only irreversible action in the app that a normal day's work reaches.
     Typing the code is friction on purpose — it makes locking the wrong patient's
     file something you have to mean. */
  modal("Final permanent lock",
    '<p>Locking <b>' + esc(p.patientCode) + '</b> makes every field read-only for good and ' +
    'archives the complete case file to OneDrive.</p>' +
    '<div class="warn"><b>This cannot be undone.</b> Nobody, including an App Admin, ' +
    'can reopen the file afterwards.</div>' +
    '<div class="field"><label class="req" for="lk-code">Type <b>' + esc(p.patientCode) +
      '</b> to confirm</label><input type="text" id="lk-code" autocomplete="off"></div>' +
    whyBox("lk-why"),
    '<div class="row"><button class="btn" data-close="1">Cancel</button>' +
    '<button class="btn btn-dark" id="lk-go">Lock permanently</button></div>');
  $("#lk-go").onclick = () => {
    const typed = ($("#lk-code").value || "").trim();
    if(typed.toUpperCase() !== String(p.patientCode).toUpperCase())
      return showWhy("lk-why", "That does not match. Type " + p.patientCode + " exactly.");
    p.fileLocked = true;
    if(p.status !== "CANCELLED") p.status = "TREATED";
    queueBackup(locName(p.siteId) + "/Clinical_Procedures",
      "case_" + p.patientCode + "_locked.json",
      { type:"CLINICAL_CASE_FILE", patientCode:p.patientCode, site:locName(p.siteId),
        unicaSize:p.unicaSize, dsSize:p.dsSize, status:p.status,
        caseFile:p.caseFile, customQuestions:p.customQuestions,
        lockedBy:S.me.email, lockedAt:nowISO() });
    logAction("Case file permanently locked for " + p.patientCode, { locationId:p.siteId,
      stateChanges:"fileLocked = true; status → " + PT_STATUS[p.status].label,
      comments:"Archived to Clinical_Procedures" });
    commit(); closeModal(); toast("Locked and archived.", "good"); render();
  };
}

let SH = null;
function resetShip(){
  SH = { originId: S.me.locationId || "", productType:"UNICA", size:"M",
         destId:"", deviceId:"", shipper:S.me.name, override:false, initials:"", reason:"",
         lines:[] };
  saveDrafts();
}
function restoreShip(){
  const d = loadDrafts().sh;
  if(!d || typeof d !== "object") return false;
  if(d.originId && !loc(d.originId)) d.originId = "";
  if(d.destId && !loc(d.destId)) d.destId = "";
  if(d.deviceId && !device(d.deviceId)) d.deviceId = "";
  if(!Array.isArray(d.lines)) d.lines = [];
  /* A draft can outlive the units it referenced - a line whose device has since been
     used or shipped must not silently ship again. */
  d.lines = d.lines.filter(l => !l.deviceId || device(l.deviceId));
  SH = d;
  return true;
}
